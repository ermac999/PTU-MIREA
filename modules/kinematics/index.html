<!doctype html><html lang="ru"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Кинематика на зачёт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: одна колонка-«тетрадь» на миллиметровке, как в конспектах; карта уровней — вертикальная ось с точками-станциями; ошибки помечены «красной ручкой» */
:root{
  --paper:#F5F7F2;--grid:rgba(48,92,170,.12);--grid-2:rgba(48,92,170,.24);
  --card:#FFFFFF;--card-2:#ECF0F7;--ink:#15223D;--ink-2:#4A5674;--line:#D2DAE6;
  --accent:#2B53D3;--on-accent:#FFFFFF;--pen:#C4332A;--on-pen:#FFFFFF;--ok:#17804F;
  --hi:#FFD23F;--on-hi:#2E2400;--margin:rgba(196,51,42,.28);--shade:rgba(21,34,61,.34);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1D38;--grid:rgba(140,185,255,.09);--grid-2:rgba(140,185,255,.2);
  --card:#122849;--card-2:#1A355E;--ink:#E9F0FF;--ink-2:#A6B7D6;--line:#2A4774;
  --accent:#8AABFF;--on-accent:#0C1D38;--pen:#FF7A6C;--on-pen:#240A06;--ok:#55D59C;
  --hi:#FFD23F;--on-hi:#2E2400;--margin:rgba(255,122,108,.3);--shade:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1D38;--grid:rgba(140,185,255,.09);--grid-2:rgba(140,185,255,.2);
  --card:#122849;--card-2:#1A355E;--ink:#E9F0FF;--ink-2:#A6B7D6;--line:#2A4774;
  --accent:#8AABFF;--on-accent:#0C1D38;--pen:#FF7A6C;--on-pen:#240A06;--ok:#55D59C;
  --hi:#FFD23F;--on-hi:#2E2400;--margin:rgba(255,122,108,.3);--shade:rgba(0,0,0,.55);color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.5;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;-webkit-text-size-adjust:100%}
@media (min-width:900px){body::before{content:"";position:fixed;top:0;bottom:0;left:calc(50% - 430px);width:2px;background:var(--margin);pointer-events:none}}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:8px 72px}
h1,h2,h3{text-wrap:balance}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .in{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.brand svg{flex:none;width:30px;height:22px}
.brand b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save i{width:9px;height:9px;border-radius:50%;background:var(--ink-2);flex:none}
.save[data-s="cloud"] i{background:var(--ok)}
.save[data-s="saving"] i{background:var(--hi)}
.save[data-s="none"] i{background:var(--pen)}
@media (max-width:560px){.save span{display:none}}
.stotal{font-family:var(--mono);font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--hi);color:var(--on-hi);white-space:nowrap;font-variant-numeric:tabular-nums}
.stotal .star{width:16px;height:16px}
.icon-btn{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn.home{text-decoration:none;color:var(--ink)}

/* кнопки */
.btn{appearance:none;border:0;border-radius:12px;padding:11px 18px;font-weight:600;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;transition:transform .08s ease}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.warn{background:var(--pen);color:var(--on-pen)}
.btn.sm{min-height:40px;padding:7px 12px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;justify-content:flex-end}
.actions.center{justify-content:center}

/* карта */
.eyebrow{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0}
.hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;margin-top:16px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,5.6vw,36px);line-height:1.1;margin:0}
.hero p{margin:0;color:var(--ink-2)}
.hero .actions{justify-content:flex-start;margin-top:4px}
.bar{height:10px;border-radius:99px;background:var(--card-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;min-width:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.weak{margin-top:16px;padding:14px 16px;border-radius:var(--r);border:1.5px dashed var(--pen);background:var(--card)}
.weak h3{font-family:var(--hand);font-size:30px;line-height:1;color:var(--pen);margin:0 0 6px;font-weight:700}
.weak p{margin:0 0 10px;color:var(--ink-2);font-size:15px}
.wl{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{appearance:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:15px;min-height:40px}
.chipbtn b{color:var(--pen);margin-left:4px;font-family:var(--mono)}
.chapter{margin-top:28px}
.chapter h2{font-family:var(--display);font-weight:800;font-size:20px;margin:6px 0 8px}
.track{list-style:none;margin:0;padding:0}
.st{display:grid;grid-template-columns:52px minmax(0,1fr)}
.axis{position:relative}
.axis::before{content:"";position:absolute;left:25px;top:0;bottom:0;width:2px;background:var(--grid-2)}
.st:first-child .axis::before{top:30px}
.st:last-child .axis::before{bottom:calc(100% - 30px)}
.node{position:absolute;left:8px;top:13px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:14px;background:var(--card);border:2px solid var(--grid-2);color:var(--ink-2)}
.st.done .node{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.st.now .node{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--card-2)}
.lv{appearance:none;margin:6px 0;display:grid;gap:4px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.lv:hover:not([disabled]){border-color:var(--accent)}
.lv-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.lv-t{font-weight:600;font-size:16px;min-width:0}
.lv-bot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.st.locked .lv{opacity:.55;cursor:not-allowed}
.lock{width:16px;height:16px;flex:none}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor}
.tag.acc{color:var(--accent)}
.tag.pen{color:var(--pen)}
.stars{display:inline-flex;gap:2px;flex:none}
.star{width:18px;height:18px;fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linejoin:round}
.star.on{fill:var(--hi);stroke:var(--on-hi)}
.fm{font-family:var(--mono);font-weight:500;font-size:.9em;white-space:nowrap;background:var(--card-2);padding:1px 6px;border-radius:6px}

/* уровень */
.lvhead{display:grid;gap:10px;margin-top:14px}
.crumbs{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mist{font-family:var(--mono);font-size:13px;color:var(--pen);margin-left:auto}
.lvhead h1{font-family:var(--display);font-weight:800;font-size:clamp(20px,4.6vw,28px);margin:0;line-height:1.15}
.ruler{display:flex;gap:4px;align-items:flex-end;height:20px}
.ruler i{flex:1;height:9px;border-radius:3px;background:var(--card-2);border:1px solid var(--line)}
.ruler i.done{background:var(--accent);border-color:var(--accent)}
.ruler i.miss{background:var(--pen);border-color:var(--pen)}
.ruler i.cur{height:18px;border:2px solid var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px}
.intro .big{font-family:var(--mono);font-weight:700;font-size:clamp(22px,5.4vw,34px);line-height:1.2;color:var(--accent);margin:6px 0 14px;overflow-wrap:anywhere}
.intro ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.intro li{padding-left:24px;position:relative}
.intro li::before{content:"";position:absolute;left:4px;top:.6em;width:8px;height:8px;background:var(--accent);border-radius:2px}
.q{font-size:19px;line-height:1.45;margin:8px 0 12px}
.vis{margin:4px 0 14px;overflow-x:auto}
.vis svg{display:block;width:100%;height:auto;max-width:640px;margin:0 auto}
.numrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.numrow input{font-family:var(--mono);font-size:24px;font-weight:700;flex:1 1 140px;max-width:220px;min-width:0;padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.numrow input:focus{border-color:var(--accent);outline:none}
.numrow input:disabled{opacity:1}
.numrow.right input{border-color:var(--ok)}
.unit{font-family:var(--mono);font-size:18px;color:var(--ink-2)}
.pm{min-width:48px;font-family:var(--mono);font-size:20px}
.opts{display:grid;gap:10px}
@media (min-width:600px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{appearance:none;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;font-size:17px;cursor:pointer;min-height:52px}
.opt.mono{font-family:var(--mono);font-weight:500}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.no{border-color:var(--pen);color:var(--pen);text-decoration:line-through}
.opt.yes{border-color:var(--ok);color:var(--ok);font-weight:600}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start;min-width:0}
.mi{appearance:none;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:15px;text-align:left;cursor:pointer;min-height:48px;overflow-wrap:anywhere}
.mi.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--card-2)}
.mi.ok{border-color:var(--ok);color:var(--ok);cursor:default}
.mi.bad{border-color:var(--pen);animation:shake .35s}
.signs{display:flex;flex-wrap:wrap;gap:14px 28px}
.sg{display:flex;align-items:center;gap:10px}
.sg b{font-family:var(--mono);font-size:17px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--paper);font-family:var(--mono);font-size:22px;font-weight:700;width:56px;height:48px;cursor:pointer}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;display:grid;gap:6px;background:var(--card)}
.fb.ok{border:2px solid var(--ok)}
.fb.no{border:2px dashed var(--pen)}
.fb.hint,.fb.warn{border:2px solid var(--line);background:var(--paper)}
.pen-t{font-family:var(--hand);font-size:30px;line-height:1;color:var(--pen);font-weight:700}
.okh{font-weight:700;color:var(--ok)}
.sol{font-size:16px}
.game .ctrl{display:grid;gap:8px;margin-top:4px}
.game label{font-weight:600;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.val{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.game input[type=range]{width:100%;accent-color:var(--accent);height:34px;margin:0}
.gbtns{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.gres{font-weight:600}

/* итоги */
.res{text-align:center;display:grid;gap:14px;justify-items:center;padding-block:26px}
.mark{font-family:var(--hand);font-weight:700;font-size:92px;line-height:1;color:var(--pen);width:128px;height:128px;border:4px solid var(--pen);border-radius:50%;display:grid;place-items:center;transform:rotate(-8deg)}
.stars.big .star{width:46px;height:46px}
.stars.big .star.on{animation:pop .5s both}
.stars.big .star:nth-child(2){animation-delay:.12s}
.stars.big .star:nth-child(3){animation-delay:.24s}
.rtext{margin:0;max-width:46ch;color:var(--ink-2)}
.res h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0}

/* настройки и сообщения */
.sheet{position:fixed;inset:0;z-index:50;background:var(--shade);display:grid;align-items:end;justify-items:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}}
.panel{width:min(560px,100%);background:var(--card);border-radius:18px;border:1px solid var(--line);padding:20px;display:grid;gap:12px;max-height:85vh;overflow:auto}
.panel h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0}
.panel p{margin:0}
.panel hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.danger{display:grid;gap:10px;border:2px dashed var(--pen);border-radius:12px;padding:12px 14px}
.danger .actions{margin-top:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}

/* рисунки */
.svgt{font-family:var(--mono)}
.f-ink{fill:var(--ink)}.f-ink2{fill:var(--ink-2)}.f-acc{fill:var(--accent)}.f-pen{fill:var(--pen)}.f-ok{fill:var(--ok)}
.f-hi{fill:var(--hi)}.f-card{fill:var(--card)}.f-card2{fill:var(--card-2)}.f-paper{fill:var(--paper)}.f-none{fill:none}
.s-ink{stroke:var(--ink)}.s-ink2{stroke:var(--ink-2)}.s-acc{stroke:var(--accent)}.s-pen{stroke:var(--pen)}.s-ok{stroke:var(--ok)}
.s-line{stroke:var(--line)}.s-grid{stroke:var(--grid-2)}.s-hi{stroke:var(--hi)}
.hiA{fill:var(--hi);fill-opacity:.5}

/* вкладки */
.tabbar{max-width:780px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px}
.tab{appearance:none;flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;min-height:42px;font-weight:700;font-size:15px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* листание решённых заданий */
.ruler .rs{appearance:none;flex:1;height:9px;padding:0;margin:0;border-radius:3px;border:1px solid var(--accent);background:var(--accent);cursor:pointer;position:relative}
.ruler .rs.miss{background:var(--pen);border-color:var(--pen)}
.ruler .rs::after{content:"";position:absolute;left:0;right:0;top:-14px;bottom:-10px}
.ruler .rs.view{height:18px;box-shadow:0 0 0 3px var(--card-2)}
.peek-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag.ok{color:var(--ok)}
.pairs{margin:0 0 4px;padding-left:20px;display:grid;gap:6px}
.swipe-hint{margin-right:auto;align-self:center;font-size:13px;color:var(--ink-2)}
.back{margin-right:auto}

/* нарешка */
.dcount{font-family:var(--mono);font-size:13px;color:var(--ink-2);white-space:nowrap}
.glist{list-style:none;margin:6px 0 0;padding:0}
.gname{margin:0;color:var(--ink-2);font-weight:600}
.streak{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ok);margin-left:auto}
details.theory{margin-top:14px}
details.theory summary{cursor:pointer;font-weight:600;list-style-position:inside}
details.theory .big{font-family:var(--mono);font-weight:700;font-size:clamp(18px,4.6vw,26px);color:var(--accent);margin:10px 0;overflow-wrap:anywhere}
details.theory ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
details.theory li{padding-left:22px;position:relative}
details.theory li::before{content:"";position:absolute;left:4px;top:.6em;width:7px;height:7px;background:var(--accent);border-radius:2px}
.dmix{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<marker id="ah-ink" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 z" class="f-ink"/></marker>
<marker id="ah-ink2" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 z" class="f-ink2"/></marker>
<marker id="ah-acc" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 z" class="f-acc"/></marker>
<marker id="ah-pen" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 z" class="f-pen"/></marker>
<marker id="ah-ok" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 z" class="f-ok"/></marker>
</defs></svg>

<header class="top"><div class="in">
  <a class="icon-btn home" href="../../#subject/phys" aria-label="Назад в «Рамки»"><svg viewBox="0 0 24 24" aria-hidden="true" class="f-none s-ink" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
  <div class="brand"><svg viewBox="0 0 30 22" aria-hidden="true"><path d="M2 20 Q15 -6 28 20" class="f-none s-acc" stroke-width="2.5" stroke-dasharray="3 3"/><circle cx="21" cy="9" r="3.5" class="f-pen"/></svg><b>Кинематика на зачёт</b></div>
  <div class="save" id="save" data-s="local" title="Сохранено на этом устройстве"><i></i><span>На устройстве</span></div>
  <div class="stotal" id="stotal" aria-label="Звёзды">0/48</div>
  <button class="icon-btn" data-act="settings" aria-label="Сохранение и сброс прогресса"><svg viewBox="0 0 24 24" aria-hidden="true" class="f-none s-ink" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
</div>
<div class="tabbar" role="group" aria-label="Разделы"><button class="tab" data-act="tab" data-tab="levels" aria-pressed="true">Уровни</button><button class="tab" data-act="tab" data-tab="drill" aria-pressed="false">Нарешка</button></div>
</header>
<main class="wrap" id="main"></main>
<div id="overlay"></div>
<script>
// ===== утилиты =====
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rich = s => String(s ?? '').replace(/\{([^{}]+)\}/g, '<span class="fm">$1</span>');
const clone = o => JSON.parse(JSON.stringify(o));
const pick = a => a[Math.floor(Math.random() * a.length)];
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function fmt(x, d = 2) {
  if (!isFinite(x)) return '—';
  const r = Math.round(x * 10 ** d) / 10 ** d;
  let s = String(Math.abs(r));
  if (s.includes('e')) s = Math.abs(r).toFixed(d);
  return (r < 0 ? '−' : '') + s.replace('.', ',');
}
function parseNum(s) {
  s = String(s).trim().replace(/\s+/g, '').replace(/[−–—]/g, '-').replace(',', '.');
  if (!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  return parseFloat(s);
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ===== прогресс: браузер + аккаунт =====
const KEY = 'kin-zachet-v1';
const emptyProg = () => ({ v: 1, levels: {}, miss: {}, drill: {}, current: null, updatedAt: 0, resetAt: 0 });
let localOK = false;
try { localStorage.setItem(KEY + '-t', '1'); localStorage.removeItem(KEY + '-t'); localOK = true; } catch (e) { localOK = false; }
function loadLocal() {
  try { const s = localStorage.getItem(KEY); if (!s) return null; const p = JSON.parse(s); return p && p.v === 1 ? p : null; } catch (e) { return null; }
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(P)); return true; } catch (e) { return false; } }

// Слияние двух сохранений: сброс выигрывает, если он новее; иначе берём лучшее по каждому уровню
function mergeProg(a, b) {
  if (!b || b.v !== 1) return a;
  if (!a) return clone(b);
  if ((b.resetAt || 0) > (a.updatedAt || 0)) return clone(b);
  if ((a.resetAt || 0) > (b.updatedAt || 0)) return a;
  const out = emptyProg();
  out.resetAt = Math.max(a.resetAt || 0, b.resetAt || 0);
  const ids = new Set([...Object.keys(a.levels || {}), ...Object.keys(b.levels || {})]);
  for (const id of ids) {
    const x = (a.levels || {})[id], y = (b.levels || {})[id];
    if (!x || !y) { out.levels[id] = clone(x || y); continue; }
    out.levels[id] = { stars: Math.max(x.stars || 0, y.stars || 0), best: Math.min(x.best ?? 99, y.best ?? 99), plays: Math.max(x.plays || 0, y.plays || 0), at: Math.max(x.at || 0, y.at || 0) };
  }
  const mk = new Set([...Object.keys(a.miss || {}), ...Object.keys(b.miss || {})]);
  for (const k of mk) out.miss[k] = Math.max((a.miss || {})[k] || 0, (b.miss || {})[k] || 0);
  const dk = new Set([...Object.keys(a.drill || {}), ...Object.keys(b.drill || {})]);
  for (const k of dk) {
    const x = (a.drill || {})[k] || {}, y = (b.drill || {})[k] || {};
    out.drill[k] = { n: Math.max(x.n || 0, y.n || 0), ok: Math.max(x.ok || 0, y.ok || 0) };
  }
  const newer = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b;
  out.current = newer.current ? clone(newer.current) : null;
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return out;
}

const SAVE = {
  cloud: ['Сохранено', 'Сохранено в аккаунте', 'Прогресс хранится вместе с игрой в твоём аккаунте Claude. Можно закрыть и вернуться позже, в том числе с другого устройства. Claude в нашем чате тоже может посмотреть твои результаты и слабые места.'],
  saving: ['Сохраняю…', 'Сохраняю', 'Отправляю прогресс в аккаунт.'],
  local: ['На устройстве', 'Сохранено на этом устройстве', 'Прогресс хранится в этом браузере: можно закрыть игру и вернуться. С другого устройства его видно не будет.'],
  none: ['Не сохраняется', 'Прогресс не сохраняется', 'Браузер не даёт сохранять данные, например в приватном режиме. Играть можно, но после закрытия прогресс пропадёт.'],
};
const SYNC = { ref: null, state: localOK ? 'local' : 'none' };
let pushTimer = null, pushing = false, pushAgain = false;
function setSave(s) {
  SYNC.state = s;
  const el = $('#save');
  if (el) { el.dataset.s = s; el.querySelector('span').textContent = SAVE[s][0]; el.title = SAVE[s][1]; }
  if (typeof sheet !== 'undefined' && sheet) renderSheet();
}
function save() {
  P.updatedAt = Date.now();
  const ok = saveLocal();
  if (SYNC.ref) schedulePush(); else setSave(ok ? 'local' : 'none');
}
function schedulePush() { if (!SYNC.ref) return; setSave('saving'); clearTimeout(pushTimer); pushTimer = setTimeout(() => { pushTimer = null; pushCloud(); }, 900); }
async function pushCloud(retry = true) {
  if (!SYNC.ref) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  try { await SYNC.ref.set(clone(P)); setSave('cloud'); }
  catch (e) {
    if (retry && e && e.code === 'unavailable') { pushing = false; setTimeout(() => pushCloud(false), 1500 + Math.random() * 1500); return; }
    setSave(localOK ? 'local' : 'none');
  }
  pushing = false;
  if (pushAgain) { pushAgain = false; pushCloud(); }
}
async function initSync() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { return; }
  if (!db || !user) return;
  let uid = null;
  try { uid = await user.id(); } catch (e) { uid = null; }
  if (!uid) return;
  let ref;
  try { ref = db.doc('saves/' + uid); } catch (e) { return; }
  setSave('saving');
  try {
    const snap = await ref.get();
    if (snap.exists) {
      const merged = mergeProg(P, snap.data());
      const changed = JSON.stringify(merged) !== JSON.stringify(P);
      P = merged; saveLocal();
      if (changed && (view === 'map' || view === 'result')) render();
      else updateTop();
    }
    SYNC.ref = ref;
    await pushCloud();
  } catch (e) { SYNC.ref = null; setSave(localOK ? 'local' : 'none'); }
}
function flushCloud() { if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; pushCloud(); } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushCloud(); });
window.addEventListener('pagehide', flushCloud);

// ===== рисунки (SVG) =====
const svg = (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${inner}</svg>`;
const ln = (x1, y1, x2, y2, c = 'ink', w = 2, extra = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="s-${c}" stroke-width="${w}" ${extra}/>`;
const ar = (x1, y1, x2, y2, c = 'acc', w = 4) => ln(x1, y1, x2, y2, c, w, `marker-end="url(#ah-${c})"`);
const tx = (x, y, s, c = 'ink', size = 14, anchor = 'middle', weight = 500) => `<text x="${x}" y="${y}" class="svgt f-${c}" font-size="${size}" text-anchor="${anchor}" font-weight="${weight}">${s}</text>`;
const DASH = 'stroke-dasharray="6 6"';
// машина: перёд в точке (0,0), колёса стоят на y = 0
const carShape = (c = 'acc') => `<path class="f-${c}" d="M-70,-9 L-70,-21 Q-69,-25 -64,-25 L-50,-26 L-40,-37 Q-38,-39 -35,-39 L-14,-39 Q-11,-39 -9,-36 L0,-25 Q2,-24 2,-20 L2,-9 Z"/><path class="f-paper" opacity=".8" d="M-37,-36 L-15,-36 L-7,-26 L-43,-26 Z"/><circle cx="-56" cy="-8" r="8" class="f-ink"/><circle cx="-13" cy="-8" r="8" class="f-ink"/>`;
const STAR = '<path d="M12 2.6l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.2 1.3-6.6-4.9-4.6 6.6-.8z"/>';

const V = {
  road() {
    const X = m => 90 + m * 15;
    let g = `<rect x="12" y="98" width="576" height="22" rx="4" class="f-card2"/>`;
    for (let m = 0; m <= 30; m += 5) g += ln(X(m), 120, X(m), 130, 'ink2', 2) + tx(X(m), 148, m === 0 ? '0 м' : String(m), 'ink2', 13);
    g += `<g transform="translate(${X(0) + 2},99)">${carShape()}</g>`;
    g += ar(X(0) - 30, 38, X(0) + 60, 38, 'acc', 4) + tx(X(0) + 76, 43, 'v = 5 м/с', 'acc', 15, 'start', 700);
    return svg(600, 160, g, 'Машина у отметки 0 м, дорога размечена через каждые 5 метров');
  },
  graph({ v0 = 0, v1, t }) {
    const ox = 70, oy = 250, tw = 460, vh = 190, tm = t * 1.18, vm = Math.max(v0, v1) * 1.18;
    const X = s => ox + s / tm * tw, Y = v => oy - v / vm * vh;
    let g = `<polygon points="${X(0)},${oy} ${X(0)},${Y(v0)} ${X(t)},${Y(v1)} ${X(t)},${oy}" class="hiA"/>`;
    if (v0 > 0) g += ln(X(0), Y(v0), X(t), Y(v0), 'ink2', 1.5, DASH);
    g += ln(X(t), Y(v1), X(t), oy, 'ink2', 1.5, 'stroke-dasharray="5 5"') + ln(ox, Y(v1), X(t), Y(v1), 'ink2', 1.5, 'stroke-dasharray="5 5"');
    g += ar(ox, oy, ox + tw + 44, oy, 'ink', 2) + ar(ox, oy, ox, oy - vh - 36, 'ink', 2);
    g += ln(X(0), Y(v0), X(t), Y(v1), 'acc', 4, 'stroke-linecap="round"');
    g += tx(ox + tw + 44, oy + 28, 't, с', 'ink', 17, 'end') + tx(ox + 10, oy - vh - 26, 'v, м/с', 'ink', 17, 'start');
    g += tx(X(t), oy + 24, fmt(t), 'ink', 17) + tx(ox - 10, Y(v1) + 6, fmt(v1), 'ink', 17, 'end') + tx(ox - 10, oy + 6, '0', 'ink2', 15, 'end');
    if (v0 > 0) g += tx(ox - 10, Y(v0) + 6, fmt(v0), 'ink', 17, 'end');
    g += tx(X(t * 0.62), oy - (oy - Y(v0 + (v1 - v0) * 0.62)) * 0.42, 's', 'ink', 24, 'middle', 700);
    return svg(600, 285, g, 'График скорости от времени, площадь под графиком закрашена');
  },
  vec({ x, y }) {
    const ox = 300, oy = 292, c = 30, X = i => ox + i * c, Y = j => oy - j * c;
    let g = '';
    for (let i = -9; i <= 9; i++) g += ln(X(i), Y(0), X(i), Y(9), 'grid', 1);
    for (let j = 1; j <= 9; j++) g += ln(X(-9), Y(j), X(9), Y(j), 'grid', 1);
    g += ar(X(-9.4), oy, X(9.6), oy, 'ink', 2) + ar(ox, oy + 8, ox, Y(9.6), 'ink', 2);
    g += tx(X(9.6) - 6, oy - 10, 'x', 'ink', 16, 'end', 700) + tx(ox + 12, Y(9.6) + 14, 'y', 'ink', 16, 'start', 700);
    for (let i = -8; i <= 8; i += 2) if (i) g += tx(X(i), oy + 22, fmt(i), 'ink2', 15);
    for (let j = 2; j <= 8; j += 2) g += tx(ox + (x < 0 ? 10 : -8), Y(j) + 5, String(j), 'ink2', 15, x < 0 ? 'start' : 'end');
    g += ln(X(x), Y(y), X(x), oy, 'ink2', 1.5, DASH) + ln(X(x), Y(y), ox, Y(y), 'ink2', 1.5, DASH);
    g += ln(ox, oy, X(x), oy, 'ok', 7, 'stroke-linecap="round" opacity=".8"') + ln(ox, oy, ox, Y(y), 'ok', 7, 'stroke-linecap="round" opacity=".8"');
    g += tx(X(x / 2), oy - 12, 'ax', 'ok', 15, 'middle', 700) + tx(ox + (x < 0 ? 14 : -14), Y(y / 2) + 5, 'ay', 'ok', 15, x < 0 ? 'start' : 'end', 700);
    g += ar(ox, oy, X(x), Y(y), 'acc', 5) + `<circle cx="${ox}" cy="${oy}" r="5" class="f-ink"/>`;
    g += tx(X(x / 2) + (x < 0 ? 22 : -22), Y(y / 2) - 8, 'a', 'acc', 22, 'middle', 700);
    return svg(600, 320, g, 'Вектор на клетчатой сетке, одна клетка равна единице');
  },
  fall() {
    const ys = [0, 1, 2, 3, 4, 5].map(n => 26 + 12 * n * n);
    let g = ln(150, 12, 150, 336, 'ink2', 1.5, 'stroke-dasharray="4 6"');
    ys.forEach((y, n) => {
      g += `<circle cx="150" cy="${y}" r="${n === 5 ? 11 : 9}" class="${n === 5 ? 'f-pen' : 'f-acc'}"${n < 5 ? ` opacity="${(0.35 + n * 0.13).toFixed(2)}"` : ''}/>`;
      g += tx(118, y + 5, n === 0 ? '0' : `${n} с`, 'ink2', 13, 'end');
    });
    for (let n = 0; n < 5; n++) {
      const a = ys[n] + 2, b = ys[n + 1] - 2;
      g += ln(190, a, 190, b, 'ink', 1.5) + ln(185, a, 195, a, 'ink', 1.5) + ln(185, b, 195, b, 'ink', 1.5) + tx(206, (a + b) / 2 + 5, String(2 * n + 1), 'ink', 15, 'start', 700);
    }
    return svg(320, 345, g, 'Падающий шарик через каждую секунду: расстояния растут как 1, 3, 5, 7, 9');
  },
  curve() {
    const P0 = { x: 150, y: 140.2 }, u = { x: 0.866, y: -0.5 }, n = { x: 0.5, y: 0.866 };
    let g = `<path d="M 18 297.4 A 300 300 0 0 1 582 297.4" class="f-none s-line" stroke-width="7"/>`;
    g += ln(P0.x, P0.y, 259.6, 330, 'ink2', 1.5, DASH) + tx(232, 306, 'R', 'ink2', 16, 'end', 700);
    g += ar(P0.x, P0.y, P0.x + 120 * u.x, P0.y + 120 * u.y, 'acc', 4) + tx(P0.x + 124 * u.x + 8, P0.y + 124 * u.y - 4, 'v', 'acc', 18, 'start', 700);
    const q = { x: P0.x - 16 * n.x, y: P0.y - 16 * n.y };
    g += ar(q.x, q.y, q.x + 62 * u.x, q.y + 62 * u.y, 'pen', 6) + tx(q.x - 6, q.y - 8, 'aτ', 'pen', 17, 'end', 700);
    g += ar(P0.x, P0.y, P0.x + 95 * n.x, P0.y + 95 * n.y, 'ok', 6) + tx(P0.x + 95 * n.x + 10, P0.y + 95 * n.y + 10, 'an', 'ok', 17, 'start', 700);
    const e = { x: P0.x + 62 * u.x + 95 * n.x, y: P0.y + 62 * u.y + 95 * n.y };
    g += ln(P0.x, P0.y, e.x, e.y, 'ink', 2.5, `stroke-dasharray="7 5" marker-end="url(#ah-ink)"`) + tx(e.x + 10, e.y + 6, 'a', 'ink', 17, 'start', 700);
    g += `<circle cx="${P0.x}" cy="${P0.y}" r="7" class="f-ink"/>`;
    return svg(600, 330, g, 'Точка на повороте: скорость по касательной, касательное ускорение вдоль неё, нормальное к центру');
  },
  wheel() {
    const cx = 300, cy = 165, r = 115;
    let g = `<circle cx="${cx}" cy="${cy}" r="${r}" class="f-card2 s-ink" stroke-width="3"/>`;
    for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + Math.PI / 6; g += ln(cx, cy, (cx + r * Math.cos(a)).toFixed(1), (cy + r * Math.sin(a)).toFixed(1), 'ink2', 2); }
    g += ln(cx, cy, cx, cy - r, 'pen', 3, DASH) + tx(cx + 10, cy - r / 2, 'R = 0,5 м', 'pen', 15, 'start', 700);
    g += `<path d="M ${cx - 40} ${cy + 26} A 48 48 0 1 1 ${cx + 40} ${cy + 26}" class="f-none s-ink" stroke-width="3" marker-end="url(#ah-ink)"/>` + tx(cx, cy + 92, 'ω = 10 рад/с', 'ink', 15, 'middle', 700);
    g += `<circle cx="${cx}" cy="${cy}" r="7" class="f-ink"/><circle cx="${cx}" cy="${cy - r}" r="9" class="f-acc"/>`;
    g += ar(cx, cy - r, cx + 125, cy - r, 'acc', 4) + tx(cx + 134, cy - r + 6, 'v', 'acc', 18, 'start', 700);
    return svg(600, 300, g, 'Колесо радиусом 0,5 м вращается с угловой скоростью 10 рад/с, точка на ободе движется по касательной');
  },
  proj({ v0, ang }) {
    const r = ang * Math.PI / 180, L = v0 * v0 * Math.sin(2 * r) / 10, H = (v0 * Math.sin(r)) ** 2 / 20;
    const k = Math.min(500 / L, 215 / H), x0 = 50, y0 = 268, ax = x0 + L / 2 * k, ay = y0 - H * k, len = 110;
    let s = `<rect x="0" y="${y0}" width="600" height="30" class="f-card2"/>` + ln(0, y0, 600, y0, 'ink', 2);
    s += `<path d="M ${x0} ${y0} Q ${ax} ${y0 - 2 * H * k} ${x0 + L * k} ${y0}" class="f-none s-ink2" stroke-width="2.5" stroke-dasharray="7 7"/>`;
    s += ar(x0, y0, x0 + len * Math.cos(r), y0 - len * Math.sin(r), 'acc', 4) + tx(x0 + len * Math.cos(r) + 12, y0 - len * Math.sin(r) + 4, 'v₀', 'acc', 17, 'start', 700);
    s += `<circle cx="${ax}" cy="${ay}" r="8" class="f-ink"/>` + ar(ax, ay, ax + len * Math.cos(r), ay, 'acc', 4) + tx(ax + len * Math.cos(r) + 8, ay + 6, 'vx', 'acc', 17, 'start', 700);
    s += ar(ax, ay, ax, ay + 70, 'pen', 3) + tx(ax - 10, ay + 62, 'g', 'pen', 17, 'end', 700) + tx(ax, ay - 16, 'vy = 0', 'ink', 14);
    s += `<circle cx="${x0}" cy="${y0}" r="6" class="f-ink"/>` + tx(x0 + 52, y0 - 10, `${ang}°`, 'ink2', 13, 'start');
    return svg(600, 298, s, 'Траектория броска под углом: в верхней точке скорость горизонтальна, а ускорение g направлено вниз');
  },
  scene({ axis, dir, label }) {
    const hor = axis === 'right' || axis === 'left';
    let g = '';
    if (hor) {
      const d = dir === 'right' ? 1 : -1, front = 300 + d * 35;
      g += `<rect x="20" y="146" width="560" height="14" rx="3" class="f-card2"/>`;
      g += `<g transform="translate(${front},146) scale(${d},1)">${carShape()}</g>`;
      g += ar(300 - d * 40, 84, 300 + d * 70, 84, 'acc', 5) + tx(300 + d * 86, 90, 'v', 'acc', 20, d > 0 ? 'start' : 'end', 700);
      g += tx(300, 40, label, 'ink', 22, 'middle', 600);
      const a1 = axis === 'right' ? 60 : 540, a2 = axis === 'right' ? 540 : 60;
      g += ar(a1, 196, a2, 196, 'ink', 2.5) + tx(a2 + (axis === 'right' ? -4 : 4), 184, 'x', 'ink', 18, axis === 'right' ? 'end' : 'start', 700);
      return svg(600, 215, g, `Ось x направлена ${axis === 'right' ? 'вправо' : 'влево'}, машина ${label}`);
    }
    const up = axis === 'up', vu = dir === 'up';
    g += ar(120, up ? 232 : 28, 120, up ? 28 : 232, 'ink', 2.5) + tx(136, up ? 40 : 226, 'y', 'ink', 18, 'start', 700);
    g += `<circle cx="300" cy="130" r="20" class="f-acc"/>`;
    g += ar(300, vu ? 106 : 154, 300, vu ? 36 : 224, 'acc', 5) + tx(316, vu ? 54 : 214, 'v', 'acc', 20, 'start', 700);
    label.split('\n').forEach((s, i) => { g += tx(352, 122 + i * 28, s, 'ink', 21, 'start', 600); });
    return svg(600, 260, g, `Ось y направлена ${up ? 'вверх' : 'вниз'}, ${label.replace('\n', ' ')}`);
  },
};

// конструкторы заданий; в вариантах ответа правильный всегда первый, на экране порядок перемешивается
const N = (q, ans, unit, o = {}) => ({ type: 'num', q, ans, unit, ...o });
const C = (q, opts, o = {}) => ({ type: 'choice', q, opts, ...o });
const M = (q, pairs, o = {}) => ({ type: 'match', q, pairs, ...o });
const S = (scene, v, a, o = {}) => ({ type: 'signs', q: 'Выбери знаки проекций скорости и ускорения на ось.', vis: V.scene(scene), v, a, ...o });
const BR = (q, v0, d, o = {}) => ({ type: 'brake', q, v0, d, ...o });
const LA = (q, v0, L, o = {}) => ({ type: 'launch', q, v0, L, ...o });

// ===== состояние =====
let P = loadLocal() || emptyProg();
// «Рамки»: прогресс, перенесённый из версии игры в Claude. Слияние берёт лучшее по каждому уровню;
// если прогресс на устройстве сбрасывали позже — сброс главнее.
fetch('seed.json', { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null)).then(seed => {
  if (!seed || seed.v !== 1) return;
  const merged = mergeProg(P, seed);
  if (JSON.stringify(merged) === JSON.stringify(P)) return;
  P = merged; saveLocal();
  if (view === 'map' || (tab === 'drill' && DR.view !== 'task')) render(); else updateTop();
}).catch(() => {});
let view = 'map';      // map | intro | task | result
let run = null;        // текущий проход уровня
let ts = null;         // состояние текущего задания
let busy = false;      // идёт анимация мини-игры
let lastResult = null;
let sheet = null;      // settings | confirm
let peek = null;       // какое уже решённое задание листаем (null — текущее)
let tab = 'levels';    // levels | drill
let lvSaved = null;    // задание уровня, пока открыта нарешка
const main = $('#main'), overlay = $('#overlay');
const LAST = LEVELS.length - 1;
const MAXSTARS = LEVELS.length * 3;

const LI = id => LEVELS.findIndex(L => L.id === id);
const lvStars = i => (P.levels[LEVELS[i].id] || {}).stars || 0;
const lvDone = i => lvStars(i) > 0;
const unlocked = i => i === 0 || lvDone(i - 1);
const totalStars = () => LEVELS.reduce((s, L, i) => s + lvStars(i), 0);
const doneCount = () => LEVELS.filter((L, i) => lvDone(i)).length;
const tid = (L, i) => `${L.id}.${i + 1}`;
const num = i => i === LAST ? 'Ф' : String(i + 1);
const curTask = () => tab === 'drill' ? DR.task : LEVELS[run.li].tasks[run.ti];
const curLevel = () => LEVELS[tab === 'drill' ? DR.tli : run.li];
const inTask = () => tab === 'drill' ? DR.view === 'task' : view === 'task' && peek === null;
const isGame = t => t.type === 'brake' || t.type === 'launch';
const toTop = () => window.scrollTo(0, 0);
function target() { for (let i = 0; i < LEVELS.length; i++) if (!lvDone(i)) return unlocked(i) ? i : -1; return -1; }
const starsHTML = (n, big) => `<span class="stars${big ? ' big' : ''}" role="img" aria-label="${n} из 3 звёзд">${[0, 1, 2].map(i => `<svg class="star${i < n ? ' on' : ''}" viewBox="0 0 24 24" aria-hidden="true">${STAR}</svg>`).join('')}</span>`;
const LOCK = '<svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" class="f-ink2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" class="f-none s-ink2" stroke-width="2"/></svg>';

function angles(t) { const s = Math.min(1, 10 * t.L / (t.v0 * t.v0)); const a1 = Math.asin(s) * 90 / Math.PI; return [a1, 90 - a1]; }
function answerText(t) {
  if (t.type === 'num') return `${t.show || fmt(t.ans)} ${t.unit || ''}`.trim();
  if (t.type === 'choice') return t.opts[0];
  if (t.type === 'signs') return `v: ${t.v}, a: ${t.a}`;
  if (t.type === 'brake') return `a = ${fmt(t.v0 * t.v0 / (2 * t.d), 1)} м/с²`;
  if (t.type === 'launch') { const [a1, a2] = angles(t).map(Math.round); return a1 === a2 ? `α = ${a1}°` : `α = ${a1}° или ${a2}°`; }
  return '';
}
function hintOf(t, L) {
  if (t.hint) return t.hint;
  if (t.type === 'brake') return 'Нужное торможение {a = v₀² / (2s)}.';
  if (t.type === 'launch') return 'Дальность {L = v₀²·sin 2α / g}, значит {sin 2α = g·L / v₀²}.';
  if (t.type === 'signs') return 'Скорость смотрит туда, куда едет тело. При торможении ускорение против скорости. Потом сравни с осью.';
  return `Формула уровня: {${L.big}}.`;
}

// ===== карта =====
function renderMap() {
  const done = doneCount(), stars = totalStars(), tgt = target();
  const ci = P.current ? LI(P.current.id) : -1;
  const cur = ci >= 0 && unlocked(ci) ? P.current : null;

function poly(terms, v = 't') {

  const label = hor ? `едет ${W[move]} и ${mode === 'acc' ? 'разгоняется' : 'тормозит'}` : move === 'up' ? 'мяч летит вверх\nпосле броска' : pick(['камень падает\nвниз', 'мяч падает\nобратно']);

// ===== нарешка: генераторы похожих задач (уровни 9–15) =====
const SIN = { 30: 0.5, 45: Math.SQRT1_2, 60: Math.sqrt(3) / 2, 90: 1 }, COS = { 30: Math.sqrt(3) / 2, 45: Math.SQRT1_2, 60: 0.5, 90: 0 };
const vecStr = (x, y) => `(${fmt(x)}; ${fmt(y)})`;
// Две точки с одинаковым ускорением в момент t (как задача 1.16)
function eqAcc() {
  for (;;) {
    const C1 = rint(-3, 3), C2 = rint(-3, 3);
    if (C1 === C2) continue;
    const t = pick([0.25, 0.5, 1, 1.5, 2]), B1 = rint(-5, 5), B2 = B1 + 3 * (C1 - C2) * t;
    if (!Number.isInteger(B2) || Math.abs(B2) > 9) continue;
    return { A1: rint(1, 6), B1, C1, A2: rint(1, 6), B2, C2, t };
  }
}
// Нормальное ускорение вида (k + m·t)², радиус r²: как задача 1 из Практики 3
function anSetup() {
  const r = pick([2, 3]), k = rint(1, 3), m = rint(1, 3), t = rint(1, 2);
  return { r, R: r * r, k, m, t, an: tt => (k + m * tt) ** 2, p: poly([[k * k, 0], [2 * k * m, 1], [m * m, 2]]) };
}
// Колесо равнозамедленно останавливается: частота, обороты, время
function wheelStop() {
  for (;;) {
    const n = pick([300, 600, 900, 1200, 1500]), Nr = rint(10, 150), t = 120 * Nr / n;
    if (Math.abs(t * 2 - Math.round(t * 2)) < 1e-9 && t >= 2 && t <= 40) { const w0 = 2 * Math.PI * n / 60; return { n, Nr, t, w0, eps: w0 / t }; }
  }
}

// ===== нарешка: экраны и ход =====

const gameRes = () => ts.state !== 'ask' && ts.g && ts.g.res ? ts.g.res : '';

function brakeGeom(t) { const M = t.d * 1.6; return { M, X: m => 100 + m * (470 / M) }; }

function goBrake(t) {

  const end = pos => {
    busy = false;
    if (ts !== token || !inTask()) return;
    const diff = s - t.d, hit = Math.abs(diff) <= 1;
    const res = hit ? `Встал через ${fmt(s, 1)} м, ровно у линии!` : diff > 0 ? `Проехал линию на ${fmt(diff, 1)} м: тормози сильнее.` : `Встал за ${fmt(-diff, 1)} м до линии: тормози слабее.`;
    ts.g = { ...(ts.g || {}), a, res, pos };
    if (ts.state !== 'ask') return render();

// «Попади в мишень»: угол подбирается ползунком, точки следа ставятся через равные промежутки времени

  const b = ts.g && ts.g.ball || [X(0), 262];

    <div class="ctrl"><label for="sl">Угол броска <span class="val" id="slv">α = ${ang}°</span></label>
    <input type="range" id="sl" min="5" max="85" step="1" value="${ang}">

function goLaunch(t) {

    ts.g = { ...(ts.g || {}), ang, res, dots: samp.map(s => [s[0], s[1]]), ball: [cx, cy] };

  };
  const frame = now => {
    const p = dur ? Math.min(1, (now - t0) / dur) : 1, tau = p * T, x = t.v0 * Math.cos(r) * tau, y = t.v0 * Math.sin(r) * tau - g0 * tau * tau / 2;
    const cx = +X(Math.min(x, M + 2)).toFixed(1), cy = +Y(Math.max(y, 0)).toFixed(1);
    ball.setAttribute('cx', cx); ball.setAttribute('cy', cy);
    while (shown < samp.length && samp[shown][2] <= tau + 1e-9) { dots.insertAdjacentHTML('beforeend', `<circle cx="${samp[shown][0]}" cy="${samp[shown][1]}" r="4" class="f-acc" opacity=".55"/>`); shown++; }
    if (p < 1 && x <= M + 2) requestAnimationFrame(frame); else end(cx, cy);
  };
  requestAnimationFrame(frame);
}

// ===== запуск =====
render();
initSync();
try { if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') window.claude.hot.snapshot(() => (tab === 'levels' && peek === null ? { view, run, ts: view === 'task' ? ts : null, lastResult } : { view: 'map' })); } catch (e) {}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(d => {
    if (d && d.run && LEVELS[d.run.li] && d.run.ti < LEVELS[d.run.li].tasks.length && (d.view === 'task' || d.view === 'intro')) { run = d.run; ts = d.ts || null; busy = false; view = ts ? 'task' : 'intro'; lastResult = d.lastResult || null; render(); }
  });
} catch (e) {}
</script>
