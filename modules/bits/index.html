}
let S = DEF();
let saveMode = 'local';
let cloudRef = null, cloudTimer = null, cloudBusy = false, cloudAgain = false;

function readLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return norm(JSON.parse(raw)); } catch (e) { /* хранилище недоступно */ }
  return null;
}

  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); return true; } catch (e) { return false; }
}
function merge(a, b) {
  a = norm(JSON.parse(JSON.stringify(a))); b = norm(JSON.parse(JSON.stringify(b)));
  const newer = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b, older = newer === a ? b : a;
  const o = JSON.parse(JSON.stringify(newer));

  o.best = Math.max(a.best, b.best);
  o.answered = Math.max(a.answered || 0, b.answered || 0);

  for (const k of new Set([...Object.keys(a.levels), ...Object.keys(b.levels)])) {
    const x = a.levels[k] || {}, y = b.levels[k] || {};
    o.levels[k] = { stars: Math.max(x.stars || 0, y.stars || 0), plays: Math.max(x.plays || 0, y.plays || 0) };

  o.flags = Object.assign({}, a.flags, b.flags);

async function initCloud() {

    if (!user) return;
    const uid = await user.id();
    if (!uid) return;
    const db = await cl.use('db');
    if (!db) return;
    const ref = db.doc('data/users/' + uid + '/progress');
    const snap = await ref.get();
    let changed = false;
    if (snap.exists) {

    cloudRef = ref; saveMode = 'cloud';

}
function refreshSaveNote() {

  if (el) el.outerHTML = saveNoteHTML();
}
function applyOpts() { SFX.set(S.opts.sound); }

// ---------- даты, ранги, склонения ----------
const p2 = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
function markDay() { const k = dayKey(new Date()); if (!S.days.includes(k)) { S.days.push(k); S.days = S.days.slice(-400); } }
function streakDays() {
  const set = new Set(S.days); const d = new Date(); let n = 0;
  if (!set.has(dayKey(d))) { d.setDate(d.getDate() - 1); if (!set.has(dayKey(d))) return 0; }
  while (set.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function daysAway() {
  if (!S.days.length) return 0;

  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((t - new Date(last[0], last[1] - 1, last[2])) / 864e5);
}
const RANKS = [[0, 'БИТ'], [60, 'НИББЛ'], [200, 'БАЙТ'], [600, 'КИЛОБАЙТ'], [1200, 'МЕГАБАЙТ'], [2200, 'ГИГАБАЙТ'], [3500, 'ТЕРАБАЙТ'], [5000, 'ПЕТАБАЙТ']];
function rank(xp) { let i = 0; while (i + 1 < RANKS.length && xp >= RANKS[i + 1][0]) i++; return { name: RANKS[i][1], next: RANKS[i + 1] || null }; }
function pl(n, a, b, c) { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }
const listJoin = arr => (arr.length < 2 ? arr.join('') : arr.slice(0, -1).join(', ') + ' и ' + arr[arr.length - 1]);

// ---------- Сэм ----------
const say = s => String(s).replace(/\{([^|{}]*)\|([^{}]*)\}/g, (_, a, b) => (S.opts.mat ? a : b));
const lastPick = {};
function pick(arr, key) {
  if (!arr || !arr.length) return '';
  let i = Math.floor(Math.random() * arr.length);
  if (arr.length > 1 && i === lastPick[key]) i = (i + 1) % arr.length;
  lastPick[key] = i;
  return say(arr[i]);
}
let homeGreet = null;
function greeting() {
  const away = daysAway();
  if (away >= 3) return pick(ST.SAM.back, 'back');
  const h = new Date().getHours();
  const g = h < 5 ? 'night' : h < 11 ? 'morning' : h < 18 ? 'day' : 'evening';
  return pick(ST.SAM.greet[g], 'greet');
}

// ---------- миры, уровни, модули ----------
const world = id => E.WORLDS.find(w => w.id === id);
const starsOf = lid => (S.levels[lid] && S.levels[lid].stars) || 0;
const statusOf = w => S.status[w.id] || w.status;
const bossOf = w => w.levels.find(l => l.boss);
const repaired = w => starsOf(bossOf(w).id) > 0;
const modState = w => (repaired(w) ? 'ok' : w.levels.some(l => starsOf(l.id) > 0) ? 'work' : 'off');
const MODTAG = { ok: 'НОРМА', work: 'РЕМОНТ', off: 'ОТКАЗ' };
const MODN = id => ST.MODS[id].name;
function wStats(w) {
  const total = w.levels.length, done = w.levels.filter(l => starsOf(l.id) > 0).length;
  const stars = w.levels.reduce((s, l) => s + starsOf(l.id), 0);
  return { total, done, stars, max: total * 3 };
}
const nextIn = w => w.levels.find(l => !starsOf(l.id)) || null;
function priority() {
  const o = { todo: 0, unknown: 1, sent: 2 };
  return E.WORLDS.slice().sort((a, b) => o[statusOf(a)] - o[statusOf(b)] || a.n - b.n);
}
function continueTarget() {
  if (S.last && S.last.world) { const w = world(S.last.world); if (w) { const l = nextIn(w); if (l) return { w, l }; } }
  for (const w of priority()) { const l = nextIn(w); if (l) return { w, l }; }

}
function targetBtn(tg) {
  const theoryFirst = tg.l.idx === 0 && !S.theory[tg.w.id];
  return theoryFirst
    ? { a: 'theory', v: tg.w.id, top: `МОДУЛЬ ${tg.w.n} · ${MODN(tg.w.id)}`, label: 'Инструктаж Сэма' }
    : { a: 'level', v: tg.l.id, top: `МОДУЛЬ ${tg.w.n} · ${MODN(tg.w.id)}`, label: tg.l.boss ? 'Тест модуля' : esc(tg.l.title) };
}
function syncOrder() {
  const o = S.story.order.filter(id => { const w = world(id); return w && repaired(w); });
  for (const w of E.WORLDS) if (repaired(w) && !o.includes(w.id)) o.push(w.id);
  S.story.order = o;
}
const repairedCount = () => S.story.order.length;
const STATUS = { todo: 'НЕ СДАНО', sent: 'СДАНО', unknown: 'СТАТУС?' };
const levelTitle = l => (l.boss ? 'Тест модуля' : l.title);
const levelSub = l => (l.boss ? l.title.replace(/^Босс:\s*/, '') : '');

// ---------- графика: матричный шрифт и портрет Сэма ----------
const FONT = {
  'А': ['.###.', '#...#', '#...#', '#####', '#...#', '#...#', '#...#'],
  'Б': ['#####', '#....', '#....', '####.', '#...#', '#...#', '####.'],
  'В': ['####.', '#...#', '#...#', '####.', '#...#', '#...#', '####.'],
  'И': ['#...#', '#...#', '#..##', '#.#.#', '##..#', '#...#', '#...#'],
  'К': ['#...#', '#..#.', '#.#..', '##...', '#.#..', '#..#.', '#...#'],
  'М': ['#...#', '##.##', '#.#.#', '#.#.#', '#...#', '#...#', '#...#'],
  'О': ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'],
  'Р': ['####.', '#...#', '#...#', '####.', '#....', '#....', '#....'],
  'Т': ['#####', '..#..', '..#..', '..#..', '..#..', '..#..', '..#..'],
  'З': ['.###.', '#...#', '....#', '..##.', '....#', '#...#', '.###.'],
  'Ц': ['#..#.', '#..#.', '#..#.', '#..#.', '#..#.', '#####', '....#'],
  '-': ['.....', '.....', '.....', '#####', '.....', '.....', '.....'],
  '1': ['..#..', '.##..', '..#..', '..#..', '..#..', '..#..', '.###.'],
  '2': ['.###.', '#...#', '....#', '...#.', '..#..', '.#...', '#####'],
  '3': ['#####', '...#.', '..#..', '...#.', '....#', '#...#', '.###.'],
  '4': ['...#.', '..##.', '.#.#.', '#..#.', '#####', '...#.', '...#.'],
  '5': ['#####', '#....', '####.', '....#', '....#', '#...#', '.###.'],
  '6': ['..##.', '.#...', '#....', '####.', '#...#', '#...#', '.###.'],

  '8': ['.###.', '#...#', '#...#', '.###.', '#...#', '#...#', '.###.'],

function matrix(text, cls = '', label = '') {
  const glyphs = [...text].map(c => FONT[c] || FONT[' ']);
  const W = glyphs.reduce((a, g) => a + g[0].length + 1, -1);

const FACE = [

  '.#.####..####.#.',
  '.#.#..#..#..#.#.',

  '.#...######...#.',

  '....########....',

// ---------- печатная машинка ----------
const tw = { jobs: [], done: new Map(), els: [] };
function twKeyOf(el) { return el.dataset.twk || el.dataset.tw; }
function stopTyping() { for (const j of tw.jobs) clearTimeout(j.t); tw.jobs = []; tw.els = []; }

  stopTyping();
  const els = [...$app.querySelectorAll('[data-tw]')];
  tw.els = els;
  const scr = t => [...t].map(c => (c === ' ' ? ' ' : GARB[Math.floor(Math.random() * GARB.length)])).join('');
  const show = (el, full, i) => { el.textContent = full.slice(0, i) + (el.dataset.twm === 'decode' ? scr(full.slice(i)) : ''); };
  for (const el of els) {
    const full = el.dataset.tw, d = tw.done.get(twKeyOf(el));
    if (REDUCED || d === true) { el.textContent = full; continue; }
    show(el, full, typeof d === 'number' ? d : 0);
  }

  const next = () => {
    while (idx < els.length) {
      const el = els[idx++];
      const key = twKeyOf(el), full = el.dataset.tw, d = tw.done.get(key);
      if (REDUCED || d === true || !el.isConnected) continue;
      const job = { el, key, full, i: typeof d === 'number' ? d : 0, t: 0, fin: false };
      const speed = Number(el.dataset.tws || 20);

  }

}
const twAttr = (text, key, speed) => `data-tw="${esc(text)}" data-twk="${esc(key)}"${speed ? ` data-tws="${speed}"` : ''}`;
function talk(lines, key, o = {}) {
  const arr = (Array.isArray(lines) ? lines : [lines]).filter(Boolean);
  return `<section class="talk${o.cls ? ' ' + o.cls : ''}" data-a="typeall" aria-label="Сэм говорит">

  </section>`;
}

// ---------- подсветка Python ----------
const KW = new Set(['def', 'return', 'for', 'in', 'if', 'else', 'elif', 'while', 'import', 'from', 'not', 'and', 'or', 'is', 'as', 'raise', 'True', 'False', 'None', 'lambda']);
const BI = new Set(['print', 'range', 'len', 'sum', 'int', 'str', 'format', 'abs', 'max', 'min', 'list', 'zip', 'enumerate', 'reversed', 'round', 'math', 'ValueError']);
function hl(code) {
  const re = /(#.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*\b)|([\s\S])/gm;
  let out = '', mm;
  while ((mm = re.exec(code))) {
    if (mm[1]) out += `<span class="c">${esc(mm[1])}</span>`;
    else if (mm[2]) out += `<span class="s">${esc(mm[2])}</span>`;
    else if (mm[3]) out += `<span class="n">${mm[3]}</span>`;
    else if (mm[4]) out += KW.has(mm[4]) ? `<span class="k">${mm[4]}</span>` : BI.has(mm[4]) ? `<span class="f">${mm[4]}</span>` : mm[4];
    else out += esc(mm[5]);
  }
  return out;
}

// ---------- маршруты ----------
let route = { screen: 'boot', phase: 'off' };
let sess = null;
let lastStageKey = null;
let bootTimer = null;
let sessUid = 0;
function go(r) { finishTyping(); clearTimeout(bootTimer); route = r; render(); window.scrollTo(0, 0); }
function render() {
  stopTyping();
  const stage = document.getElementById('stage');
  const st = stage ? stage.scrollTop : 0;
  if (route.screen === 'world' && !world(route.w)) route = { screen: 'home' };
  if (route.screen === 'theory' && !world(route.w)) route = { screen: 'home' };
  if ((route.screen === 'play' || route.screen === 'result') && !sess) route = { screen: 'home' };
  if (route.screen === 'story' && !storyLines(route.id)) route = { screen: 'home' };
  let h = '';
  switch (route.screen) {
    case 'boot': h = viewBoot(); break;
    case 'story': h = viewStory(); break;
    case 'world': h = viewWorld(world(route.w)); break;
    case 'theory': h = viewTheory(world(route.w), route.i || 0); break;
    case 'play': h = viewPlay(); break;
    case 'result': h = viewResult(); break;
    default: route = { screen: 'home' }; h = viewHome();
  }
  $app.dataset.screen = route.screen;
  $app.innerHTML = h;
  if (route.screen === 'play') {
    const key = sess.i + ':' + sess.phase;
    const el = document.getElementById('stage');
    if (el && lastStageKey && lastStageKey.split(':')[0] === String(sess.i)) el.scrollTop = st;
    lastStageKey = key;
  } else lastStageKey = null;
  if (route.screen === 'theory') WIDGETS.mountAll($app);
  if (route.screen === 'boot' && route.phase === 'post') runPost();
  typeAll();
  if (route.screen === 'story') requestAnimationFrame(() => { const f = document.getElementById('stfoot'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'end', behavior: REDUCED ? 'auto' : 'smooth' }); });
}

function runPost() {
  const ol = document.getElementById('post'); if (!ol) return;

function storyLines(id) {
  if (!id) return null;
  if (id === 'intro') return ST.INTRO;
  const m = /^beat:(\d)$/.exec(id);
  if (!m) return null;
  const k = Number(m[1]);
  if (k < 1 || k > 8) return null;
  const wid = S.story.order[k - 1], M = wid && ST.MODS[wid], w = wid && world(wid);
  const head = M ? [['sys', `ЗАПУСК МОДУЛЯ ${w.n}: ${M.name}`], ['sys', 'САМОТЕСТ… НОРМА'], ['sam', M.online]] : [];
  if (k === 8) return head.concat(ST.FINALE);
  return head.concat([['sys', `ПАМЯТЬ: РАСШИФРОВАНА СТРОКА ${k} ИЗ 8`], ['mem', ST.FRAG[k - 1]]], ST.BEATS[k] || []);
}

const GARB = '#%&@$*+=?/\\<>~^:;0123456789ЖЩЪЫЭЮЯ';
function garble(s, seed) {
  let x = seed * 9301 + 49297, o = '';
  for (const c of s) { x = (x * 9301 + 49297) % 233280; o += c === ' ' ? ' ' : GARB[x % GARB.length]; }
  return o;
}
function memoryHTML() {
  const k = repairedCount();
  return `<div class="mem" role="list">${ST.FRAG.map((f, j) => {
    const n = j + 1, open = n <= k, fresh = open && !S.story.seen[n];

    if (!open) return `<div class="mem-l lock" role="listitem"><span class="mem-a">${addr}</span><span class="mem-t" aria-label="не расшифровано">${esc(garble(f, n))}</span></div>`;

// ---------- игра ----------
function startLevel(lid) {
  const l = E.LEVELS[lid]; if (!l) return;
  startSession({ mode: null, lid, wid: l.world, title: l.title, boss: !!l.boss, tasks: l.tasks, queue: E.buildQueue(l) });
}
function startMix() { startSession({ mode: 'mix', title: 'Микс по всем модулям', queue: E.R.shuffle(E.allGids()).slice(0, 10) }); }
function startReview() {
  const ent = Object.entries(S.mistakes).filter(([g]) => E.G[g]).sort((a, b) => b[1] - a[1]);
  if (!ent.length) return;
  let g = ent.map(x => x[0]);
  while (g.length < Math.min(8, ent.length * 2)) g = g.concat(g);
  startSession({ mode: 'review', title: 'Работа над ошибками', queue: E.R.shuffle(g.slice(0, 8)) });
}
function startSession(o) {
  sessUid++;
  sess = Object.assign({ uid: sessUid, i: 0, need: o.queue.length, done: 0, mistakes: 0, firstTry: 0, xp: 0, requeues: 0, retry: [], seen: [], res: [], phase: 'answer', streak: 0, wrongRun: 0, bestStreak: 0 }, o);
  sess.startLine = pick(o.mode === 'mix' ? ST.SAM.startMix : o.mode === 'review' ? ST.SAM.startReview : o.boss ? ST.SAM.startBoss : ST.SAM.start, 'start');
  loadTask();
  go({ screen: 'play' });
}
function loadTask() {
  const gid = sess.queue[sess.i];

    s.sam = ST.SAM.streak[s.streak] ? say(ST.SAM.streak[s.streak]) : pick(isRetry ? ST.SAM.okRetry : ST.SAM.ok, 'ok');

    s.streak = 0; s.wrongRun++;

    const tips = ST.SAM.tips[gidWorld(t.gid)];

    SFX.bad();

  s.lastOk = ok; s.gaveUp = !!giveUp; s.phase = 'feedback'; s.showSteps = !ok;

  if (usedKeyboard) { const fb = document.querySelector('.fb .cmd'); if (fb) fb.focus({ preventScroll: true }); }
}
function nextStep() {

function finish() {

    const w = world(s.wid), wasRepaired = repaired(w);

    rec.plays = (rec.plays || 0) + 1;

function bitsHTML(t) {

const A = {
  home: () => go({ screen: 'home' }),
  world: v => go({ screen: 'world', w: v }),
  theory: v => go({ screen: 'theory', w: v, i: 0 }),
  tnext: () => { const w = world(route.w); finishTyping(); route.i = Math.min(route.i + 1, w.cards.length - 1); render(); window.scrollTo(0, 0); },
  tprev: () => { finishTyping(); route.i = Math.max(0, route.i - 1); render(); window.scrollTo(0, 0); },
  tdone: () => { const w = world(route.w); if (!S.theory[w.id]) { S.theory[w.id] = true; S.xp += 10; touch(); } go({ screen: 'world', w: w.id }); },
  cheat: v => { const w = world(v); if (w) sheetCheat(w); },
  status: v => { const w = world(v); const order = ['todo', 'sent', 'unknown']; S.status[w.id] = order[(order.indexOf(statusOf(w)) + 1) % 3]; touch(); render(); },
  level: v => startLevel(v),
  mix: () => startMix(),
  review: () => startReview(),
  menu: () => sheetMenu(),
  sound: () => { S.opts.sound = !S.opts.sound; applyOpts(); if (S.opts.sound) { SFX.unlock(); SFX.beep(); } touch(); if (!$sheet.hidden) sheetMenu(); render(); },
  mat: () => { S.opts.mat = !S.opts.mat; touch(); sheetMenu(); homeGreet = null; render(); },
  replay: () => { closeSheet(); go({ screen: 'story', id: 'intro', i: 0 }); },
  askreset: () => sheetReset(),
  reset: () => { const keep = { opts: S.opts, intro: S.story.intro }; S = DEF(); S.opts = keep.opts; S.story.intro = keep.intro; touch(); closeSheet(); homeGreet = null; go({ screen: 'home' }); },
  closesheet: () => closeSheet(),
  exit: () => sheetExit(),
  leave: () => { closeSheet(); const w = sess && sess.wid; sess = null; go(w ? { screen: 'world', w } : { screen: 'home' }); },
  key: v => {
    if (!sess || sess.phase !== 'answer') return;
    let x = sess.input;
    if (v === '⌫') x = x.slice(0, -1);
    else if (v === '−') x = x.startsWith('−') ? x.slice(1) : '−' + x;
    else if (v === ',') { if (!x.includes(',')) x = x === '' || x === '−' ? x + '0,' : x + ','; }
    else if (x.length < 24) x += v;
    sess.input = x; SFX.key(); render();
  },
  bit: v => { if (!sess || sess.phase !== 'answer') return; const i = Number(v); const w = sess.input; sess.input = w.slice(0, i) + (w[i] === '1' ? '0' : '1') + w.slice(i + 1); SFX.flip(); render(); },
  tapbit: v => { if (!sess || sess.phase !== 'answer') return; sess.input = Number(v); SFX.flip(); render(); },
  opt: v => { if (!sess || sess.phase !== 'answer') return; sess.input = Number(v); SFX.key(); render(); },
  line: v => { if (!sess || sess.phase !== 'answer') return; sess.input = Number(v); SFX.key(); render(); },
  hint: () => { sess.hint = !sess.hint; if (sess.hint) sess.hintLine = pick(ST.SAM.hint, 'hint'); render(); },
  giveup: () => doCheck(true),
  check: () => doCheck(false),
  steps: () => { sess.showSteps = true; render(); },
  next: () => nextStep(),
  typeall: () => { finishTyping(); },
  // включение и сюжет
  power: () => { SFX.unlock(); SFX.boot(); route = { screen: 'boot', phase: 'post' }; render(); },
  bootskip: () => { if (route.screen === 'boot' && route.phase === 'post') bootDone(); },
  advance: () => {
    if (route.screen !== 'story') return;
    if (finishTyping()) return;
    const lines = storyLines(route.id);
    if (route.i < lines.length - 1) { route.i++; render(); } else endStory();
  },
  skipstory: () => {
    const lines = storyLines(route.id);
    for (let j = 0; j < lines.length; j++) tw.done.set(`st:${route.id}:${j}`, true);
    route.i = lines.length - 1; render();
  },
  endstory: () => endStory(),
  beat: v => startStory('beat:' + v),
};
function onClick(e) {
  if (e.target.closest('.wg')) return; // демо обрабатывают клики сами
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (!fn) return;
  e.preventDefault();
  if (el.tagName === 'BUTTON' && !['key', 'bit', 'tapbit', 'opt', 'line', 'sound', 'power'].includes(el.dataset.a)) SFX.key();
  fn(el.dataset.v, el);
}
$app.addEventListener('click', onClick);
$sheet.addEventListener('click', onClick);
// разблокировать звук на первом касании
const unlockOnce = () => { SFX.unlock(); };
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockOnce, { capture: true, passive: true }));

let usedKeyboard = false;
document.addEventListener('pointerdown', () => { usedKeyboard = false; }, true);
document.addEventListener('keydown', e => {
  usedKeyboard = true;
  const tg = e.target;
  if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA')) return;
  if (!$sheet.hidden) { if (e.key === 'Escape') closeSheet(); return; }
  if (route.screen === 'boot') {
    if (route.phase !== 'post' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); A.power(); }
    else if (route.phase === 'post' && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) { e.preventDefault(); bootDone(); }
    return;
  }
  if (route.screen === 'story') {
    if (tg && tg.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); A.advance(); }
    if (e.key === 'Escape') A.skipstory();
    return;
  }
  if (route.screen === 'theory') { if (e.key === 'ArrowRight') A.tnext(); if (e.key === 'ArrowLeft') A.tprev(); return; }
  if (route.screen !== 'play' || !sess) return;
  if (tg && tg.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ') && sess.phase === 'answer') return;
  if (sess.phase === 'feedback') { if (e.key === 'Enter') { e.preventDefault(); nextStep(); } return; }
  if (e.key === 'Enter') { e.preventDefault(); doCheck(false); return; }
  const t = sess.task;
  if (t.kind === 'num') {
    const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
    const allowed = t.keys === 'dec' ? '0123456789' : '0123456789ABCDEF'.slice(0, t.q);
    if (k === 'Backspace') A.key('⌫');
    else if (k === '-' && t.neg) A.key('−');
    else if ((k === ',' || k === '.') && t.frac) A.key(',');
    else if (allowed.includes(k)) A.key(k);
  } else if (t.kind === 'mc' && /^[1-4]$/.test(e.key)) {
    const i = Number(e.key) - 1; if (i < t.options.length) A.opt(String(i));
  }
});

// свайп по карточкам теории
let tx = null;
$app.addEventListener('touchstart', e => { if (route.screen === 'theory' && e.target.closest('#tcard')) tx = e.touches[0].clientX; }, { passive: true });
$app.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) { if (dx < 0) { const w = world(route.w); if (route.i < w.cards.length - 1) A.tnext(); } else if (route.i > 0) A.tprev(); }
}, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && cloudRef) { clearTimeout(cloudTimer); flushCloud(); } });
window.addEventListener('resize', () => { if (route.screen === 'play' && sess && (sess.task.kind === 'bits' || sess.task.kind === 'tap')) render(); });

// ---------- «Рамки» ----------
// Игра лежит внутри «Рамок» (ermac999.github.io/PTU-MIREA). seed.json рядом — прогресс, перенесённый
// из сохранения в Claude: сливаем один раз на устройстве. Отдельный ключ — чтобы «Сбросить прогресс» не возвращал старое.
const SEED_KEY = 'bzb.ramki.seeded';
function seedFromRamki() {
  try { if (localStorage.getItem(SEED_KEY)) return; } catch (e) { return; }
  fetch('seed.json', { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null)).then(seed => {
    if (!seed) return;
    S = merge(S, seed); syncOrder(); applyOpts(); writeLocal();
    try { localStorage.setItem(SEED_KEY, '1'); } catch (e) { /* хранилище недоступно — попробуем в следующий раз */ }
    if (!['play', 'story', 'boot'].includes(route.screen)) render();
  }).catch(() => { /* без сети — в следующий раз */ });
}

// ---------- запуск ----------
function boot(data) {
  const local = readLocal();
  if (local) S = local; else if (!writeLocal()) saveMode = 'none';
  syncOrder(); applyOpts();
  try {
    if (data && data.route && data.route.screen && data.route.screen !== 'boot') {
      route = data.route;
      if (data.sess) { sess = data.sess; sess.res = sess.res || []; sess.uid = sess.uid || ++sessUid; }
    }
  } catch (e) { route = { screen: 'boot', phase: 'off' }; }
  if (TEST && window.__BZB_SKIP_BOOT__) route = { screen: 'home' };
  render();
  initCloud();
  seedFromRamki();
}
if (TEST) window.__bzbDebug = { get sess() { return sess; }, get state() { return S; }, A, get route() { return route; }, render, finishTyping };
const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ route, sess })); } catch (e) { /* нет горячего обновления */ }
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();

</script>
