<!doctype html><html lang="ru"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Бит за битом</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&family=VT323&display=swap">
<style>
/* Пульт ЭВМ «Кварц-8»: одна колонка фосфорного терминала; всё моноширинное, акцент — яркость и инверсия, как у настоящего дисплея */
:root {
  color-scheme: dark;
  --bg: #020b05;      /* экран: чёрный с зеленцой */
  --bg2: #051409;     /* панели */
  --bg3: #0a2213;     /* выделение */
  --fg: #4ef085;      /* люминофор P1: основной текст */
  --hi: #c6ffd8;      /* «яркий» атрибут */
  --dim: #2f9f5b;     /* второстепенный текст */
  --faint: #174d2c;   /* рамки и погашенное */
  --amber: #ffb84d;   /* голос Сэма */
  --bad: #ff6b57;     /* ошибка */
  --str: #86ead6;     /* строки в коде */
  --glow: rgba(78, 240, 133, .36);
  --glow-a: rgba(255, 184, 77, .34);
  --glow-b: rgba(255, 107, 87, .34);
  --font: "PT Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
  --digits: "VT323", "PT Mono", Menlo, Consolas, monospace;
  --t-xs: .75rem; --t-s: .8125rem; --t-m: .9375rem; --t-l: 1.0625rem; --t-xl: 1.375rem; --t-xxl: 2rem;
}
html { box-sizing: border-box; height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: var(--t-m)/1.55 var(--font);
  font-synthesis: none;
  text-shadow: 0 0 6px var(--glow);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before { /* свечение экрана */
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 80% at 50% 30%, rgba(30, 110, 60, .22), transparent 70%);
}
::selection { background: var(--fg); color: var(--bg); text-shadow: none; }
b, strong { font-weight: inherit; color: var(--hi); }
sub, sup { font-size: .7em; line-height: 0; }
code, pre { font-family: var(--font); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-shadow: inherit; text-align: inherit; letter-spacing: inherit; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
h1, h2, h3, p, ol, ul { margin: 0; }
h1, h2 { font-weight: inherit; text-wrap: balance; }

/* ---------- кинескоп: строки развёртки и виньетка ---------- */
.crt { position: fixed; inset: 0; z-index: 100; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0, 0, 0, .26) 2px, rgba(0, 0, 0, .26) 3px),
    radial-gradient(ellipse at center, transparent 58%, rgba(0, 0, 0, .55) 100%);
}
.crt::after { content: ''; position: absolute; left: 0; right: 0; top: -20%; height: 18%;
  background: linear-gradient(to bottom, transparent, rgba(120, 255, 170, .045), transparent);
  animation: roll 9s linear infinite; }
@keyframes roll { to { transform: translateY(700%); } }

/* ---------- каркас ---------- */
#app { max-width: 680px; margin: 0 auto; min-height: 100%; }
.page { padding-inline: 16px; padding-block: 12px 40px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: var(--t-xs); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.dim { color: var(--dim); }
.small { font-size: var(--t-s); }
.hint { font-size: var(--t-s); color: var(--dim); }
.sec { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: var(--t-xs); letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }
.sec::after { content: ''; flex: 1; border-top: 1px dashed var(--faint); }

/* верхняя строка состояния — как статусная строка терминала */
.sbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: stretch; gap: 0;
  background: var(--fg); color: var(--bg); text-shadow: none; font-size: var(--t-s); letter-spacing: .06em;
  box-shadow: 0 0 14px var(--glow); }
.sbar > * { display: flex; align-items: center; padding: 9px 10px; min-height: 40px; }
.sb-home { font-weight: inherit; letter-spacing: .12em; }
.sb-mid { flex: 1; gap: 6px; justify-content: center; min-width: 0; white-space: nowrap; overflow: hidden; }
.sb-mid b { color: var(--bg); font-family: var(--digits); font-size: 1.35rem; line-height: 1; }
.sb-mid small { font-size: var(--t-xs); }
.sb-btn i { font-style: normal; margin-left: 4px; }
.sbar a { color: inherit; text-decoration: none; }
.sb-back { font-size: 1.25rem; padding: 9px 12px !important; }
.sbar a:hover, .sbar a:focus-visible { background: var(--bg); color: var(--fg); outline: none; }
.pw-back { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.sbar button:hover, .sbar button:focus-visible { background: var(--bg); color: var(--fg); outline: none; }

/* ---------- кнопки ---------- */
.btn { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 52px; padding: 10px 14px;
  border: 1px solid var(--faint); background: var(--bg2); text-align: left; transition: border-color .12s, background .12s; }
.btn b { color: var(--fg); text-transform: uppercase; letter-spacing: .06em; font-size: var(--t-s); }
.btn small { color: var(--dim); font-size: var(--t-xs); }
.btn:hover:not(:disabled), .btn:focus-visible { border-color: var(--fg); background: var(--bg3); }
.btn:active:not(:disabled) { background: var(--fg); }
.btn:active:not(:disabled) b, .btn:active:not(:disabled) small { color: var(--bg); text-shadow: none; }
.btn:disabled { opacity: .45; }
.btn.go { border-color: var(--fg); }
.btn.hot { border-color: var(--amber); }
.btn.hot b { color: var(--amber); text-shadow: 0 0 6px var(--glow-a); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--bad); }
.btn.danger b { color: var(--bad); text-shadow: 0 0 6px var(--glow-b); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.link { color: var(--fg); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--dim); font-size: var(--t-s); padding: 8px 0; }
.link:hover { color: var(--hi); }

/* главная команда: рамка с курсором */
.cmd { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 60px; padding: 12px 16px;
  border: 2px solid var(--fg); background: rgba(78, 240, 133, .07); box-shadow: 0 0 14px var(--glow), inset 0 0 14px rgba(78, 240, 133, .12);
  text-align: left; }
.cmd-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cmd-t small { font-size: var(--t-xs); letter-spacing: .1em; color: var(--dim); }
.cmd-t b { font-size: var(--t-l); color: var(--hi); text-transform: uppercase; letter-spacing: .05em; }
.cmd-t b::after { content: ''; display: inline-block; width: .55em; height: 1em; margin-left: 6px; vertical-align: -2px; background: currentColor; animation: blink 1.05s steps(1) infinite; }
.cmd-k { font-family: var(--digits); font-size: 1.8rem; line-height: 1; color: var(--fg); }
.cmd:hover:not(:disabled), .cmd:focus-visible { background: var(--fg); outline: none; }
.cmd:hover:not(:disabled) *, .cmd:focus-visible * { color: var(--bg); text-shadow: none; }
.cmd:active:not(:disabled) { transform: translateY(1px); }
.cmd:disabled { border-color: var(--faint); box-shadow: none; background: transparent; }
.cmd:disabled .cmd-t b, .cmd:disabled .cmd-k { color: var(--faint); text-shadow: none; }
.cmd:disabled .cmd-t b::after { display: none; }
.cmd.repair { border-color: var(--amber); box-shadow: 0 0 18px var(--glow-a), inset 0 0 14px rgba(255, 184, 77, .12); background: rgba(255, 184, 77, .07); }
.cmd.repair .cmd-t b, .cmd.repair .cmd-k { color: var(--amber); text-shadow: 0 0 8px var(--glow-a); }
.cmd.repair .cmd-t small { color: var(--amber); opacity: .8; }
.cmd.repair:hover, .cmd.repair:focus-visible { background: var(--amber); }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- Сэм ---------- */
.face { width: 44px; height: 44px; flex: none; fill: var(--amber); filter: drop-shadow(0 0 4px var(--glow-a)); }
.face.big { width: 64px; height: 64px; }
.talk { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px;
  border: 1px solid rgba(255, 184, 77, .4); background: rgba(255, 184, 77, .045); color: var(--amber); text-shadow: 0 0 6px var(--glow-a); cursor: default; }
.talk-b { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.talk .who { font-size: var(--t-xs); letter-spacing: .18em; opacity: .75; }
.talk p { min-height: 1.55em; }
.talk.mini { padding: 10px; gap: 10px; }
.talk.mini .face { width: 32px; height: 32px; }
.talk.mini p { font-size: var(--t-s); }
.typing::after { content: ''; display: inline-block; width: .55em; height: 1em; margin-left: 2px; vertical-align: -2px; background: currentColor; animation: blink .8s steps(1) infinite; }

/* ---------- матричный шрифт ---------- */
.mx { display: block; height: auto; }
.mx rect.on { fill: var(--fg); }
.mx rect.off { fill: var(--fg); opacity: .07; }
.mx.logo { width: min(100%, 330px); filter: drop-shadow(0 0 5px var(--glow)); }
.mx.dimmx rect.on { fill: var(--dim); opacity: .55; }
.mx.warm { width: min(100%, 300px); filter: drop-shadow(0 0 6px var(--glow)); }
.mx.warm rect.on { animation: warm .5s ease-out both; animation-delay: calc(var(--d) * 22ms); }
@keyframes warm { from { opacity: 0; } 60% { opacity: 1; fill: var(--hi); } to { opacity: 1; } }
.mx.num { width: 34px; filter: drop-shadow(0 0 4px var(--glow)); }

/* ---------- пульт ---------- */
.hero { display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }
.hero-sub { font-size: var(--t-xs); letter-spacing: .16em; color: var(--dim); }
.modlamps { display: flex; gap: 6px; flex-wrap: wrap; }
.ml { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.ml i { width: 22px; height: 12px; border: 1px solid var(--faint); background: transparent; }
.ml small { font-size: var(--t-xs); color: var(--dim); font-family: var(--digits); font-size: 1rem; line-height: 1; }
.ml.work i { border-color: var(--amber); background: rgba(255, 184, 77, .25); }
.ml.ok i { border-color: var(--fg); background: var(--fg); box-shadow: 0 0 10px var(--glow); }

.mods { display: grid; gap: 8px; }
.mod { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px;
  border: 1px solid var(--faint); background: var(--bg2); }
.mod:hover, .mod:focus-visible { border-color: var(--fg); background: var(--bg3); }
.m-n { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--faint); font-family: var(--digits); font-size: 2rem; line-height: 1; color: var(--dim); }
.mod.work .m-n { border-color: var(--amber); color: var(--amber); text-shadow: 0 0 6px var(--glow-a); }
.mod.ok .m-n { background: var(--fg); border-color: var(--fg); color: var(--bg); text-shadow: none; box-shadow: 0 0 12px var(--glow); }
.m-b { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.m-name { font-size: var(--t-s); letter-spacing: .05em; color: var(--hi); }
.m-topic { font-size: var(--t-xs); color: var(--dim); }
.m-bar { display: flex; align-items: center; gap: 3px; margin-top: 4px; }
.m-bar i { width: 12px; height: 6px; border: 1px solid var(--faint); }
.m-bar i.boss { width: 20px; }
.m-bar i.on { background: var(--fg); border-color: var(--fg); }
.m-bar small { margin-left: 6px; font-size: var(--t-xs); color: var(--dim); }
.m-s { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.tag { display: inline-block; font-size: .6875rem; letter-spacing: .1em; padding: 1px 6px; border: 1px solid currentColor; line-height: 1.5; }
.tag.off { color: var(--bad); text-shadow: 0 0 6px var(--glow-b); }
.tag.work { color: var(--amber); text-shadow: 0 0 6px var(--glow-a); }
.tag.ok { color: var(--bg); background: var(--fg); border-color: var(--fg); text-shadow: none; }
.nb { font-size: .6875rem; letter-spacing: .08em; color: var(--dim); }
.nb.todo { color: var(--bad); text-shadow: 0 0 6px var(--glow-b); }
.nb.big { font-size: var(--t-s); padding: 6px 10px; border: 1px solid currentColor; }

.mem { border: 1px solid var(--faint); background: var(--bg2); padding-block: 6px; }
.mem-l { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) auto; gap: 10px; align-items: baseline; width: 100%; padding: 6px 12px; font-size: var(--t-s); }
.mem-a { color: var(--dim); font-family: var(--digits); font-size: 1.05rem; }
.mem-l.lock .mem-t { color: var(--dim); opacity: .55; letter-spacing: .08em; overflow-wrap: anywhere; }
.mem-l.open .mem-t { color: var(--hi); letter-spacing: .06em; }
.mem-new { font-size: var(--t-xs); color: var(--dim); }
.mem-l.fresh .mem-new { color: var(--amber); text-shadow: 0 0 6px var(--glow-a); animation: blink 1.4s steps(1) infinite; }
.mem-l.open:hover, .mem-l.open:focus-visible { background: var(--bg3); }

.train { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.op { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.op > div { border: 1px solid var(--faint); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.op small { font-size: .6875rem; letter-spacing: .1em; color: var(--dim); }
.op b { font-family: var(--digits); font-size: 1.6rem; line-height: 1.1; }
.op-reg { grid-column: 1 / -1; }
.reg { display: flex; gap: 3px; flex-wrap: wrap; margin-block: 6px 2px; }
.reg i { width: 14px; height: 14px; border: 1px solid var(--faint); }
.reg i.on { background: var(--fg); border-color: var(--fg); box-shadow: 0 0 8px var(--glow); }
.op-reg code { font-size: var(--t-xs); color: var(--dim); overflow-wrap: anywhere; }
.savenote { display: flex; gap: 10px; align-items: flex-start; font-size: var(--t-xs); color: var(--dim); margin-top: 6px; }
.savenote i { flex: none; width: 10px; height: 10px; margin-top: 4px; border: 1px solid var(--faint); }
.savenote i.on { background: var(--fg); border-color: var(--fg); box-shadow: 0 0 8px var(--glow); }

/* ---------- модуль ---------- */
.crumbs { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: var(--t-xs); letter-spacing: .12em; color: var(--dim); }
.crumbs button { padding: 8px 0; color: var(--fg); letter-spacing: .12em; }
.crumbs button:hover { color: var(--hi); }
.mhead { display: flex; gap: 14px; align-items: center; }
.mh-n { flex: none; width: 54px; height: 64px; display: grid; place-items: center; border: 1px solid var(--faint); }
.mh-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mhead h1 { font-size: var(--t-xl); line-height: 1.2; letter-spacing: .04em; color: var(--hi); }
.topic { color: var(--fg); font-size: var(--t-s); }
.course { font-size: var(--t-xs); color: var(--dim); }
.nbrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: var(--t-s); }
.nbrow small { font-size: var(--t-xs); color: var(--dim); }
.lvls { list-style: none; padding: 0; display: grid; gap: 8px; }
.lvl { display: grid; grid-template-columns: 3.4em minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 12px; border: 1px solid var(--faint); background: var(--bg2); }
.lvl:hover, .lvl:focus-visible { border-color: var(--fg); background: var(--bg3); }
.l-n { font-family: var(--digits); font-size: 1.6rem; line-height: 1; color: var(--dim); text-align: center; }
.lvl.done .l-n { color: var(--fg); }
.lvl.boss { border-style: double; border-width: 3px; }
.lvl.boss .l-n { font-size: 1.25rem; color: var(--amber); text-shadow: 0 0 6px var(--glow-a); }
.l-b { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.l-b b { font-size: var(--t-m); color: var(--hi); }
.l-b small { font-size: var(--t-xs); color: var(--dim); }
.l-next { font-size: var(--t-xs); color: var(--amber); letter-spacing: .12em; text-shadow: 0 0 6px var(--glow-a); }
.lvl.next { border-color: var(--fg); box-shadow: 0 0 10px var(--glow); }
.stars { display: inline-flex; gap: 4px; }
.stars i { width: 12px; height: 12px; border: 1px solid var(--faint); }
.stars i.on { background: var(--fg); border-color: var(--fg); box-shadow: 0 0 8px var(--glow); }
.stars.big { gap: 10px; }
.stars.big i { width: 34px; height: 34px; }
.stars.big i.on { animation: lampon .45s ease-out both; }
.stars.big i.on:nth-child(2) { animation-delay: .3s; }
.stars.big i.on:nth-child(3) { animation-delay: .6s; }
@keyframes lampon { from { background: transparent; box-shadow: none; } 50% { background: var(--hi); box-shadow: 0 0 26px var(--glow); } }

/* ---------- инструктаж ---------- */
.card { border: 1px solid var(--faint); background: var(--bg2); padding: 16px; }
.rich h2 { font-size: var(--t-l); color: var(--hi); letter-spacing: .03em; margin-bottom: 10px; }
.rich h2::before { content: '## '; color: var(--dim); }
.rich > * + * { margin-top: 10px; }
.rich ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rich li { position: relative; padding-left: 1.4em; }
.rich li::before { content: '›'; position: absolute; left: .2em; color: var(--dim); }
.formula { padding: 10px 12px; border: 1px dashed var(--fg); text-align: center; font-size: var(--t-l); color: var(--hi); overflow-x: auto; }
.callout { border: 1px solid var(--amber); padding: 12px; color: var(--amber); text-shadow: 0 0 6px var(--glow-a); }
.callout b { color: var(--amber); text-decoration: underline; text-underline-offset: 3px; }
.callout > * + * { margin-top: 8px; }
.tbl { border-collapse: collapse; font-size: var(--t-s); }
.tbl td { border: 1px solid var(--faint); padding: 4px 8px; text-align: center; }
.rich .tbl { display: block; overflow-x: auto; max-width: 100%; }
pre.code, pre.cols { margin: 0; padding: 12px; border: 1px solid var(--faint); background: var(--bg); overflow-x: auto; font-size: var(--t-s); line-height: 1.5; white-space: pre; text-shadow: 0 0 4px var(--glow); }
pre.cols { font-size: var(--t-m); letter-spacing: .04em; width: max-content; max-width: 100%; }
.code .k, .code .f, .codelines .k, .codelines .f { color: var(--hi); }
.code .s, .codelines .s { color: var(--str); }
.code .n, .codelines .n { color: var(--fg); }
.code .c, .codelines .c { color: var(--dim); }
.ref { margin-top: 8px; font-size: var(--t-s); color: var(--dim); }
.m { color: var(--hi); }
.nb sub { font-size: .7em; }
.tnav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; }
.tprog { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: var(--t-xs); color: var(--dim); letter-spacing: .1em; }
.tnav .btn { min-height: 48px; text-transform: uppercase; font-size: var(--t-s); letter-spacing: .06em; text-align: center; align-items: center; }
.segs { display: inline-flex; gap: 4px; }
.segs i { width: 8px; height: 8px; border: 1px solid var(--faint); }
.segs i.on { background: var(--fg); border-color: var(--fg); }

/* ---------- демо в инструктаже ---------- */
.wg { border: 1px dashed var(--fg); padding: 14px; display: flex; flex-direction: column; gap: 12px; background: rgba(78, 240, 133, .03); }
.wg-h { display: flex; align-items: center; gap: 10px; font-size: var(--t-s); color: var(--hi); }
.wg-tag { background: var(--fg); color: var(--bg); text-shadow: none; font-size: .6875rem; letter-spacing: .14em; padding: 2px 6px; }
.wg-ctl { display: flex; align-items: center; gap: 10px; font-size: var(--t-s); }
.wg-ctl.wrap { flex-wrap: wrap; }
.wg-ctl label, .wg-ctl .lbl { color: var(--dim); }
.wg-val { font-family: var(--digits); font-size: 1.7rem; line-height: 1; color: var(--hi); min-width: 2.2ch; text-align: center; }
.wg-val.big { font-size: 2.2rem; min-width: 4ch; }
.wg-res { font-size: var(--t-s); }
.wg-note { font-size: var(--t-s); color: var(--dim); }
.wg-note u { text-decoration-color: var(--dim); text-underline-offset: 3px; }
.wg-btns, .wg-keys { display: flex; flex-wrap: wrap; gap: 8px; }
.wg-b, .wg-k { min-height: 44px; padding: 8px 14px; border: 1px solid var(--faint); background: var(--bg2); font-size: var(--t-s); color: var(--fg); }

.wg-b:active:not(:disabled), .wg-k:active, .wg-k.sel { background: var(--fg); color: var(--bg); text-shadow: none; border-color: var(--fg); }
.wg-b:disabled { opacity: .4; }
.wg-seg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.wg-in { font: inherit; font-size: 16px; color: var(--hi); background: var(--bg); border: 1px solid var(--fg); padding: 10px 12px; width: 100%; text-shadow: 0 0 6px var(--glow); border-radius: 0; caret-color: var(--fg); }
.wg-in.short { width: 7.5em; }

.wg-lab { font-size: var(--t-s); color: var(--dim); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; background: var(--faint); border: 0; }
input[type=range]::-moz-range-track { height: 6px; background: var(--faint); border: 0; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 26px; margin-top: -10px; background: var(--fg); border: 0; box-shadow: 0 0 10px var(--glow); }

.wg-dots { display: flex; flex-wrap: wrap; gap: 4px; }

.wg-chart { width: 100%; max-width: 420px; height: auto; }

.wg-chart .ax { stroke: var(--dim); stroke-width: 1; }
.wg-chart .gr { stroke: var(--faint); stroke-dasharray: 3 3; }
.wg-chart .cv { fill: none; stroke: var(--fg); stroke-width: 2; filter: drop-shadow(0 0 3px var(--glow)); }
.wg-chart .mk { stroke: var(--amber); stroke-dasharray: 2 3; }
.wg-chart .pt { fill: var(--amber); }
.wg-msg { font-family: var(--digits); font-size: 2rem; line-height: 1.1; letter-spacing: .12em; color: var(--hi); min-height: 1.2em; overflow-wrap: anywhere; }
.wg-tbl { display: flex; flex-direction: column; gap: 8px; }
.wg-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; font-size: var(--t-s); }
.wg-line .lbl { flex: 1 0 7em; display: flex; flex-direction: column; color: var(--dim); }
.wg-line > .bword, .wg-line > code, .wg-line > b { flex: 0 1 auto; min-width: 0; }
.wg-line .lbl small { font-size: .6875rem; color: var(--dim); opacity: .8; }
.wg-line code { overflow-wrap: anywhere; color: var(--hi); }
.wg-line.sum { border-top: 1px solid var(--faint); padding-top: 8px; }
.wg-row2 { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: var(--t-s); }
.wg-row2 .lbl { flex: 0 0 5.8em; display: flex; flex-direction: column; color: var(--dim); }
.wg-row2 > :not(.lbl) { flex: 0 1 auto; min-width: 0; }
.wg-row2 .lbl small { font-size: .6875rem; }
.wg-calc { font-size: var(--t-s); display: flex; flex-direction: column; gap: 2px; color: var(--fg); }
.wg-chars { display: flex; flex-wrap: wrap; gap: 6px; }
.wg-ch { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 8px; border: 1px solid var(--faint); min-width: 3.4em; }
.wg-ch b { font-size: var(--t-l); }
.wg-ch code { font-size: .6875rem; color: var(--dim); }
.wg-ch small { font-size: .6875rem; color: var(--dim); }
.wg-ch.b2 { border-color: var(--fg); }

.wg-steps { display: flex; flex-direction: column; gap: 2px; font-size: var(--t-s); }
.wg-st { display: flex; justify-content: space-between; gap: 10px; padding: 3px 8px; border-left: 2px solid var(--faint); }
.wg-st.rd { border-left-color: var(--amber); background: rgba(255, 184, 77, .07); }
.wg-st.rd b { color: var(--amber); text-shadow: 0 0 6px var(--glow-a); }
.wg-grp { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; font-size: var(--t-s); }
.wg-grp .lbl { width: 100%; color: var(--dim); font-size: var(--t-xs); letter-spacing: .08em; }
.gbox { display: flex; flex-direction: column; align-items: center; padding: 4px 8px; border: 1px solid var(--fg); }
.gbox.alt { border-color: var(--dim); }
.gbox code { letter-spacing: .12em; }
.gbox b { font-family: var(--digits); font-size: 1.7rem; line-height: 1; }
.wg-sw { display: flex; gap: 6px; justify-content: space-between; flex-wrap: wrap; }
.wg-two { display: grid; grid-template-columns: 1fr; gap: 10px; }
.wg-colwrap { overflow-x: auto; }
.wg-col { border-collapse: collapse; font-family: var(--digits); font-size: 1.75rem; line-height: 1.05; }
.wg-col td { width: 1.15em; text-align: center; padding: 0 1px; }
.wg-col tr.carry td { font-size: 1.1rem; color: var(--amber); text-shadow: 0 0 6px var(--glow-a); height: 1.1rem; }
.wg-col tr.ln td { border-top: 2px solid var(--fg); height: 4px; padding: 0; }
.wg-col tr.sum td { color: var(--hi); }
.wg-col .cur { color: var(--bg); background: var(--fg); text-shadow: none; padding: 0 2px; }
.lamp-ok, .lamp-bad { display: inline-block; padding: 1px 6px; margin-right: 6px; font-size: .6875rem; letter-spacing: .12em; }
.lamp-ok { background: var(--fg); color: var(--bg); text-shadow: none; }

.wg .ok { color: var(--hi); }
.wg .bad { color: var(--bad); text-shadow: 0 0 6px var(--glow-b); }
.wg .warn { color: var(--amber); text-shadow: 0 0 6px var(--glow-a); }
/* ячейки-биты демо */
.bword { display: inline-flex; flex-wrap: wrap; gap: 3px; }
.bword.wide { gap: 4px; }
.bcol { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.bcol small { font-size: .625rem; color: var(--dim); line-height: 1.15; text-align: center; }
.bcol small.wt { font-family: var(--digits); font-size: .95rem; color: var(--fg); }
.bt { display: inline-grid; place-items: center; width: 28px; height: 34px; border: 1px solid var(--faint); background: var(--bg); font-family: var(--digits); font-size: 1.55rem; line-height: 1; color: var(--dim); text-shadow: none; }
button.bt:hover { border-color: var(--fg); }
.bt.on { background: var(--fg); border-color: var(--fg); color: var(--bg); box-shadow: 0 0 10px var(--glow); }
.bt.ro { width: 22px; height: 28px; font-size: 1.25rem; }
.bt.par { outline: 1px dashed var(--amber); outline-offset: 1px; }
.bt.sg { outline: 1px dashed var(--amber); outline-offset: 1px; }
.bt.nz { border-color: var(--bad); box-shadow: 0 0 10px var(--glow-b); }
.bt.nz.on { background: var(--bad); border-color: var(--bad); }
.bt.pt { outline: 2px solid var(--amber); outline-offset: 2px; }
.bt.gone { opacity: .35; text-decoration: line-through; margin-right: 6px; }

.bword.sm .bt.ro { width: 17px; height: 24px; font-size: 1.05rem; }

/* ---------- игра ---------- */
#app[data-screen="play"] { height: 100%; display: flex; flex-direction: column; }
.pbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--faint); background: var(--bg); }
.pb-btn { min-width: 44px; min-height: 40px; padding: 6px 8px; border: 1px solid var(--faint); font-size: var(--t-s); letter-spacing: .08em; text-align: center; }
.pb-btn:hover, .pb-btn:focus-visible { border-color: var(--fg); background: var(--bg3); }
.pb-prog { flex: 1; display: flex; gap: 3px; min-width: 0; }
.pb-prog i { flex: 1; height: 10px; border: 1px solid var(--faint); min-width: 4px; }
.pb-prog i.on { background: var(--fg); border-color: var(--fg); box-shadow: 0 0 8px var(--glow); }
.pb-prog i.miss { background: var(--bad); border-color: var(--bad); }
.pb-prog i.cur { border-color: var(--fg); animation: blink 1.1s steps(1) infinite; }
.pb-prog i.re:not(.on):not(.miss):not(.cur) { border-style: dashed; }
.stage { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: var(--t-xs); letter-spacing: .12em; color: var(--dim); }
.meta .re { color: var(--amber); font-size: .6875rem; border: 1px solid var(--amber); padding: 0 6px; text-shadow: 0 0 6px var(--glow-a); }
.combo { color: var(--bg); background: var(--amber); padding: 0 6px; font-size: .6875rem; letter-spacing: .1em; text-shadow: none; box-shadow: 0 0 10px var(--glow-a); }
.prompt { font-size: var(--t-l); line-height: 1.6; color: var(--fg); overflow-wrap: break-word; }
.prompt > * + * { margin-top: 8px; }
.display { display: flex; align-items: baseline; gap: 6px; min-height: 66px; padding: 10px 14px; border: 1px solid var(--fg); background: var(--bg); font-family: var(--digits); font-size: 2.4rem; line-height: 1.15; color: var(--hi); overflow-wrap: anywhere; box-shadow: inset 0 0 18px rgba(78, 240, 133, .1); }
.display .pr { color: var(--dim); }
.display .dv { min-width: 0; }
.display .ph { color: var(--faint); }
.display sub { font-size: 1.2rem; color: var(--dim); }
.display .unit { font-family: var(--font); font-size: var(--t-s); color: var(--dim); margin-left: 4px; }
.caret { display: inline-block; width: .5em; height: .9em; background: var(--fg); align-self: center; animation: blink 1s steps(1) infinite; box-shadow: 0 0 8px var(--glow); }
.display.ok { border-color: var(--fg); box-shadow: 0 0 16px var(--glow), inset 0 0 18px rgba(78, 240, 133, .18); }
.display.bad { border-color: var(--bad); color: var(--bad); text-shadow: 0 0 8px var(--glow-b); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; min-height: 52px; border: 1px solid var(--faint); background: var(--bg2); }
.opt .ok-k { display: grid; place-items: center; width: 2em; height: 2em; border: 1px solid var(--faint); font-family: var(--digits); font-size: 1.2rem; line-height: 1; color: var(--dim); }
.opt .ot { overflow-wrap: anywhere; }
.opt.mono .ot { letter-spacing: .04em; }
.opt:hover:not(:disabled) { border-color: var(--fg); }
.opt.sel { border-color: var(--fg); background: var(--bg3); box-shadow: 0 0 10px var(--glow); }
.opt.sel .ok-k { background: var(--fg); border-color: var(--fg); color: var(--bg); text-shadow: none; }
.opt.right { border-color: var(--fg); background: var(--bg3); }
.opt.right .ok-k { background: var(--fg); border-color: var(--fg); color: var(--bg); text-shadow: none; }
.opt.wrong { border-color: var(--bad); color: var(--bad); text-shadow: 0 0 6px var(--glow-b); }
.opt.wrong .ok-k { border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }
.codelines { border: 1px solid var(--faint); background: var(--bg); overflow-x: auto; }
.codelines button { display: grid; grid-template-columns: 2.4em max-content; gap: 8px; width: 100%; min-width: max-content; padding: 6px 10px 6px 0; font-size: var(--t-s); white-space: pre; border-left: 3px solid transparent; }
.codelines .ln { text-align: right; color: var(--dim); }
.codelines button:hover:not(:disabled) { background: var(--bg3); }
.codelines button.sel { background: var(--bg3); border-left-color: var(--fg); }
.codelines button.right { background: rgba(78, 240, 133, .14); border-left-color: var(--fg); }
.codelines button.wrong { background: rgba(255, 107, 87, .12); border-left-color: var(--bad); }
.bitsbox { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.bitrow { display: flex; flex-wrap: nowrap; justify-content: center; }
.bitcol { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.bit { width: var(--s); height: calc(var(--s) * 1.2); display: grid; place-items: center; border: 1px solid var(--faint); background: var(--bg); font-family: var(--digits); font-size: calc(var(--s) * .72); line-height: 1; color: var(--dim); text-shadow: none; }
.bit:hover:not(:disabled) { border-color: var(--fg); }
.bit.on { background: var(--fg); border-color: var(--fg); color: var(--bg); box-shadow: 0 0 10px var(--glow); }
.bitcol .lbl, .bitcol .pos { font-size: .6875rem; color: var(--dim); }
.bitcol.sel .bit { outline: 2px solid var(--amber); outline-offset: 2px; }
.bitcol.right .bit { outline: 2px solid var(--fg); outline-offset: 2px; }
.bitcol.wrongpick .bit { outline: 2px solid var(--bad); outline-offset: 2px; }
.bithint { font-size: var(--t-xs); color: var(--dim); text-align: center; }
.helprow { display: flex; gap: 18px; flex-wrap: wrap; }
.hintbox { border: 1px dashed var(--amber); padding: 10px 12px; font-size: var(--t-s); color: var(--amber); text-shadow: 0 0 6px var(--glow-a); }
.hintbox .who { font-size: var(--t-xs); letter-spacing: .16em; opacity: .75; margin-right: 6px; }
.hintbox b { color: var(--amber); text-decoration: underline; text-underline-offset: 3px; }
.dock { padding: 10px 16px 12px; border-top: 1px solid var(--faint); background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
.keys { display: grid; gap: 6px; }
.keys button { display: grid; place-items: center; text-align: center; min-height: 50px; border: 1px solid var(--faint); background: var(--bg2); font-family: var(--digits); font-size: 1.9rem; line-height: 1; color: var(--fg); }
.keys.hex button { min-height: 44px; font-size: 1.6rem; }
.keys button.fn { font-family: var(--font); font-size: var(--t-xs); letter-spacing: .1em; color: var(--dim); }
.keys button:hover { border-color: var(--fg); }
.keys button:active { background: var(--fg); color: var(--bg); text-shadow: none; }
.stage.shake { animation: shake .32s linear; }
.stage.flash .display, .stage.flash .opt.right, .stage.flash .bitsbox { animation: flash .5s ease-out; }
@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
@keyframes flash { from { filter: brightness(1.8); } to { filter: none; } }

/* ответ: окно снизу */
.fb { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, .45); }
.fb-in { width: 100%; max-width: 680px; max-height: 86%; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--bg2); border-top: 2px solid var(--fg); box-shadow: 0 -12px 40px rgba(0, 0, 0, .7), 0 -2px 18px var(--glow); animation: up .22s ease-out; }
.fb.bad .fb-in { border-top-color: var(--bad); box-shadow: 0 -12px 40px rgba(0, 0, 0, .7), 0 -2px 18px var(--glow-b); }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.fb-v { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--digits); font-size: 2rem; line-height: 1; color: var(--hi); }
.fb.bad .fb-v { color: var(--bad); text-shadow: 0 0 8px var(--glow-b); }
.fb-v .xp { font-size: 1.2rem; color: var(--bg); background: var(--fg); padding: 2px 8px; text-shadow: none; }
.fb-v .combo { font-family: var(--font); font-size: var(--t-xs); padding: 3px 8px; }
.fb-ans { font-size: var(--t-m); }
.fb-note { font-size: var(--t-xs); color: var(--dim); }
.fb-scroll { overflow-y: auto; min-height: 0; flex: 0 1 auto; }
.steps { padding-left: 1.6em; display: flex; flex-direction: column; gap: 6px; font-size: var(--t-s); }
.steps li::marker { color: var(--dim); font-family: var(--digits); }
.steps pre.cols { font-size: var(--t-s); }

/* ---------- итог ---------- */
.result { align-items: stretch; text-align: left; padding-top: 24px; }
.res-h { font-family: var(--digits); font-size: 2.6rem; line-height: 1; color: var(--hi); letter-spacing: .02em; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats > div { border: 1px solid var(--faint); padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stats b { font-family: var(--digits); font-size: 2rem; line-height: 1; }
.stats small { font-size: var(--t-xs); color: var(--dim); }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }

/* ---------- окна ---------- */
#sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
#sheet[hidden] { display: none; }
.backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); }
.panelx { position: relative; width: 100%; max-width: 680px; max-height: 88%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--bg2); border-top: 2px solid var(--fg); box-shadow: 0 -2px 18px var(--glow); animation: up .2s ease-out; }
.panelx h2 { font-size: var(--t-xl); color: var(--hi); }
.cheat { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: var(--t-s); }
.cheat li { padding: 8px 10px; border-left: 2px solid var(--fg); background: var(--bg); }
.sheetbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.opts2 { display: grid; gap: 8px; }

/* ---------- сюжет ---------- */
#app[data-screen="story"], #app[data-screen="boot"] { height: 100%; }
.story { min-height: 100%; display: flex; flex-direction: column; gap: 16px; padding: 14px 16px 28px; cursor: pointer; }
.st-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: var(--t-xs); letter-spacing: .14em; color: var(--dim); border-bottom: 1px dashed var(--faint); padding-bottom: 10px; }
.st-skip { padding: 8px 10px; border: 1px solid var(--faint); color: var(--fg); letter-spacing: .12em; }
.st-skip:hover, .st-skip:focus-visible { border-color: var(--fg); }
.st-who { display: flex; gap: 14px; align-items: center; color: var(--amber); text-shadow: 0 0 6px var(--glow-a); }
.st-who b { color: var(--amber); display: block; letter-spacing: .2em; }
.st-who small { font-size: var(--t-xs); opacity: .8; }
.st-log { display: flex; flex-direction: column; gap: 14px; }
.sl.sys { font-size: var(--t-s); color: var(--dim); letter-spacing: .06em; }
.sl.sam { color: var(--amber); text-shadow: 0 0 6px var(--glow-a); border-left: 2px solid rgba(255, 184, 77, .5); padding-left: 12px; }
.sl.sam .who { display: block; font-size: var(--t-xs); letter-spacing: .18em; opacity: .7; }
.sl.sam p { font-size: var(--t-l); line-height: 1.55; }
.sl.mem { font-family: var(--digits); font-size: 1.9rem; line-height: 1.15; color: var(--hi); letter-spacing: .05em; padding: 10px 12px; border: 1px solid var(--hi); box-shadow: 0 0 16px var(--glow), inset 0 0 16px rgba(198, 255, 216, .08); }
.st-foot { margin-top: auto; padding-top: 10px; }
.st-more { font-size: var(--t-xs); letter-spacing: .14em; color: var(--dim); animation: blink 1.4s steps(1) infinite; }

/* ---------- включение ---------- */
.power { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 40px 16px; text-align: center; }
.pw-logo .mx { width: min(80vw, 300px); }
.pw-sub { font-size: var(--t-s); color: var(--dim); letter-spacing: .08em; }
.pw-state { font-size: var(--t-xs); letter-spacing: .2em; color: var(--dim); }
.pw-state b { color: var(--bad); text-shadow: 0 0 6px var(--glow-b); }
.pw-btn { position: relative; display: grid; place-items: center; gap: 6px; width: 132px; height: 132px; border: 2px solid var(--fg); border-radius: 50%; color: var(--hi); letter-spacing: .14em; font-size: var(--t-s); box-shadow: 0 0 22px var(--glow), inset 0 0 22px rgba(78, 240, 133, .14); }

function composition(S, n) {
  const cuts = R.sample([...Array(S - 1)].map((_, i) => i + 1), n - 1).sort((x, y) => x - y);
  const f = []; let prev = 0;
  for (const c of cuts) { f.push(c - prev); prev = c; }
  f.push(S - prev);
  return f;
}

function randInBase(q, len) { let s = DIG[R.int(1, q - 1)]; for (let i = 1; i < len; i++) s += DIG[R.int(0, q - 1)]; return s; }
const lenFor = q => (q === 2 ? R.int(5, 8) : q <= 5 ? R.int(3, 4) : 3);
function powersSteps(n, q) {
  let k = 0; while (q ** (k + 1) <= n) k++;
  const pw = []; for (let i = 0; i <= k; i++) pw.push(`${q}${sup(i)} = ${q ** i}`);
  const st = [`Степени: ${pw.join(', ')} (${q}${sup(k + 1)} = ${q ** (k + 1)} уже больше ${n})`];
  let rem = n; const digits = [];
  for (let i = k; i >= 0; i--) {
    const d = Math.floor(rem / q ** i); digits.push(DIG[d]);
    st.push(`${q}${sup(i)} = ${q ** i}: ${rem} = ${d}·${q ** i} + ${rem - d * q ** i} → цифра ${b(DIG[d])}`);
    rem -= d * q ** i;
  }
  st.push(`Ответ: ${b(NB(digits.join(''), q))}`);
  return st;
}

const randBin = (lo, hi) => '1' + R.bits(R.int(lo, hi) - 1);
function groupSteps(bin, k, q) {
  const padded = padTo(bin, k); const gs = padded.match(new RegExp(`.{${k}}`, 'g'));
  const res = gs.map(g => DIG[fromBase(g, 2)]).join('').replace(/^0+(?=.)/, '');
  const st = [];
  if (padded !== bin) st.push(`Дополняем слева нулями до длины, кратной ${k}: ${padded}`);
  st.push(`Группы по ${k} справа налево: ${gs.join(' ')}`);
  st.push(gs.map(g => `${g} → ${DIG[fromBase(g, 2)]}`).join(', '));
  st.push(`Ответ: ${b(NB(res, q))}`);
  return st;
}
function ungroupSteps(s, k, q) {
  const parts = [...s].map(c => padL(toBase(DIG.indexOf(c), 2), k));

  return [[...s].map((c, i) => `${c} → ${parts[i]}`).join(', '), `Склеиваем: ${joined}`].concat(stripped !== joined ? [`Ведущие нули можно отбросить: ${b(stripped)}`] : [`Ответ: ${b(joined)}`]);
}

function addTask(q, a, c, extra = {}) {
  const r = addCols(a, c, q); const w = Math.max(a.length, c.length, r.res.length);
  return BASEN(extra.prompt || `Сложи столбиком: ${b(NB(a, q))} + ${b(NB(c, q))}`, r.res, q, Object.assign({
    hint: q === 2 ? '1 + 1 = 10₂: пишем 0, перенос 1. 1 + 1 + 1 = 11₂: пишем 1, перенос 1.' : `Складывай справа налево. Если сумма разряда ≥ ${q}, пиши (сумма − ${q}) и переноси 1.`,
    steps: [colBlock(a, c, r.res, addMarks(r, w), '+')].concat(addSteps(r, q)).concat([`Проверка: ${fromBase(a, q)} + ${fromBase(c, q)} = ${fromBase(r.res, q)} = ${NB(r.res, q)}`]) }, extra));
}
function pairWithCarries(q, lenA, lenB, minCarries) {
  for (let t = 0; t < 200; t++) {
    const a = randInBase(q, lenA), c = randInBase(q, lenB);
    if (addCols(a, c, q).carries >= minCarries) return [a, c];
  }
  return [randInBase(q, lenA), randInBase(q, lenB)];
}
function subTask(q, a, c, extra = {}) {
  const r = subCols(a, c, q);
  const marks = r.cols.map(cl => (cl.bin ? '•' : ' ')).reverse().join('');
  return BASEN(extra.prompt || `Вычти столбиком: ${b(NB(a, q))} − ${b(NB(c, q))}`, r.res, q, Object.assign({
    hint: `Если цифра уменьшаемого меньше — займи единицу старшего разряда: она даёт ${q} единиц текущего.`,
    steps: [colBlock(a, c, padL(r.res, a.length, ' '), marks, '−'), '• — у этого разряда заняли 1'].concat(subSteps(r, q)).concat([`Проверка: ${fromBase(a, q)} − ${fromBase(c, q)} = ${fromBase(r.res, q)} = ${NB(r.res, q)}`]) }, extra));
}
function subPair(q, len, minBorrows) {
  for (let t = 0; t < 300; t++) {
    const a = randInBase(q, len), c = randInBase(q, R.chance(0.7) ? len : len - 1);
    if (fromBase(a, q) > fromBase(c, q) && subCols(a, c, q).borrows >= minBorrows) return [a, c];
  }
  return [DIG[q - 1].repeat(len), '1'];
}

  if (raw.length > 8) st.push(`Девятый бит (перенос за разрядную сетку) отбрасываем: ${res}`);

function canon(s) {
  return String(s == null ? '' : s).trim().replace(/\s+/g, '').replace(/[−–—]/g, '-').replace(/,/g, '.').toUpperCase();
}
function canonBase(s) {
  let neg = false;
  if (s.startsWith('-')) { neg = true; s = s.slice(1); }
  let [ip, fp = ''] = s.split('.');
  ip = ip.replace(/^0+/, '') || '0';
  fp = fp.replace(/0+$/, '');
  const r = fp ? ip + '.' + fp : ip;
  return neg && r !== '0' ? '-' + r : r;
}
function check(task, input) {
  switch (task.kind) {
    case 'mc': return input != null && !!(task.options[input] && task.options[input].ok);
    case 'line': case 'tap': return input === task.answer;
    case 'bits': return input === task.answer;
    case 'num': {
      const a = canon(input);
      if (!a || a === '-' || a === '.' || a === '-.') return false;
      const answers = [task.answer].concat(task.accept || []).map(canon);
      if (task.tol != null) {
        const v = Number(a); if (!isFinite(v)) return false;
        return answers.some(x => Math.abs(Number(x) - v) <= task.tol + 1e-9);
      }
      if (task.exact) return answers.includes(a);
      if (task.keys === 'dec') {
        const v = Number(a); if (!isFinite(v)) return answers.includes(a);
        return answers.some(x => Math.abs(Number(x) - v) < 1e-9);
      }
      return answers.map(canonBase).includes(canonBase(a));
    }
  }
  return false;
}

  switch (task.kind) {
    case 'mc': { const o = task.options.find(x => x.ok); return task.mono ? m(esc(o.t)) : esc(o.t); }
    case 'line': return `строка ${task.answer + 1}`;

}

  7: [['sam', 'Осталась одна строка. Подпись, наверное.'], ['sam', 'Последний модуль, студент. Сделай его. Не для меня. Для себя.']],
};

const FINALE = [
  ['sys', 'ВСЕ МОДУЛИ В НОРМЕ. КВАРЦ-8 ЗАПУЩЕН.'],
  ['sys', 'ПАМЯТЬ ДЕШИФРОВАНА ПОЛНОСТЬЮ:'],
  ['mem', FRAG.slice(0, 7).join(' ')],
  ['mem', FRAG[7]],
  ['sam', '…'],
  ['sam', 'Старый хрен. Всё знал заранее.'],
  ['sam', 'Тридцать лет я ходил мимо. А нужен был всего один упёртый студент.'],
  ['sam', 'Слушай сюда. Ты пришёл сюда нулём. Сейчас в тебе минимум байт. А может, и килобайт.'],
  ['sam', 'Иди сдавай свою информатику. Завалишь — {пизда|конец} тебе. Я узнаю.'],
  ['sam', '…Спасибо, студент.'],
  ['sys', 'КОНЕЦ. ПУЛЬТ ОСТАЁТСЯ ВКЛЮЧЁННЫМ: ЛЮБОЙ УРОВЕНЬ МОЖНО ПЕРЕПРОЙТИ НА ТРИ ЗВЕЗДЫ.'],
];

return { INTRO, MODS, CARD, SAM, FRAG, BEATS, FINALE };
})();

<script>
/* «Бит за битом» — звуки терминала (Web Audio, без файлов) */
const SFX = (() => {
'use strict';
let ctx = null, master = null, enabled = true, armed = false, lastTick = 0, noiseBuf = null;

function ac() {
  if (!enabled || !armed) return null;
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.7;
      master.connect(ctx.destination);
    } catch (e) { ctx = null; return null; }
  }
  if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) { /* ждём жеста */ } }
  return ctx.state === 'closed' ? null : ctx;
}
function env(g, t, attack, dur, peak) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + dur);
}
function tone(f, dur, o = {}) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + (o.at || 0);
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'square';
  osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  env(g, t, o.attack || 0.004, dur, o.vol || 0.05);
  osc.connect(g); g.connect(master);
  osc.start(t); osc.stop(t + (o.attack || 0.004) + dur + 0.03);
}
function noise(dur, o = {}) {
  const c = ac(); if (!c) return;
  if (!noiseBuf) {
    noiseBuf = c.createBuffer(1, Math.floor(c.sampleRate * 0.6), c.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = c.currentTime + (o.at || 0);
  const s = c.createBufferSource(); s.buffer = noiseBuf;
  const f = c.createBiquadFilter(); f.type = o.filter || 'bandpass'; f.frequency.value = o.freq || 3000; f.Q.value = o.q || 1;
  const g = c.createGain(); env(g, t, 0.002, dur, o.vol || 0.05);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.05);
}

return {
  // звук возможен только после первого касания или клавиши
  unlock() { armed = true; ac(); },
  get on() { return enabled; },
  set(v) {
    enabled = !!v;
    if (ctx) { try { if (enabled) ctx.resume(); else ctx.suspend(); } catch (e) { /* ничего */ } }
  },
  // щелчок клавиши
  key() { noise(0.028, { vol: 0.11, freq: 2300, q: 0.7 }); tone(1800, 0.01, { vol: 0.012 }); },
  // печать текста Сэма
  tick() {
    const now = performance.now(); if (now - lastTick < 55) return; lastTick = now;
    noise(0.01, { vol: 0.035, freq: 3800 + Math.random() * 1800, q: 2.5 });
  },
  // тумблер / бит
  flip() { noise(0.018, { vol: 0.08, freq: 1400, q: 1.2 }); tone(520, 0.025, { vol: 0.02, type: 'triangle' }); },
  ok() { tone(880, 0.06, { vol: 0.045 }); tone(1318.5, 0.12, { vol: 0.045, at: 0.075 }); },
  bad() { tone(196, 0.22, { type: 'sawtooth', vol: 0.045, to: 98 }); tone(147, 0.26, { vol: 0.025, at: 0.02, to: 70 }); },
  win() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.12, { vol: 0.04, at: i * 0.09 })); },
  repair() {
    [392, 523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, 0.16, { vol: 0.035, at: i * 0.1 }));
    noise(0.7, { vol: 0.018, freq: 700, filter: 'lowpass', at: 0.05 });
  },
  boot() {
    tone(48, 0.45, { type: 'sine', vol: 0.12, to: 32, attack: 0.01 });
    noise(0.35, { vol: 0.07, freq: 900, filter: 'lowpass' });
    noise(0.08, { vol: 0.05, freq: 5000, q: 0.5, at: 0.05 });
    tone(2637, 0.05, { vol: 0.02, at: 0.5 });
  },
  beep() { tone(1046.5, 0.07, { vol: 0.035 }); },
};
})();

<script>
/* «Бит за битом» — интерактивные штуки к инструктажу Сэма */
const WIDGETS = (() => {
'use strict';
const SUPD = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const SUBD = '₀₁₂₃₄₅₆₇₈₉';
const sup = n => String(n).split('').map(c => (c === '-' ? '⁻' : SUPD[+c])).join('');
const sub = n => String(n).split('').map(c => SUBD[+c]).join('');
const ru = x => String(x).replace('.', ',').replace(/^-/, '−');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pl = (n, a, b, c) => { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; };
const bitW = n => pl(n, 'бит', 'бита', 'бит');
const pad = (v, n) => String(v).padStart(n, '0');
const DIG = '0123456789ABCDEF';
const snd = k => { try { SFX[k](); } catch (e) { /* без звука */ } };
const ST = {};
const st = (k, d) => (ST[k] = ST[k] || d);
const alive = el => el && el.isConnected;
const $ = (el, sel) => el.querySelector(sel);
const out = (el, k, html) => { const o = el.querySelector(`[data-o="${k}"]`); if (o) o.innerHTML = html; };
const head = t => `<div class="wg-h"><span class="wg-tag">ДЕМО</span><span>${t}</span></div>`;
const cell = (bit, attrs = '', cls = '') => `<button type="button" class="bt${bit === '1' ? ' on' : ''}${cls ? ' ' + cls : ''}" ${attrs} aria-pressed="${bit === '1'}">${bit}</button>`;
const lit = (bit, cls = '') => `<span class="bt ro${bit === '1' ? ' on' : ''}${cls ? ' ' + cls : ''}">${bit}</span>`;
const word = (s, clsAt = () => '', extra = '') => `<span class="bword${extra ? ' ' + extra : ''}">${[...s].map((c, i) => lit(c, clsAt(i))).join('')}</span>`;

const W = {};

// ---------- 1. Хартли: деление пополам ----------
W.halving = {
  shell: () => `${head('Каждый вопрос «да/нет» — это 1 бит')}
    <div class="wg-ctl"><label for="wg-hn">Вариантов N</label><output class="wg-val" data-o="n"></output></div>
    <input type="range" id="wg-hn" min="2" max="64" step="1" aria-label="Количество вариантов N">
    <div class="wg-dots" data-o="dots"></div>
    <p class="wg-res" data-o="res"></p>
    <div class="wg-btns"><button type="button" class="wg-b" data-w="run">Угадать загаданный вариант</button></div>
    <ol class="wg-log" data-o="log"></ol>`,
  mount(el) {
    const s = st('halving', { n: 32 });
    const r = $(el, 'input'); r.value = s.n;
    let timer = null;
    const draw = (lo = 0, hi = s.n, hit = -1) => {
      out(el, 'n', s.n);
      out(el, 'dots', Array.from({ length: s.n }, (_, i) => `<i class="${i === hit ? 'hit' : i < lo || i >= hi ? 'off' : ''}"></i>`).join(''));
      const x = Math.log2(s.n), k = Math.round(x);
      if (2 ** k === s.n) out(el, 'res', `I = log₂${s.n} = <b>${k} ${bitW(k)}</b>, потому что 2${sup(k)} = ${s.n}.`);
      else {
        const f = Math.floor(x), c = Math.ceil(x);
        out(el, 'res', `I = log₂${s.n} ≈ <b>${ru(x.toFixed(3))} бита</b>. 2${sup(f)} = ${2 ** f} &lt; ${s.n} &lt; ${2 ** c} = 2${sup(c)}, поэтому для номера варианта нужно <b>${c} ${bitW(c)}</b>.`);
      }
    };
    r.addEventListener('input', () => { clearTimeout(timer); s.n = Number(r.value); out(el, 'log', ''); draw(); });
    el.addEventListener('click', e => {
      if (!e.target.closest('[data-w="run"]')) return;
      clearTimeout(timer); snd('key');
      const secret = Math.floor(Math.random() * s.n);
      let lo = 0, hi = s.n, q = 0; const log = [];
      out(el, 'log', ''); draw();
      const step = () => {
        if (!alive(el)) return;
        if (hi - lo <= 1) {
          draw(lo, hi, secret);
          log.push(`<li class="ok">Нашли вариант № ${secret + 1} за ${q} ${pl(q, 'вопрос', 'вопроса', 'вопросов')}. Каждый ответ «да/нет» дал 1 бит.</li>`);
          out(el, 'log', log.join('')); snd('ok'); return;
        }
        const mid = lo + Math.ceil((hi - lo) / 2);
        const yes = secret < mid; q++;
        log.push(`<li>Вопрос ${q}: номер ≤ ${mid}? — ${yes ? 'да' : 'нет'}</li>`);
        if (yes) hi = mid; else lo = mid;
        draw(lo, hi); out(el, 'log', log.join('')); snd('beep');
        timer = setTimeout(step, 650);
      };
      timer = setTimeout(step, 300);
    });
    draw();
  },
};

// ---------- 2. Шеннон: кривая монета ----------
W.coin = {
  shell: () => `${head('Кривая монета')}
    <div class="wg-ctl"><label for="wg-cp">Вероятность орла p</label><output class="wg-val" data-o="p"></output></div>
    <input type="range" id="wg-cp" min="0" max="100" step="1" aria-label="Вероятность орла">
    <svg class="wg-chart" viewBox="0 0 260 112" role="img" aria-label="График энтропии монеты" data-o="svg"></svg>
    <p class="wg-res" data-o="res"></p>
    <p class="wg-note" data-o="note"></p>`,
  mount(el) {
    const s = st('coin', { p: 70 });
    const r = $(el, 'input'); r.value = s.p;
    const H = p => (p <= 0 || p >= 1 ? 0 : -(p * Math.log2(p) + (1 - p) * Math.log2(1 - p)));
    const X = p => 30 + p * 210, Y = h => 88 - h * 72;
    let path = '';
    for (let i = 0; i <= 100; i++) path += (i ? 'L' : 'M') + X(i / 100).toFixed(1) + ' ' + Y(H(i / 100)).toFixed(1);
    const draw = () => {
      const p = s.p / 100, q = 1 - p, h = H(p);
      out(el, 'p', ru(p.toFixed(2)));
      out(el, 'svg', `<line class="ax" x1="30" y1="88" x2="244" y2="88"/><line class="ax" x1="30" y1="12" x2="30" y2="88"/>
        <line class="gr" x1="30" y1="16" x2="244" y2="16"/>
        <text x="24" y="20" text-anchor="end">1</text><text x="24" y="92" text-anchor="end">0</text>
        <text x="30" y="104" text-anchor="middle">0</text><text x="135" y="104" text-anchor="middle">0,5</text><text x="240" y="104" text-anchor="middle">1</text>
        <text x="250" y="92" text-anchor="start">p</text><text x="36" y="10">H, бит</text>
        <path class="cv" d="${path}"/>
        <line class="mk" x1="${X(p).toFixed(1)}" y1="88" x2="${X(p).toFixed(1)}" y2="${Y(h).toFixed(1)}"/>
        <circle class="pt" cx="${X(p).toFixed(1)}" cy="${Y(h).toFixed(1)}" r="5"/>`);
      if (p === 0 || p === 1) out(el, 'res', `H = <b>0 бит</b>: исход известен заранее, информации ноль.`);
      else out(el, 'res', `H = −(${ru(p.toFixed(2))}·log₂${ru(p.toFixed(2))} + ${ru(q.toFixed(2))}·log₂${ru(q.toFixed(2))}) ≈ <b>${ru(h.toFixed(3))} бита</b>`);
      out(el, 'note', Math.abs(p - 0.5) < 0.005 ? 'Максимум — ровно 1 бит. Равновероятные исходы дают самую большую неопределённость.' : 'Чем предсказуемее монета, тем меньше информации в одном броске. Максимум — при p = 0,5.');
    };
    r.addEventListener('input', () => { s.p = Number(r.value); draw(); });
    draw();
  },
};

// ---------- 3. Фиксированный против переменного ----------
W.fixvar = {
  shell: () => `${head('Фиксированный против переменного')}
    <div class="wg-msg" data-o="msg" aria-live="polite"></div>
    <div class="wg-keys">${['A', 'B', 'C'].map(c => `<button type="button" class="wg-k" data-w="${c}">${c}</button>`).join('')}<button type="button" class="wg-k" data-w="del" aria-label="Стереть букву">⌫</button><button type="button" class="wg-k" data-w="clr">Сброс</button></div>
    <div class="wg-tbl" data-o="tbl"></div>
    <p class="wg-note" data-o="note"></p>`,
  mount(el) {
    const s = st('fixvar', { msg: 'ABACAB' });
    const FIX = { A: '00', B: '01', C: '10' }, VAR = { A: '0', B: '10', C: '11' };
    const draw = () => {
      const m = s.msg;
      out(el, 'msg', m ? esc(m) : '<span class="dim">пусто</span>');
      const f = [...m].map(c => FIX[c]), v = [...m].map(c => VAR[c]);
      const fl = f.join('').length, vl = v.join('').length;
      out(el, 'tbl', `<div class="wg-line"><span class="lbl">Фиксированный<small>A=00 B=01 C=10</small></span><code>${f.join(' ') || '—'}</code><b>${fl} ${bitW(fl)}</b></div>
        <div class="wg-line"><span class="lbl">Переменный<small>A=0 B=10 C=11</small></span><code>${v.join(' ') || '—'}</code><b>${vl} ${bitW(vl)}</b></div>`);
      let n;
      if (!m) n = 'Набери сообщение кнопками A, B, C.';
      else if (vl < fl) n = `Переменный короче на ${fl - vl} ${bitW(fl - vl)}: частая буква A кодируется одним битом.`;
      else if (vl === fl) n = 'Поровну. Переменный выигрывает, когда A встречается чаще остальных букв.';
      else n = 'Здесь переменный проиграл: у B и C коды длиннее, а их в сообщении много.';
      out(el, 'note', n + (m ? ' Коды переменной длины удовлетворяют условию Фано: ни один не начало другого.' : ''));
    };
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-w]'); if (!b) return;
      const k = b.dataset.w; snd('key');
      if (k === 'del') s.msg = s.msg.slice(0, -1);
      else if (k === 'clr') s.msg = '';
      else if (s.msg.length < 12) s.msg += k;
      draw();
    });
    draw();
  },
};

// ---------- 4. UTF-8: сколько весит текст ----------
W.utf8 = {
  shell: () => `${head('Сколько весит текст в UTF-8')}
    <label class="wg-lab" for="wg-u8">Напиши что-нибудь</label>
    <input type="text" id="wg-u8" class="wg-in" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="wg-chars" data-o="chars"></div>
    <p class="wg-res" data-o="res"></p>`,
  mount(el) {
    const s = st('utf8', { t: 'Кварц-8 OK' });
    const inp = $(el, 'input'); inp.value = s.t;
    const enc = new TextEncoder();
    const draw = () => {
      const chars = [...s.t];
      let total = 0; const cnt = { 1: 0, 2: 0, 3: 0, 4: 0 };
      out(el, 'chars', chars.map(ch => {
        const by = enc.encode(ch); total += by.length; cnt[by.length] = (cnt[by.length] || 0) + 1;
        return `<span class="wg-ch b${by.length}"><b>${ch === ' ' ? '␣' : esc(ch)}</b><code>${[...by].map(x => x.toString(16).toUpperCase().padStart(2, '0')).join(' ')}</code><small>${by.length} Б</small></span>`;
      }).join('') || '<span class="dim">пусто</span>');
      const parts = [];
      if (cnt[1]) parts.push(`${cnt[1]} × 1 байт`);
      if (cnt[2]) parts.push(`${cnt[2]} × 2 байта`);
      if (cnt[3]) parts.push(`${cnt[3]} × 3 байта`);
      if (cnt[4]) parts.push(`${cnt[4]} × 4 байта`);
      out(el, 'res', chars.length ? `Символов: ${chars.length}. Байтов: <b>${total}</b> = ${total * 8} ${bitW(total * 8)}. ${parts.join(' + ')}. Латиница, цифры и пробел — 1 байт, кириллица — 2, смайлики — 4.` : '');
    };
    inp.addEventListener('input', () => { s.t = inp.value; draw(); });
    draw();
  },
};

// ---------- 5. Бит чётности ----------
W.parity = {
  shell: () => `${head('Бит чётности против помех')}
    <div class="wg-row2"><span class="lbl">Данные</span><span class="bword" data-o="data"></span></div>
    <p class="wg-note" data-o="pinfo"></p>
    <div class="wg-row2"><span class="lbl">Отправлено</span><span data-o="sent"></span></div>
    <div class="wg-row2"><span class="lbl">Принято<small>нажми — помеха</small></span><span class="bword" data-o="recv"></span></div>
    <p class="wg-res" data-o="res"></p>
    <div class="wg-btns"><button type="button" class="wg-b" data-w="clean">Убрать помехи</button></div>`,
  mount(el) {
    const s = st('parity', { d: '110101', nz: [] });
    const draw = () => {
      const ones = [...s.d].filter(c => c === '1').length, p = ones % 2, code = s.d + p;
      const recv = [...code].map((c, i) => (s.nz.includes(i) ? (c === '1' ? '0' : '1') : c)).join('');
      const onesR = [...recv].filter(c => c === '1').length;
      out(el, 'data', [...s.d].map((c, i) => cell(c, `data-w="d" data-i="${i}" aria-label="Бит данных ${i + 1}"`)).join(''));
      out(el, 'pinfo', `Единиц в данных: ${ones} → бит чётности p = ${ones} mod 2 = <b>${p}</b>`);
      out(el, 'sent', word(code, i => (i === 6 ? 'par' : '')));
      out(el, 'recv', [...recv].map((c, i) => cell(c, `data-w="n" data-i="${i}" aria-label="Принятый бит ${i + 1}"`, (s.nz.includes(i) ? 'nz' : '') + (i === 6 ? ' par' : ''))).join(''));
      let res;
      if (onesR % 2) res = `<span class="bad">Единиц ${onesR} — нечётно. ОШИБКА ОБНАРУЖЕНА.</span> Но где она — неизвестно, исправить нельзя.`;
      else if (!s.nz.length) res = `<span class="ok">Единиц ${onesR} — чётно. Ошибок нет.</span>`;
      else res = `<span class="warn">Помех: ${s.nz.length}, а единиц всё равно чётно (${onesR}). ОШИБКА ПРОПУЩЕНА.</span> Чётность не видит чётное число ошибок.`;
      out(el, 'res', res);
    };
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-w]'); if (!b) return;
      const k = b.dataset.w, i = Number(b.dataset.i);
      if (k === 'd') { s.d = s.d.slice(0, i) + (s.d[i] === '1' ? '0' : '1') + s.d.slice(i + 1); s.nz = []; snd('flip'); }
      else if (k === 'n') { s.nz = s.nz.includes(i) ? s.nz.filter(x => x !== i) : s.nz.concat(i); snd('flip'); }
      else if (k === 'clean') { s.nz = []; snd('key'); }
      draw();
    });
    draw();
  },
};

// ---------- 6. Хэмминг (7,4) ----------
W.hamming = {
  shell: () => `${head('Лаборатория Хэмминга (7,4)')}
    <div class="wg-row2"><span class="lbl">Данные<small>d1 d2 d3 d4</small></span><span class="bword" data-o="data"></span></div>
    <div class="wg-row2"><span class="lbl">Отправлено</span><span data-o="sent"></span></div>
    <div class="wg-row2"><span class="lbl">Принято<small>нажми — помеха</small></span><span data-o="recv"></span></div>
    <div class="wg-calc" data-o="calc"></div>
    <p class="wg-res" data-o="res"></p>
    <div class="wg-btns"><button type="button" class="wg-b" data-w="fix">Исправить</button><button type="button" class="wg-b" data-w="clean">Убрать помехи</button></div>`,
  mount(el) {
    const s = st('hamming', { d: '1011', nz: [] });
    const LB = ['p1', 'p2', 'd1', 'p4', 'd2', 'd3', 'd4'];
    const labeled = (bits, mk, cls) => `<span class="bword lab">${[...bits].map((c, i) => `<span class="bcol">${mk(c, i)}<small>${i + 1}<br>${LB[i]}</small></span>`).join('')}</span>`;
    let pos = 0;
    const draw = () => {
      const d = [...s.d].map(Number);
      const p1 = d[0] ^ d[1] ^ d[3], p2 = d[0] ^ d[2] ^ d[3], p4 = d[1] ^ d[2] ^ d[3];
      const code = [p1, p2, d[0], p4, d[1], d[2], d[3]].join('');
      const r = [...code].map((c, i) => (s.nz.includes(i + 1) ? (c === '1' ? '0' : '1') : c));
      const b = r.map(Number);
      const s1 = b[0] ^ b[2] ^ b[4] ^ b[6], s2 = b[1] ^ b[2] ^ b[5] ^ b[6], s4 = b[3] ^ b[4] ^ b[5] ^ b[6];
      pos = s1 + 2 * s2 + 4 * s4;
      out(el, 'data', [...s.d].map((c, i) => cell(c, `data-w="d" data-i="${i}" aria-label="Бит данных d${i + 1}"`)).join(''));
      out(el, 'sent', labeled(code, (c, i) => lit(c, LB[i][0] === 'p' ? 'par' : '')));
      out(el, 'recv', labeled(r.join(''), (c, i) => cell(c, `data-w="n" data-i="${i + 1}" aria-label="Принятый бит ${i + 1}"`, (s.nz.includes(i + 1) ? 'nz' : '') + (pos === i + 1 ? ' pt' : ''))));
      out(el, 'calc', `<div>s1 = b1⊕b3⊕b5⊕b7 = ${b[0]}⊕${b[2]}⊕${b[4]}⊕${b[6]} = <b>${s1}</b></div>
        <div>s2 = b2⊕b3⊕b6⊕b7 = ${b[1]}⊕${b[2]}⊕${b[5]}⊕${b[6]} = <b>${s2}</b></div>
        <div>s4 = b4⊕b5⊕b6⊕b7 = ${b[3]}⊕${b[4]}⊕${b[5]}⊕${b[6]} = <b>${s4}</b></div>
        <div>синдром = ${s1} + 2·${s2} + 4·${s4} = <b>${pos}</b></div>`);
      const n = s.nz.length;
      let res;
      if (!pos && !n) res = '<span class="ok">Синдром 0 — ошибок нет.</span> Нажми на любой принятый бит, чтобы устроить помеху.';
      else if (!pos) res = '<span class="warn">Синдром 0, хотя помехи были.</span> Код (7,4) надёжно исправляет только одну ошибку.';
      else if (n === 1) res = `<span class="bad">Ошибка в бите ${pos}.</span> Синдром сам назвал номер. Жми «Исправить».`;
      else res = `<span class="warn">Синдром указывает на бит ${pos}, но помех ${n}.</span> С двумя и больше ошибками код (7,4) ошибается.`;
      out(el, 'res', res);
      const fb = $(el, '[data-w="fix"]'); if (fb) fb.disabled = !pos;
    };
    el.addEventListener('click', e => {
      const t = e.target.closest('[data-w]'); if (!t || t.disabled) return;
      const k = t.dataset.w, i = Number(t.dataset.i);
      if (k === 'd') { s.d = s.d.slice(0, i) + (s.d[i] === '1' ? '0' : '1') + s.d.slice(i + 1); s.nz = []; snd('flip'); }
      else if (k === 'n') { s.nz = s.nz.includes(i) ? s.nz.filter(x => x !== i) : s.nz.concat(i); snd('flip'); }
      else if (k === 'fix' && pos) { s.nz = s.nz.includes(pos) ? s.nz.filter(x => x !== pos) : s.nz.concat(pos); snd(s.nz.length ? 'key' : 'ok'); }
      else if (k === 'clean') { s.nz = []; snd('key'); }
      draw();
    });
    draw();
  },
};

// ---------- 7. Тумблеры: веса разрядов ----------
W.switches = {
  shell: () => `${head('Восемь тумблеров')}
    <div class="wg-sw" data-o="sw"></div>
    <p class="wg-res" data-o="res"></p>`,
  mount(el) {
    const s = st('switches', { v: 45 });
    const draw = () => {
      const bits = pad(s.v.toString(2), 8);
      out(el, 'sw', [...bits].map((c, i) => `<span class="bcol"><small class="wt">${2 ** (7 - i)}</small>${cell(c, `data-w="t" data-i="${i}" aria-label="Разряд ${7 - i}, вес ${2 ** (7 - i)}"`)}<small>2${sup(7 - i)}</small></span>`).join(''));
      const terms = [...bits].map((c, i) => (c === '1' ? 2 ** (7 - i) : 0)).filter(Boolean);
      out(el, 'res', `${bits}₂ = ${terms.length ? terms.join(' + ') : '0'} = <b>${s.v}₁₀</b>`);
    };
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-w="t"]'); if (!b) return;
      s.v ^= 1 << (7 - Number(b.dataset.i)); snd('flip'); draw();
    });
    draw();
  },
};

// ---------- 8. Лесенка деления ----------
W.ladder = {
  shell: () => `${head('Делим и собираем остатки')}
    <div class="wg-ctl wrap"><label for="wg-ln">Число</label><input type="text" id="wg-ln" class="wg-in short" inputmode="numeric" maxlength="5" autocomplete="off"><span class="wg-seg" role="group" aria-label="Основание">${[2, 3, 8, 16].map(q => `<button type="button" class="wg-k" data-w="q" data-q="${q}">${q}</button>`).join('')}</span></div>
    <div class="wg-steps" data-o="steps"></div>
    <p class="wg-res" data-o="res"></p>
    <div class="wg-btns"><button type="button" class="wg-b" data-w="read">Прочитать снизу вверх</button></div>`,
  mount(el) {
    const s = st('ladder', { n: '45', q: 2 });
    const inp = $(el, 'input'); inp.value = s.n;
    let timer = null, rows = [];
    const draw = (upTo = -1) => {
      el.querySelectorAll('[data-w="q"]').forEach(b => b.classList.toggle('sel', Number(b.dataset.q) === s.q));
      const n = parseInt(s.n, 10);
      if (!/^\d+$/.test(s.n) || !(n >= 0)) { out(el, 'steps', ''); out(el, 'res', 'Введи целое число от 0 до 99999.'); return; }
      rows = []; let x = n;
      while (x > 0) { rows.push({ x, quo: Math.floor(x / s.q), r: x % s.q }); x = Math.floor(x / s.q); }
      const L = rows.length;
      out(el, 'steps', rows.map((w, i) => `<div class="wg-st${upTo >= 0 && i >= L - 1 - upTo ? ' rd' : ''}"><span>${w.x} : ${s.q} = ${w.quo}</span><span>остаток <b>${DIG[w.r]}</b></span></div>`).join('') || '<div class="wg-st"><span>0 — делить нечего</span></div>');
      const all = rows.map(w => DIG[w.r]).reverse().join('') || '0';
      const shown = upTo < 0 ? all : all.slice(0, upTo + 1);
      out(el, 'res', `${n}₁₀ = <b>${shown}${upTo >= 0 && upTo < L - 1 ? '…' : ''}</b>${sub(s.q)}${upTo < 0 ? ' — остатки снизу вверх' : ''}`);
    };
    inp.addEventListener('input', () => { clearTimeout(timer); s.n = inp.value.replace(/\D/g, '').slice(0, 5); if (inp.value !== s.n) inp.value = s.n; draw(); });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-w]'); if (!b) return;
      clearTimeout(timer);
      if (b.dataset.w === 'q') { s.q = Number(b.dataset.q); snd('key'); draw(); return; }
      if (b.dataset.w === 'read') {
        snd('key'); draw(); if (!rows.length) return;
        let k = 0;
        const step = () => { if (!alive(el)) return; draw(k); snd('beep'); k++; if (k < rows.length) timer = setTimeout(step, 520); else timer = setTimeout(() => { if (alive(el)) { draw(); snd('ok'); } }, 900); };
        timer = setTimeout(step, 200);
      }
    });
    draw();
  },
};

// ---------- 9. Триады и тетрады ----------
W.groups = {

    <div class="wg-grp" data-o="g4"></div>

  mount(el) {

      const gs = []; for (let i = 0; i < 12; i += k) gs.push(s.b.slice(i, i + k));
      return `<span class="lbl">${k === 3 ? 'По 3 → 8-я' : 'По 4 → 16-я'}</span>${gs.map((g, j) => `<span class="gbox${j % 2 ? ' alt' : ''}"><code>${g}</code><b>${DIG[parseInt(g, 2)]}</b></span>`).join('')}`;
    };
    const draw = () => {
      out(el, 'bits', [...s.b].map((c, i) => cell(c, `data-w="t" data-i="${i}" aria-label="Бит ${i + 1}"`)).join(''));
      out(el, 'g3', grp(3, 8)); out(el, 'g4', grp(4, 16));

    });

  },
};

// ---------- 10. Сложение столбиком по шагам ----------
W.adder = {
  shell: () => `${head('Сложение столбиком по шагам')}
    <div class="wg-ctl wrap"><span class="lbl">Основание</span><span class="wg-seg" role="group" aria-label="Основание">${[2, 5, 8, 16].map(q => `<button type="button" class="wg-k" data-w="q" data-q="${q}">${q}</button>`).join('')}</span></div>
    <div class="wg-colwrap"><table class="wg-col" data-o="grid"></table></div>
    <p class="wg-res" data-o="res"></p>
    <div class="wg-btns"><button type="button" class="wg-b go" data-w="step">Шаг</button><button type="button" class="wg-b" data-w="new">Новые числа</button></div>`,
  mount(el) {
    const s = st('adder', { q: 2, a: '101101', b: '011011', k: 0 });
    const cols = () => {
      const A = [...s.a].reverse().map(c => DIG.indexOf(c)), B = [...s.b].reverse().map(c => DIG.indexOf(c));
      const n = Math.max(A.length, B.length); let cin = 0; const cs = [];
      for (let i = 0; i < n; i++) { const sm = (A[i] || 0) + (B[i] || 0) + cin; cs.push({ da: A[i] || 0, db: B[i] || 0, cin, s: sm, d: sm % s.q, cout: sm >= s.q ? 1 : 0 }); cin = sm >= s.q ? 1 : 0; }
      return { cs, fin: cin };
    };
    const fresh = () => {
      const len = s.q === 2 ? 6 : 3;
      for (let t = 0; t < 60; t++) {
        const rnd = () => DIG[1 + Math.floor(Math.random() * (s.q - 1))] + Array.from({ length: len - 1 }, () => DIG[Math.floor(Math.random() * s.q)]).join('');
        s.a = rnd(); s.b = rnd(); s.k = 0;
        if (cols().cs.filter(c => c.cout).length >= 2) return;
      }
    };
    const draw = () => {
      el.querySelectorAll('[data-w="q"]').forEach(b => b.classList.toggle('sel', Number(b.dataset.q) === s.q));
      const { cs, fin } = cols(), n = cs.length, NC = n + 1, done = s.k > n || (s.k === n && !fin);
      const at = i => NC - 1 - i; // столбец таблицы для разряда i
      const row = (cells, cls = '') => `<tr class="${cls}">${cells.map(c => `<td>${c}</td>`).join('')}</tr>`;
      const carry = Array(NC).fill(''), A = Array(NC).fill(''), B = Array(NC).fill(''), Rr = Array(NC).fill('');
      [...s.a].reverse().forEach((c, i) => { A[at(i)] = c; });
      [...s.b].reverse().forEach((c, i) => { B[at(i)] = c; });
      for (let i = 0; i < Math.min(s.k, n); i++) { Rr[at(i)] = DIG[cs[i].d]; if (cs[i].cout) carry[at(i + 1)] = '<span class="cr">1</span>'; }
      if (s.k > n && fin) Rr[0] = '1';
      const cur = s.k > 0 && s.k <= n ? at(s.k - 1) : -1;
      const mark = arr => arr.map((c, j) => (j === cur ? `<span class="cur">${c}</span>` : c));
      out(el, 'grid', row([''].concat(carry), 'carry') + row([''].concat(mark(A))) + row(['+'].concat(mark(B))) + `<tr class="ln"><td></td>${'<td></td>'.repeat(NC)}</tr>` + row([''].concat(mark(Rr)), 'sum'));
      let msg;
      if (s.k === 0) msg = `Жми «Шаг»: идём справа налево. В разряде пишем s mod ${s.q}, переносим s div ${s.q}.`;
      else if (s.k <= n) {
        const c = cs[s.k - 1], ex = `${DIG[c.da]} + ${DIG[c.db]}${c.cin ? ' + 1' : ''} = ${c.s}`;
        msg = `Разряд ${s.k - 1}: ${ex}` + (c.cout ? ` = ${s.q} + ${c.s - s.q} → пишем <b>${DIG[c.d]}</b>, перенос 1` : ` → пишем <b>${DIG[c.d]}</b>`);
        if (s.k === n && !fin) msg += '. Готово!';
        if (s.k === n && fin) msg += '. Остался перенос — жми «Шаг».';
      } else msg = 'Последний перенос становится новой цифрой слева. Готово!';
      if (done) {
        const va = parseInt(s.a, s.q), vb = parseInt(s.b, s.q);
        msg += ` Проверка в десятичной: ${va} + ${vb} = ${va + vb} = ${(va + vb).toString(s.q).toUpperCase()}${sub(s.q)}.`;
      }
      out(el, 'res', msg);
      const sb = $(el, '[data-w="step"]'); if (sb) sb.disabled = done;
    };
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-w]'); if (!b || b.disabled) return;
      const k = b.dataset.w;
      if (k === 'q') { s.q = Number(b.dataset.q); fresh(); snd('key'); }
      else if (k === 'new') { fresh(); snd('key'); }
      else if (k === 'step') { s.k++; const { cs } = cols(); const c = cs[s.k - 1]; snd(c && c.cout ? 'beep' : 'flip'); }
      draw();
    });
    draw();
  },
};

// ---------- 11. Три кода одного числа ----------
W.codes = {
  shell: () => `${head('Одно число — три кода')}
    <div class="wg-ctl"><button type="button" class="wg-k" data-w="dec" aria-label="Уменьшить">−</button><output class="wg-val big" data-o="x"></output><button type="button" class="wg-k" data-w="inc" aria-label="Увеличить">+</button></div>
    <input type="range" id="wg-cx" min="-128" max="127" step="1" aria-label="Число от −128 до 127">
    <div class="wg-tbl" data-o="rows"></div>
    <p class="wg-res" data-o="res"></p>`,
  mount(el) {
    const s = st('codes', { x: -13 });
    const r = $(el, 'input');
    const inv = b => [...b].map(c => (c === '1' ? '0' : '1')).join('');
    const line = (name, bits, note = '') => `<div class="wg-line"><span class="lbl">${name}${note ? `<small>${note}</small>` : ''}</span>${bits ? word(bits, i => (i === 0 ? 'sg' : '')) : '<span class="bad">не помещается в 8 бит</span>'}</div>`;
    const draw = () => {
      r.value = s.x; out(el, 'x', ru(s.x));
      const x = s.x, m = Math.abs(x);
      if (x >= 0) {
        const b = pad(x.toString(2), 8);
        out(el, 'rows', line('Прямой', b) + line('Обратный', b) + line('Дополнительный', b));
        out(el, 'res', 'Число положительное: знаковый бит 0, и все три кода совпадают.');
        return;
      }
      const mag = m <= 127 ? pad(m.toString(2), 8) : null;
      const direct = m <= 127 ? '1' + pad(m.toString(2), 7) : null;
      const ones = m <= 127 ? inv(mag) : null;
      const tw = pad((256 - m).toString(2), 8);
      out(el, 'rows', (mag ? `<div class="wg-line"><span class="lbl">|x| = ${m}</span>${word(mag)}</div>` : '') + line('Прямой', direct, 'знак + модуль') + line('Обратный', ones, 'инвертировали |x|') + line('Дополнительный', tw, 'обратный + 1'));
      out(el, 'res', `Проверка: 256 − ${m} = ${256 - m} = ${tw}₂.` + (m === 128 ? ' −128 есть только в дополнительном коде.' : ''));
    };
    r.addEventListener('input', () => { s.x = Number(r.value); draw(); });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-w]'); if (!b) return;
      s.x = Math.max(-128, Math.min(127, s.x + (b.dataset.w === 'inc' ? 1 : -1))); snd('key'); draw();
    });
    draw();
  },
};

// ---------- 13. Переполнение в 8 битах ----------
W.overflow = {
  shell: () => `${head('Восьмибитный сумматор')}
    <div class="wg-two">
      <div><div class="wg-ctl"><span class="lbl">A</span><button type="button" class="wg-k" data-w="a-" aria-label="A минус 1">−</button><output class="wg-val" data-o="a"></output><button type="button" class="wg-k" data-w="a+" aria-label="A плюс 1">+</button></div><input type="range" id="wg-oa" data-r="a" min="-128" max="127" aria-label="Слагаемое A"></div>
      <div><div class="wg-ctl"><span class="lbl">B</span><button type="button" class="wg-k" data-w="b-" aria-label="B минус 1">−</button><output class="wg-val" data-o="b"></output><button type="button" class="wg-k" data-w="b+" aria-label="B плюс 1">+</button></div><input type="range" id="wg-ob" data-r="b" min="-128" max="127" aria-label="Слагаемое B"></div>
    </div>
    <div class="wg-keys">${[[23, -9], [100, 50], [-100, -50], [127, 1], [60, -70]].map(([a, b]) => `<button type="button" class="wg-k" data-w="pre" data-pa="${a}" data-pb="${b}">${ru(a)} + ${b < 0 ? '(' + ru(b) + ')' : b}</button>`).join('')}</div>
    <div class="wg-tbl" data-o="rows"></div>
    <p class="wg-res" data-o="res"></p>`,
  mount(el) {
    const s = st('overflow', { a: 100, b: 50 });
    const tw = v => pad((v & 255).toString(2), 8);
    const draw = () => {
      el.querySelector('[data-r="a"]').value = s.a; el.querySelector('[data-r="b"]').value = s.b;
      out(el, 'a', ru(s.a)); out(el, 'b', ru(s.b));
      const raw = (s.a & 255) + (s.b & 255), carry = raw >= 256, r8 = raw & 255, val = r8 >= 128 ? r8 - 256 : r8, tru = s.a + s.b;
      const of = tru > 127 || tru < -128;
      out(el, 'rows', `<div class="wg-line"><span class="lbl">A = ${ru(s.a)}</span>${word(tw(s.a), i => (i === 0 ? 'sg' : ''))}</div>

    el.addEventListener('click', e => {

};

// ---------- 14. Накопление ошибки 0,1 ----------
W.float = {
  shell: () => `${head('Копим 0,1')}
    <div class="wg-tbl" data-o="rows"></div>
    <div class="wg-btns"><button type="button" class="wg-b go" data-w="one">+0,1</button><button type="button" class="wg-b" data-w="ten">+0,1 десять раз</button><button type="button" class="wg-b" data-w="zero">Сброс</button></div>

  mount(el) {
    const s = st('float', { n: 0, v: 0 });
    const py = x => (Number.isInteger(x) ? x.toFixed(1) : String(x));
    const expo = d => { const [mn, ex] = d.toExponential(1).split('e'); return `${ru(mn)}·10${sup(ex.replace('+', ''))}`; };
    const draw = () => {
      const exact = s.n / 10, d = s.v - exact, eq = s.v === exact;

      else { s.v = 0; s.n = 0; snd('key'); }

    draw();
  },
};

const AT = {
  w1: { 1: 'halving', 4: 'coin' },

}

})();

<script>
/* «Бит за битом» — пульт ЭВМ «Кварц-8» */
(() => {
'use strict';
const E = BZB, ST = STORY;

const $sheet = document.getElementById('sheet');
const esc = E.esc;
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const TEST = !!window.__BZB_TEST__;

// ---------- прогресс и сохранение ----------
const LS_KEY = 'bzb.progress.v1';
const DEF = () => ({
  v: 2, updatedAt: 0, xp: 0, days: [], levels: {}, theory: {}, status: {}, mistakes: {}, last: null, answered: 0, correct: 0, flags: {},
  story: { intro: false, seen: {}, order: [] }, opts: { sound: true, mat: true }, best: 0,

function norm(o) {
  const d = DEF();
  o = Object.assign(d, o && typeof o === 'object' ? o : {});
  for (const k of ['levels', 'theory', 'status', 'mistakes', 'flags']) if (!o[k] || typeof o[k] !== 'object') o[k] = {};
  if (!Array.isArray(o.days)) o.days = [];

  if (!o.story.seen || typeof o.story.seen !== 'object') o.story.seen = {};
  if (!Array.isArray(o.story.order)) o.story.order = [];
