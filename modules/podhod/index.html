<style>
/* Шрифт Onest лежит рядом с приложением: работает и без интернета (в зале связи может не быть) */
@font-face{font-family:"Onest";font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/onest-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/onest-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: одна колонка под телефон — стеклянные карточки на тёмно-синем фоне со стальным свечением, предметы на подиумах, плавающая панель вкладок */
:root{
  --bg:#E7ECF2;
  --glow-1:rgba(120,170,210,.55); --glow-2:rgba(255,255,255,.85); --glow-3:rgba(160,190,220,.55);
  --card-bg:linear-gradient(160deg,rgba(255,255,255,.88),rgba(255,255,255,.62));
  --card-border:rgba(255,255,255,.95); --card-shadow:0 18px 40px -26px rgba(25,45,75,.45);
  --sheet-bg:rgba(246,248,251,.94); --bar-bg:rgba(255,255,255,.74);
  --field:rgba(16,30,50,.05); --field-2:rgba(16,30,50,.09);
  --ink:#0E1520; --muted:#566376; --faint:#97A3B3; --line:rgba(16,30,50,.09); --line-strong:rgba(16,30,50,.16);
  --accent:#8FBBDD; --accent-ink:#0A0E15; --accent-strong:#2B5F88; --accent-soft:rgba(70,130,180,.14); --accent-line:rgba(43,95,136,.45); --accent-glow:rgba(70,130,180,.35);
  --white-btn:#0E1520; --white-btn-ink:#FFFFFF;
  --chart:#3C78A8; --chart-2:#7FAED3;
  --good:#127A47; --good-bg:rgba(18,122,71,.1); --warn:#8F5600; --warn-bg:rgba(200,130,20,.15); --bad:#B3321F; --bad-bg:rgba(179,50,31,.1); --info-bg:rgba(70,130,180,.11);
  --bad-fill:#C2351F; --on-bad:#FFFFFF; --gold:#E0A526;
  --scrim:rgba(14,21,32,.32);
  --obj-hi:#FFFFFF; --obj-mid:#C3CDD8; --obj-lo:#7D8A9B; --obj-rim:#5E97C6; --obj-shadow:rgba(25,45,75,.28);
  --ped-a:#F7F9FB; --ped-b:#D3DBE4; --ped-c:#B7C2CF; --ped-d:#E3E9EF; --screen:#1C2733;
  --gold-hi:#FFE7A8; --gold-mid:#E3AE3F; --gold-lo:#9A6A10;
  --figure:#1E3C5F; --figure-o:.075;
  --c-coral:#FF8466; --c-sky:#5BAFFF; --c-grape:#AC8BFF; --c-sun:#FFCD3C; --c-pink:#FF80C0; --c-mint:#43DA8C; --c-aqua:#35D3C4;
  --font-body:"Onest",system-ui,-apple-system,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --spring:cubic-bezier(.3,1.4,.45,1); --ease-out:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0E15;
    --glow-1:rgba(143,187,221,.34); --glow-2:rgba(143,187,221,.16); --glow-3:rgba(70,100,140,.3);
    --card-bg:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.022));
    --card-border:rgba(255,255,255,.085); --card-shadow:0 22px 44px -26px rgba(0,0,0,.8);
    --sheet-bg:rgba(17,22,31,.94); --bar-bg:rgba(24,30,41,.72);
    --field:rgba(255,255,255,.06); --field-2:rgba(255,255,255,.11);
    --ink:#F1F4F9; --muted:#8F9BAE; --faint:#566174; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
    --accent-strong:#A9CDEA; --accent-soft:rgba(143,187,221,.16); --accent-line:rgba(143,187,221,.55); --accent-glow:rgba(143,187,221,.35);
    --white-btn:#F4F7FB; --white-btn-ink:#0A0E15;
    --chart:#8FBBDD; --chart-2:#C6DFF2;
    --good:#5FD39A; --good-bg:rgba(95,211,154,.13); --warn:#F2B866; --warn-bg:rgba(242,184,102,.13); --bad:#FF8A7A; --bad-bg:rgba(255,138,122,.13); --info-bg:rgba(143,187,221,.11);
    --bad-fill:#FF8A7A; --on-bad:#0A0E15; --gold:#F5C66B;
    --scrim:rgba(3,6,10,.6);
    --obj-hi:#7C8899; --obj-mid:#323A47; --obj-lo:#10141B; --obj-rim:#A9D0EE; --obj-shadow:rgba(0,0,0,.55);
    --ped-a:#3E4858; --ped-b:#1B2129; --ped-c:#0C1015; --ped-d:#283039; --screen:#0C1015;
    --gold-hi:#FFE6A3; --gold-mid:#C9932A; --gold-lo:#5A3D08;
    --figure:#A9CBE8; --figure-o:.06;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0E15;
  --glow-1:rgba(143,187,221,.34); --glow-2:rgba(143,187,221,.16); --glow-3:rgba(70,100,140,.3);
  --card-bg:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.022));
  --card-border:rgba(255,255,255,.085); --card-shadow:0 22px 44px -26px rgba(0,0,0,.8);
  --sheet-bg:rgba(17,22,31,.94); --bar-bg:rgba(24,30,41,.72);
  --field:rgba(255,255,255,.06); --field-2:rgba(255,255,255,.11);
  --ink:#F1F4F9; --muted:#8F9BAE; --faint:#566174; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --accent-strong:#A9CDEA; --accent-soft:rgba(143,187,221,.16); --accent-line:rgba(143,187,221,.55); --accent-glow:rgba(143,187,221,.35);
  --white-btn:#F4F7FB; --white-btn-ink:#0A0E15;
  --chart:#8FBBDD; --chart-2:#C6DFF2;
  --good:#5FD39A; --good-bg:rgba(95,211,154,.13); --warn:#F2B866; --warn-bg:rgba(242,184,102,.13); --bad:#FF8A7A; --bad-bg:rgba(255,138,122,.13); --info-bg:rgba(143,187,221,.11);
  --bad-fill:#FF8A7A; --on-bad:#0A0E15; --gold:#F5C66B;
  --scrim:rgba(3,6,10,.6);
  --obj-hi:#7C8899; --obj-mid:#323A47; --obj-lo:#10141B; --obj-rim:#A9D0EE; --obj-shadow:rgba(0,0,0,.55);
  --ped-a:#3E4858; --ped-b:#1B2129; --ped-c:#0C1015; --ped-d:#283039; --screen:#0C1015;
  --gold-hi:#FFE6A3; --gold-mid:#C9932A; --gold-lo:#5A3D08;
  --figure:#A9CBE8; --figure-o:.06;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:radial-gradient(42% 40% at 98% 52%,var(--glow-1),transparent 72%),radial-gradient(50% 30% at 75% 2%,var(--glow-2),transparent 70%),radial-gradient(60% 38% at 2% 98%,var(--glow-3),transparent 72%);
  animation:drift 30s ease-in-out infinite alternate}
body.noscroll{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:3px}
h1,h2,h3,p{margin:0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* Силуэт атлета на фоне: обезличенная фигура, переезжает между вкладками */
.bgfig{position:fixed;z-index:-1;pointer-events:none;width:min(78vw,380px);aspect-ratio:200/270;color:var(--figure);opacity:var(--figure-o);view-transition-name:athlete}
.bgfig svg{width:100%;height:100%;display:block}
.bgfig.pos-today{right:-16%;top:16%}
.bgfig.pos-plan{left:-22%;top:30%;transform:scaleX(-1)}
.bgfig.pos-progress{right:-34%;top:64%;width:min(80vw,380px)}
.bgfig.pos-food{right:-34%;top:52%;width:min(70vw,330px)}
.bgfig.pos-session{right:-42%;top:58%;width:min(70vw,330px)}
.bgfig.pos-profile{left:18%;top:20%;width:min(64vw,310px)}
.bgfig.pos-onb{right:-20%;top:6%;width:min(70vw,340px)}

.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 116px;display:flex;flex-direction:column;gap:16px;view-transition-name:main}
.stack{display:grid;gap:14px}
.grp{display:grid;gap:10px}

/* Шапка */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:6px}
.top-t{min-width:0}
.top h1{font:800 26px/1.12 var(--font-body);letter-spacing:-.02em;text-wrap:balance}
.top-s{margin-top:3px;color:var(--muted);font-weight:600;font-size:14px}
.sync{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);padding:6px 11px 6px 9px;border-radius:999px;background:var(--field);border:1px solid var(--line);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok::before{background:var(--good)}
.sync.busy::before{background:var(--warn);animation:pulse 1s infinite}
.sync.bad{color:var(--bad)}
.sync.bad::before{background:var(--bad)}
.sec-title{font:800 18px/1.2 var(--font-body);letter-spacing:-.015em;text-wrap:balance}
.lead{color:var(--muted);font-weight:600;font-size:14.5px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.center{text-align:center}

/* Стеклянная поверхность */
.card,.tile,.pday,.ex,.ocard,.banner,.opt,.mini,.wday,.seg{background:var(--card-bg);border:1px solid var(--card-border);box-shadow:var(--card-shadow)}

/* Переключатель режима со скользящей подложкой */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:22px}
.seg::before{content:"";position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:17px;background:var(--accent);box-shadow:0 10px 22px -12px var(--accent-glow);transform:translateX(calc(var(--si,0) * 100%));transition:transform .55s var(--spring)}
.seg button{position:relative;z-index:1;border-radius:17px;padding:9px 6px;display:grid;justify-items:center;gap:1px;transition:color .3s}
.seg b{font:800 15px/1.2 var(--font-body)}
.seg small{font-size:11.5px;font-weight:700;color:var(--muted);transition:color .3s}
.seg button[aria-pressed="true"],.seg button[aria-pressed="true"] small{color:var(--accent-ink)}

/* Неделя */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{display:grid;justify-items:center;gap:1px;padding:8px 0 7px;border-radius:18px;font-size:11.5px;font-weight:700;color:var(--muted);box-shadow:none}
.wday .dn{font-size:16px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.wday .dot{width:6px;height:6px;border-radius:50%;margin-top:2px;font-style:normal}
.wday.planned .dot{background:var(--accent-strong)}
.wday.done{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 10px 20px -12px var(--accent-glow)}
.wday.done .dn{color:var(--accent-ink)}
.wday.done .dot{width:auto;height:6px;background:none;font-size:10px;line-height:6px;font-weight:900}
.wday.today{border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line)}
.wday.missed .dot{opacity:.35}

/* Баннер с подсказкой */
.banner{position:relative;overflow:hidden;border-radius:28px;padding:16px 110px 16px 18px;display:grid;gap:4px;min-height:96px;align-content:center}
.banner b{font-size:16px;font-weight:800;line-height:1.25}
.banner p{color:var(--muted);font-size:13.5px;font-weight:600;line-height:1.35}
.banner .obj{position:absolute;right:-8px;bottom:-14px;width:120px;height:120px}
.banner-x{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:14px;font-weight:800;background:var(--field)}

/* Центр экрана: тренировка дня */
.hero{display:grid;justify-items:center;text-align:center;gap:10px;padding:10px 0 2px}
.hero h2{font:800 40px/1.04 var(--font-body);letter-spacing:-.035em;text-wrap:balance}
.hero-s{color:var(--muted);font-weight:600;font-size:15px;max-width:34ch}
.hero .chips{justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid var(--line-strong);font-size:14px;font-weight:600;color:var(--ink)}
.hero-a{display:grid;gap:10px;width:100%;margin-top:6px}

/* Кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:11px 18px;border-radius:20px;background:var(--field);color:var(--ink);font-weight:700;font-size:16px;line-height:1.2;text-align:center;text-decoration:none;border:1px solid var(--line);transition:transform .2s var(--spring),box-shadow .25s,background .25s}
.btn:active{transform:scale(.96)}
.btn svg{width:20px;height:20px;flex:none}
.btn.block{width:100%}
.btn.big{min-height:58px;font-size:17px;border-radius:22px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 14px 30px -16px var(--accent-glow)}
.btn.outline{background:transparent;color:var(--accent-strong);border:1.5px solid var(--accent-line)}
.btn.white{background:var(--white-btn);color:var(--white-btn-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.dashed{background:transparent;border:1.5px dashed var(--line-strong);color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.danger-fill{background:var(--bad-fill);color:var(--on-bad);border-color:transparent}
.btn.sm{min-height:38px;padding:7px 14px;font-size:14px;border-radius:14px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{align-self:center;justify-self:center;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px}
.icon-btn{flex:none;width:36px;height:36px;border-radius:12px;background:var(--field);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--muted);transition:transform .2s var(--spring)}
.icon-btn:active{transform:scale(.9)}

/* Карточки с предметами на подиумах */
.ocards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ocard{position:relative;overflow:hidden;isolation:isolate;border-radius:30px;min-height:168px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.ocard::after{content:"";position:absolute;right:-30px;bottom:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(closest-side,var(--accent-glow),transparent);z-index:-1}
.ocard .ocard-t{font-size:17px;font-weight:800;line-height:1.2}
.ocard .ocard-s{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.ocard .obj{position:absolute;right:-14px;bottom:-12px;width:118px;height:118px;transition:transform .5s var(--spring)}
.ocard:active .obj{transform:translateY(-6px) scale(1.04)}
.arrow-pill{width:64px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--field-2);color:var(--ink)}
.arrow-pill svg{width:20px;height:20px}
.obj{display:block;position:relative;overflow:visible}
.obj>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.obj-item{animation:float 4s ease-in-out infinite;will-change:transform}

/* Лента упражнений дня */
.carousel{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.mini{flex:none;width:132px;scroll-snap-align:start;border-radius:22px;padding:12px;display:grid;gap:8px;text-align:left;box-shadow:none}
.mini .nm{font-size:13.5px;font-weight:700;line-height:1.25;min-height:2.5em}
.mini .tg{font-size:12.5px;font-weight:600;color:var(--muted)}

/* Плитки и показатели */
.card{border-radius:28px;padding:18px;display:grid;gap:14px;min-width:0}
.card>*,.sheet>*,.water-card>*{min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-h>div{min-width:0}
.card-h h3{font:800 18px/1.2 var(--font-body);letter-spacing:-.015em}
.card-h .btn{flex:none;white-space:nowrap}
.sub{color:var(--muted);font-size:13.5px;font-weight:600;margin-top:2px}
.empty{color:var(--muted);font-weight:600;font-size:14px;background:var(--field);border-radius:18px;padding:14px;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:24px;padding:14px 15px;display:grid;gap:3px;align-content:start;min-width:0}
.tile .lbl{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.tile .val{font:800 28px/1.1 var(--font-body);letter-spacing:-.02em}
.tile .val small{font-size:15px;font-weight:700;color:var(--muted);margin-left:4px;letter-spacing:0}
.tile .tile-s{font-size:12.5px;font-weight:600;color:var(--muted)}
.ring-tile{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ring-tile>div{display:grid;gap:3px;min-width:0}
.ring{flex:none;width:52px;height:52px}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring-bg{stroke:var(--field-2)}
.ring-fg{stroke:var(--accent);transform:rotate(-90deg);transform-origin:50% 50%;stroke-dasharray:var(--c);stroke-dashoffset:var(--off);filter:drop-shadow(0 0 4px var(--accent-glow))}
.flame{display:inline-block;transform-origin:50% 90%;animation:flicker 1.8s ease-in-out infinite}
.kpi{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kpi-v{font:800 36px/1 var(--font-body);letter-spacing:-.03em}
.kpi-v small{font-size:16px;color:var(--muted);font-weight:700;letter-spacing:0}
.delta{font-weight:700;color:var(--muted);font-size:14px}
.kvs{display:grid}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.kvs .kv:first-child{border-top:0}
.kv>span{color:var(--muted);font-weight:600}
.kv b{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.kv em{font-style:normal;color:var(--muted);font-weight:700;font-size:13px;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--info-bg)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:18px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.4;background:var(--info-bg)}
.note.good{background:var(--good-bg)}
.note.warn{background:var(--warn-bg)}
.note.bad{background:var(--bad-bg)}
.note i{font-style:normal;font-size:18px;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lk-line{width:16px;height:3px;border-radius:2px;background:var(--chart)}
.lk-band{width:14px;height:10px;border-radius:3px;background:var(--chart);opacity:.25}
.chart-t{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* Значки групп мышц: стекло с цветным отсветом */
.badge{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:19px;line-height:1;background:var(--field);background:radial-gradient(circle at 50% 120%,color-mix(in srgb,var(--g) 55%,transparent),transparent 70%),var(--field);border:1px solid var(--line)}
.badge.sm{width:34px;height:34px;border-radius:12px;font-size:16px}

/* Плитка-иконка, как в шапках экранов выбора */
.icon-tile{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;justify-self:center;background:var(--card-bg);border:1px solid var(--accent-line);box-shadow:0 0 30px -6px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.12);color:var(--ink)}
.icon-tile>svg{width:42px;height:42px}
.icon-tile .obj{width:104px;height:104px;margin-top:-14px}
.icon-tile.obj-tile{border:0;background:none;box-shadow:none;width:120px;height:110px}
.icon-tile.emo{font-size:42px;line-height:1}
.icon-tile.badge-tile{font-size:38px;background:radial-gradient(circle at 50% 120%,color-mix(in srgb,var(--g) 50%,transparent),transparent 70%),var(--card-bg)}

/* Чипы-фильтры */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:3px 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.fchip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;background:transparent;border:1px solid var(--line-strong);font-weight:700;font-size:14px;white-space:nowrap;transition:background .25s,color .25s,border-color .25s,transform .2s var(--spring)}
.chips.rate .fchip{padding:0 4px}
.fchip:active{transform:scale(.94)}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-ink)}

/* Питание */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;color:var(--muted)}
.daynav .icon-btn{width:40px;height:40px;font-size:20px;color:var(--ink)}
.kcal-hero{display:grid;justify-items:center;gap:12px;text-align:center}
.kring{position:relative;width:min(62vw,230px);aspect-ratio:1}
.kring-svg{width:100%;height:100%;display:block;overflow:visible}
.kring-svg circle{fill:none;stroke-linecap:round}
.kring-svg.big circle{stroke-width:14}
.kring-svg.small{flex:none;width:52px;height:52px}
.kring-svg.small circle{stroke-width:6}
.kring-svg .ring-fg{stroke:var(--accent);filter:drop-shadow(0 0 8px var(--accent-glow))}
.ring-fg.grow{animation:ringfrom .9s var(--ease-out) both}
.kring-c{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2px}
.kv1{font:800 40px/1 var(--font-body);letter-spacing:-.03em}
.kv2{font-size:13.5px;font-weight:700;color:var(--muted)}
.mbars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.mbar{display:grid;gap:6px;text-align:left}
.mbar-h{display:grid;gap:1px}
.mbar-h span{font-size:12px;font-weight:700;color:var(--muted)}
.mbar-h b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.mbar-h small{font-size:12px;color:var(--muted);font-weight:700}
.track{height:7px;border-radius:99px;background:var(--field-2);overflow:hidden}
.track i{display:block;height:100%;width:var(--w);border-radius:99px;background:var(--accent)}
.mbar.fa .track i{background:var(--gold)}
.mbar.c .track i{background:var(--chart-2)}
.track i.grow{animation:barfrom .9s var(--ease-out) both}
.water-card{display:flex;align-items:center;gap:16px}
.bottle{flex:none;width:76px;height:124px;overflow:visible}
.b-bg{fill:var(--field)}
.b-water{transform:translateY(var(--y));transition:transform .8s var(--ease-out)}
.b-water.grow{animation:waterfrom .9s var(--ease-out) both}
.b-wave{fill:var(--accent);opacity:.85;animation:wave 2.6s linear infinite}
.b-glass{fill:none;stroke:var(--accent-line);stroke-width:2}
.b-cap{fill:var(--accent-strong)}
.wc-main{flex:1;min-width:0;display:grid;gap:6px}
.wc-main .lbl{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.wc-v{font:800 26px/1.1 var(--font-body);letter-spacing:-.02em}
.wc-v small{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:0}
.glasses{display:flex;flex-wrap:wrap;gap:4px}
.glasses i{width:12px;height:16px;border-radius:2px 2px 4px 4px;border:1.5px solid var(--accent-line)}
.glasses i.on{background:var(--accent);border-color:transparent}
.wc-btns{display:flex;flex-wrap:wrap;gap:6px}
.fbadge{background:var(--field)}
.food-mini{gap:12px;text-align:left;width:100%}
.food-mini .fm-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.food-mini .fm-row .obj{flex:none;width:64px;height:64px}
.fm-t{flex:1;min-width:0;display:grid;gap:2px}
.fm-water{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;padding-top:10px;border-top:1px solid var(--line)}
.target-line{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:4 4}

/* Карточка упражнения: схема движения, шаги, похожие */
.pict-wrap{display:grid;justify-items:center;gap:4px;padding:12px 12px 10px;border-radius:24px;background:var(--card-bg);border:1px solid var(--card-border)}
.pict{width:100%;max-width:230px;height:auto;overflow:visible}
.pg-floor{stroke:var(--line-strong);stroke-width:1.5;stroke-linecap:round}
.pg-limb,.pg-torso{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.pg-torso{stroke-width:7}
.pg-limb.back{stroke:var(--muted);opacity:.55}
.pg-head{fill:var(--ink)}
.pg-gear{fill:none;stroke:var(--muted);stroke-linecap:round;stroke-linejoin:round;stroke-width:3}
.pg-solid{fill:var(--field-2);stroke:var(--muted);stroke-width:1.5}
.pg-imp{fill:var(--accent);stroke:var(--accent-strong);stroke-width:1.5}
.pg-cable{stroke:var(--accent-strong);stroke-width:1.5;stroke-dasharray:3 3}
.pict-cap{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;gap:10px}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-weight:600;line-height:1.4}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong);font-weight:800;font-size:13px}
.li.sim{gap:8px}
.sim-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:2px 0}
.sim-main .txt{display:grid;gap:1px;min-width:0}
.icon-btn.info{font:800 15px/1 Georgia,"Times New Roman",serif;font-style:italic;color:var(--accent-strong)}
.icon-btn.add{font-size:18px;color:var(--ink)}
.ex-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left}
.ex-open .ex-t{display:grid}
.info-dot{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;margin-left:3px;vertical-align:2px;font:italic 800 11px/1 Georgia,"Times New Roman",serif;color:var(--accent-strong);background:var(--accent-soft)}

/* Списки */
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;border-top:1px solid var(--line);text-align:left;min-width:0;transition:background .2s}
.list>.li:first-child{border-top:0}
button.li:active{background:var(--field)}
.li .main{flex:1;min-width:0;display:grid;gap:1px}
.li .t{font-weight:700;line-height:1.25}
.li .s{font-size:13px;color:var(--muted);font-weight:600;overflow-wrap:anywhere}
.li .r{flex:none;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.li .chev{flex:none;color:var(--faint);font-weight:800;font-size:18px}
.li .plus{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--field-2);color:var(--ink);font-weight:800}
.dot-day{flex:none;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent-glow)}

/* Варианты выбора с предметом справа */
.opts{display:grid;gap:12px}
.opt{position:relative;overflow:hidden;isolation:isolate;display:grid;gap:8px;align-content:center;min-height:104px;padding:16px 118px 16px 18px;border-radius:28px;text-align:left;transition:border-color .3s,box-shadow .3s,transform .25s var(--spring)}
.opt:active{transform:scale(.98)}
.opt b{font-size:17px;font-weight:800;line-height:1.2}
.opt span{font-size:13px;font-weight:600;color:var(--muted)}
.opt .tags{display:flex;flex-wrap:wrap;gap:5px}
.opt .tags i{font-style:normal;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--field-2);color:var(--ink)}
.opt .obj{position:absolute;right:-10px;bottom:-16px;width:118px;height:118px}
.opt[aria-pressed="true"]{border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line),0 18px 40px -24px var(--accent-glow)}

/* Тренировка */
.sess-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;margin-top:-12px;padding:12px 16px;background:var(--bar-bg);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border-bottom:1px solid var(--line);display:grid;gap:9px}
.sess-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sess-row.small{font-size:13px;font-weight:700;color:var(--muted)}
.sess-t{min-width:0}
.sess-t h1{font:800 22px/1.15 var(--font-body);letter-spacing:-.02em;text-wrap:balance}
.sess-clock{flex:none;font:800 22px/1.2 var(--font-body);font-variant-numeric:tabular-nums;background:var(--field);border:1px solid var(--line);border-radius:16px;padding:5px 12px}
.prog{position:relative;height:6px;border-radius:99px;background:var(--field-2);overflow:hidden}
.prog i{position:relative;display:block;height:100%;width:0;overflow:hidden;background:var(--accent);border-radius:99px;box-shadow:0 0 12px var(--accent-glow);transition:width .6s var(--ease-out)}
.prog i::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 2.6s ease-in-out infinite}
.ex{border-radius:28px;padding:15px;display:grid;gap:10px;min-width:0;transition:border-color .3s,box-shadow .3s}
.ex.complete{border-color:var(--accent-line)}
.ex.just-complete{animation:cardpulse 1s ease-out}
.ex-head{display:flex;align-items:center;gap:10px}
.ex-t{flex:1;min-width:0}
.ex-t .nm{font-weight:800;font-size:16px;line-height:1.2}
.ex-t .tg{font-size:13px;color:var(--muted);font-weight:600}
.last{font-size:13px;color:var(--muted);background:var(--field);border-radius:14px;padding:8px 11px;font-weight:600}
.last b{color:var(--ink)}
.sug{font-size:13px;font-weight:700;background:var(--info-bg);color:var(--ink);border-radius:14px;padding:8px 11px}
.sets{display:grid;gap:6px}
.set,.set-head{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;align-items:center}
.set.c2,.set-head.c2{grid-template-columns:26px minmax(0,1fr) 50px}
.set.c3,.set-head.c3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 50px}
.set{border-radius:14px}
.set-head{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:center}
.set .n{font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.set.pr .n{display:inline-block;animation:wiggle 1.2s ease-in-out 2}
.num{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--field);text-align:center;font:800 18px/1 var(--font-body);font-variant-numeric:tabular-nums;padding:0 4px;min-width:0;transition:border-color .2s,background .3s,box-shadow .2s}
.num::placeholder{color:var(--muted);opacity:1;font-weight:600}
.num:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.ok{height:46px;border-radius:14px;background:var(--field);border:1px solid var(--line);color:var(--faint);font-size:20px;font-weight:900;display:grid;place-items:center;transition:background .25s,color .25s,transform .2s var(--spring),box-shadow .25s}
.ok:active{transform:scale(.9)}
.set.done .ok{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 18px -10px var(--accent-glow)}
.set.done .num{background:var(--accent-soft);border-color:transparent}
.set.pr .ok{background:var(--gold);color:var(--accent-ink)}
.set.just .ok{animation:checkpop .5s var(--spring)}
.set.just .num{animation:flash .7s ease-out}
.set.just.pr{animation:prglow 1.4s ease-out}
.pace{font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.set-ctl{display:flex;gap:8px}
.shake{animation:shake .35s}

/* План */
.pday{position:relative;overflow:hidden;isolation:isolate;border-radius:28px;transition:border-color .3s}
.pday.open{border-color:var(--accent-line)}
.pday-h{width:100%;display:flex;align-items:center;gap:12px;padding:16px 108px 16px 16px;text-align:left;min-height:96px}
.pday-h .obj{position:absolute;right:-10px;top:-6px;width:112px;height:112px;transition:transform .5s var(--spring)}
.pday.open .pday-h .obj{transform:scale(.86) translate(10px,-6px)}
.wdchip{flex:none;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--field-2);color:var(--ink);font:800 14px var(--font-body);border:1px solid var(--line)}
.pday.open .wdchip{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pday-h .main{flex:1;min-width:0;display:grid;gap:1px}
.pday-h .t{font:800 17px/1.2 var(--font-body);letter-spacing:-.01em}
.pday-h .s{font-size:13px;color:var(--muted);font-weight:600}
.pday-h .emo{font-size:14px;letter-spacing:1px;overflow-wrap:anywhere}
.chev{flex:none;color:var(--faint);font-weight:800;transition:transform .35s var(--spring)}
.pday-b{padding:4px 16px 16px;display:grid;gap:12px}
.pday-b.just{animation:rise .45s var(--ease-out) both}
.wdpick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wdpick button{height:38px;border-radius:12px;background:var(--field);border:1px solid var(--line);font-weight:800;font-size:13px;transition:background .25s,transform .2s var(--spring)}
.wdpick button:active{transform:scale(.9)}
.wdpick button.taken{color:var(--faint)}
.wdpick button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.plist{display:grid}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0}
.pitem .main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:4px 0}
.pitem .txt{display:grid;min-width:0}
.pitem .t{font-weight:700;line-height:1.25}
.pitem .s{font-size:13px;color:var(--muted);font-weight:600}
.ord{display:flex;gap:4px}

/* Поля ввода */
.field{display:grid;gap:6px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:700;color:var(--muted)}
.inp{width:100%;min-width:0;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--field);padding:0 14px;font-weight:700;font-size:16px;transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
input[type="date"].inp{display:block;-webkit-appearance:none;appearance:none}
.ta{height:150px;padding:12px;font:500 13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.st{display:flex;align-items:center;gap:10px}
.st-b{width:44px;height:44px;border-radius:15px;background:var(--field);border:1px solid var(--line);font-size:22px;font-weight:800;transition:transform .2s var(--spring)}
.st-b:active{transform:scale(.88)}
.st output{min-width:44px;text-align:center;font:800 22px var(--font-body);font-variant-numeric:tabular-nums}

/* Профиль */
.acct{display:flex;align-items:center;gap:14px}
.ava{flex:none;width:56px;height:56px;border-radius:20px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 22px var(--font-body);box-shadow:0 12px 24px -14px var(--accent-glow)}
.acct .main{min-width:0}
.acct .t{font:800 19px/1.2 var(--font-body);overflow-wrap:anywhere}
.acct .s{font-size:13px;color:var(--muted);font-weight:600}
.foot{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px;font-weight:700}
.foot .logo{width:56px}

/* Знакомство и загрузка */
.onb{display:grid;gap:18px;padding-top:12px}
.onb-head{display:grid;justify-items:center;text-align:center;gap:10px}
.logo{width:132px;height:auto;display:block}
.lg-bar,.lg-col{fill:var(--ink)}
.lg-p1{fill:var(--accent)}
.lg-p2{fill:var(--accent-strong)}
.lg-p3{fill:var(--faint)}
.onb-t{font:800 40px/1 var(--font-body);letter-spacing:-.04em}
.onb-s{font-size:15.5px;color:var(--muted);font-weight:600;max-width:32ch}
.splash{min-height:70vh;display:grid;place-content:center;justify-items:center;gap:14px;text-align:center;color:var(--muted);font-weight:700;padding-inline:8px}
.splash .logo{animation:float 1.4s ease-in-out infinite}

/* Плавающая панель вкладок */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;max-width:456px;margin:0 auto;padding:6px;border-radius:32px;background:var(--bar-bg);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--card-border);box-shadow:0 22px 44px -22px rgba(0,0,0,.55);view-transition-name:tabbar}
.tabbar .in{position:relative;display:grid;grid-template-columns:repeat(5,1fr)}
.tab-ind{position:absolute;top:0;bottom:0;left:0;width:20%;padding:0 3px;transform:translateX(calc(var(--ti,0) * 100%));transition:transform .55s var(--spring);pointer-events:none}
.tab-ind::before{content:"";display:block;height:100%;border-radius:26px;background:var(--accent);box-shadow:0 10px 22px -12px var(--accent-glow)}
.tab{position:relative;z-index:1;display:grid;place-items:center;height:50px;border-radius:26px;color:var(--muted);transition:color .3s}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent-ink)}
.tab[aria-current="page"] svg{animation:tabbounce .55s var(--spring)}
.live-dot{position:absolute;top:9px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--bad-fill);box-shadow:0 0 0 2px var(--bar-bg);animation:pulse 1.4s infinite}

/* Нижний лист */
.sheet-back{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fadein .25s ease-out}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--sheet-bg);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);border:1px solid var(--card-border);border-bottom:0;border-radius:32px 32px 0 0;box-shadow:0 -20px 60px -20px rgba(0,0,0,.5);padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:sheetup .5s var(--ease-out);view-transition-name:sheet}
.sheet-back.no-anim,.sheet-back.no-anim .sheet{animation:none}
.sheet-back.closing{animation:fadeout .22s ease-in forwards;pointer-events:none}
.sheet-back.closing .sheet{animation:sheetdown .22s ease-in forwards}
.sheet.opening .li,.sheet.opening .mi,.sheet.opening .sum,.sheet.opening .opt{animation:rise .45s var(--ease-out) both}
.sheet.opening .li:nth-child(2),.sheet.opening .mi:nth-child(2),.sheet.opening .sum:nth-child(2),.sheet.opening .opt:nth-child(2){animation-delay:.04s}
.sheet.opening .li:nth-child(3),.sheet.opening .mi:nth-child(3),.sheet.opening .sum:nth-child(3),.sheet.opening .opt:nth-child(3){animation-delay:.08s}
.sheet.opening .li:nth-child(4),.sheet.opening .mi:nth-child(4),.sheet.opening .sum:nth-child(4),.sheet.opening .opt:nth-child(4){animation-delay:.12s}
.sheet.opening .li:nth-child(5),.sheet.opening .sum:nth-child(5),.sheet.opening .opt:nth-child(5){animation-delay:.16s}
.sheet.opening .li:nth-child(6){animation-delay:.2s}
.sheet.opening .li:nth-child(7){animation-delay:.24s}
.sheet.opening .li:nth-child(n+8){animation-delay:.28s}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line-strong);justify-self:center}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sheet-h h3{font:800 20px/1.2 var(--font-body);letter-spacing:-.02em;text-wrap:balance}
.sheet-hero{display:grid;justify-items:center;text-align:center;gap:8px;position:relative;padding-top:4px}
.sheet-hero h3{font:800 22px/1.2 var(--font-body);letter-spacing:-.02em;text-wrap:balance}
.sheet-hero .x{position:absolute;top:0;right:0}
.sheet-p{color:var(--muted);font-weight:600}
.sheet-p.small{font-size:13px}
.sheet-a{display:grid;gap:10px}
.x{flex:none;width:38px;height:38px;border-radius:50%;background:var(--field);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;transition:transform .25s var(--spring)}
.x:active{transform:scale(.88) rotate(90deg)}
.menu{display:grid;gap:8px}
.mi{min-height:54px;border-radius:18px;background:var(--field);border:1px solid var(--line);font-weight:700;text-align:left;padding:0 16px;transition:transform .2s var(--spring)}
.mi:active{transform:scale(.97)}
.mi.danger{color:var(--bad)}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sum{background:var(--field);border:1px solid var(--line);border-radius:18px;padding:11px 13px;display:grid;gap:1px;min-width:0}
.sum span{font-size:12px;font-weight:700;color:var(--muted)}
.sum b{font-size:18px;font-weight:800;overflow-wrap:anywhere}

/* Графики */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart:focus-visible{outline-offset:4px;border-radius:8px}
.grid-line{stroke:var(--line);stroke-width:1}
.axis-text{fill:var(--muted);font:600 11px var(--font-body);font-variant-numeric:tabular-nums}
.ln{fill:none;stroke:var(--chart);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 2px 6px var(--accent-glow))}
.band{fill:var(--chart);fill-opacity:.14}
.area{fill:var(--chart);fill-opacity:.12}
.pt,.dot-end,.dot-focus{fill:var(--chart);stroke:var(--bg);stroke-width:2}
.xh{stroke:var(--muted);stroke-width:1}
.end-label{fill:var(--ink);font:800 12px var(--font-body);font-variant-numeric:tabular-nums}
.bar{fill:var(--chart);transition:fill .2s}
.bar.on{fill:var(--chart-2)}
.anim .ln{stroke-dasharray:1 1;animation:draw 1.2s cubic-bezier(.45,0,.2,1) .15s both}
.anim .band,.anim .area{animation:fadein .9s ease-out .2s both}
.anim .pt,.anim .dot-end{transform-box:fill-box;transform-origin:50% 50%;animation:pop .45s var(--spring) both;animation-delay:calc(.25s + var(--k,0) * .06s)}
.anim .end-label{animation:fadein .4s ease-out 1.1s both}
.anim .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .75s var(--spring) both;animation-delay:calc(.1s + var(--k,0) * .05s)}
.tt{position:absolute;left:0;top:0;pointer-events:none;background:var(--white-btn);color:var(--white-btn-ink);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px)) scale(.9);opacity:0;transition:opacity .15s,transform .25s var(--spring);z-index:2}
.tt.below{transform:translate(-50%,14px) scale(.9)}
.tt.on{opacity:1;transform:translate(-50%,calc(-100% - 10px)) scale(1)}
.tt.below.on{transform:translate(-50%,14px) scale(1)}
.tt b{font-size:14px;font-weight:800}

/* Уведомление и конфетти */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,24px) scale(.9);opacity:0;pointer-events:none;background:var(--white-btn);color:var(--white-btn-ink);padding:12px 18px;border-radius:18px;font-weight:700;font-size:14.5px;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);transition:opacity .25s,transform .45s var(--spring)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* Первое появление экрана: элементы выезжают по очереди */
.app.enter>*{animation:rise .6s var(--ease-out) both}
.app.enter>*:nth-child(2){animation-delay:.05s}
.app.enter>*:nth-child(3){animation-delay:.1s}
.app.enter>*:nth-child(4){animation-delay:.15s}
.app.enter>*:nth-child(5){animation-delay:.2s}
.app.enter>*:nth-child(6){animation-delay:.25s}
.app.enter>*:nth-child(7){animation-delay:.3s}
.app.enter>*:nth-child(n+8){animation-delay:.35s}
.app.enter .stack>*,.app.enter .opts>*{animation:rise .55s var(--ease-out) both;animation-delay:calc(.15s + var(--k,0) * .06s)}
.app.enter .wday{animation:pop .5s var(--spring) both;animation-delay:calc(.12s + var(--k,0) * .045s)}
.app.enter .mini{animation:rise .5s var(--ease-out) both;animation-delay:calc(.3s + var(--k,0) * .05s)}
.app.enter .ocard .obj,.app.enter .banner .obj,.app.enter .opt .obj,.app.enter .pday .obj{animation:objin .9s var(--spring) both .35s}
.app.enter .ring-fg{animation:ringfill 1.2s var(--ease-out) .3s both}

/* Плавные переходы между экранами */
html[data-vt="workout"] .hero,html[data-vt="workout"] .sess-top{view-transition-name:workout}
html[data-vt="layout"] .pday{view-transition-name:var(--vtn)}
html[data-vt="layout"]::view-transition-group(*){animation-duration:.5s;animation-timing-function:var(--ease-out);overflow:clip}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}
::view-transition-group(athlete){animation-duration:.9s;animation-timing-function:var(--ease-out)}
::view-transition-group(workout),::view-transition-group(morph){animation-duration:.6s;animation-timing-function:var(--ease-out)}
::view-transition-image-pair(morph){isolation:auto}
::view-transition-old(morph),::view-transition-new(morph){animation-duration:.6s;mix-blend-mode:normal}
::view-transition-new(sheet){animation:sheetup .55s var(--ease-out)}
::view-transition-old(sheet){animation:sheetdown .25s ease-in both}
html[data-vt="fwd"]::view-transition-old(main){animation:.3s ease-in both vt-out-l}
html[data-vt="fwd"]::view-transition-new(main){animation:.55s var(--ease-out) both vt-in-r}
html[data-vt="back"]::view-transition-old(main){animation:.3s ease-in both vt-out-r}
html[data-vt="back"]::view-transition-new(main){animation:.55s var(--ease-out) both vt-in-l}

<script>
'use strict';

/* ======================================================================
   МОДУЛЬ STORE — вход и хранение данных
   ----------------------------------------------------------------------
   Единственное место, где приложение зависит от платформы.
   Остальной код вызывает только:
     Store.init()                 → { id, name, via }  кто вошёл
     Store.loadAll()              → { ключ: значение }  все данные пользователя
     Store.save(ключ, значение)   — сохранить (с задержкой и очередью)
     Store.remove(ключ)           — удалить
     Store.flush()                — дописать всё немедленно
     Store.onStatus(fn)           — 'loading' | 'saving' | 'saved' | 'error' | 'readonly' | 'local'
     Store.exportFile(имя, текст) → 'saved' | 'copied' | 'declined' | 'failed'
   Ключи приложения: profile, plans, custom, body, active, log_ГГГГ_ММ.
   Значения — обычные объекты и массивы (JSON).

   В «Рамках» данные лежат в памяти этого устройства (LocalAdapter). Прежние
   адаптеры Telegram и Claude убраны: на сайте их нет, а данные из Claude
   переносятся один раз из seed.json.
   ====================================================================== */

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return 'copied'; }
  catch (e) { return 'failed'; }
}

/* Сохранение файла через Claude (в артефакте обычные ссылки на скачивание не работают). */
async function claudeDownload(name, text) {
  try {
    const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null;
    if (!dl) return null;
    await dl.save({ filename: name, data: text });
    return 'saved';
  } catch (e) {
    return e && e.code === 'declined' ? 'declined' : null;
  }
}

const LocalAdapter = {
  via: 'device',
  prefix: 'podkhod:',
  mem: null,
  detect() { return true; },
  async init() {
    try {
      const k = this.prefix + '__probe';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
    } catch (e) { this.mem = new Map(); }
    this.via = this.mem ? 'memory' : 'device';
    await this.seed();
    return { id: 'local', name: '', via: this.via };
  },
  // Данные из «Подхода» в Claude переносятся один раз: кладём только то, чего на этом устройстве ещё нет.
  async seed() {
    const FLAG = 'podkhod.ramki.seeded';
    try {
      if (this.mem || localStorage.getItem(FLAG)) return;
      const res = await fetch('seed.json');
      if (!res.ok) return;
      const seed = await res.json();
      for (const [k, v] of Object.entries(seed)) {
        if (localStorage.getItem(this.prefix + k) == null) localStorage.setItem(this.prefix + k, JSON.stringify(v));
      }
      localStorage.setItem(FLAG, '1');
    } catch (e) { /* без файла — в следующий раз */ }
  },
  async loadAll() {
    const out = {};
    if (this.mem) {
      this.mem.forEach((v, k) => { try { out[k] = JSON.parse(v); } catch (e) { /* пропустить */ } });
      return out;
    }
    for (let i = 0; i < localStorage.length; i++) {
      const full = localStorage.key(i);
      if (!full || !full.startsWith(this.prefix) || full.endsWith('__probe')) continue;
      try { out[full.slice(this.prefix.length)] = JSON.parse(localStorage.getItem(full)); } catch (e) { /* пропустить */ }
    }
    return out;
  },
  async write(key, value) {
    const s = JSON.stringify(value);
    if (this.mem) this.mem.set(key, s);
    else localStorage.setItem(this.prefix + key, s);
  },
  async del(key) {
    if (this.mem) this.mem.delete(key);
    else localStorage.removeItem(this.prefix + key);
  },
  async exportFile(name, text) {
    const viaClaude = await claudeDownload(name, text);
    if (viaClaude) return viaClaude;
    if (window.claude) return copyText(text);
    try {
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return 'saved';
    } catch (e) { return copyText(text); }
  },
};

const Store = (() => {
  const DEL = Symbol('delete');
  const ADAPTERS = [LocalAdapter];
  let A = null;
  let user = null;
  let status = 'loading';
  let timer = 0;
  let running = null;
  let retryDelay = 2000;
  const dirty = new Map();
  const subs = new Set();

  function setStatus(s, info) {
    status = s;
    subs.forEach(fn => { try { fn(s, info); } catch (e) { /* подписчик */ } });
  }
  const idle = () => (A === LocalAdapter ? 'local' : 'saved');

  async function init() {
    A = null; user = null;
    for (const ad of ADAPTERS) {
      if (!ad.detect()) continue;
      try {
        const u = await ad.init();
        if (u) { A = ad; user = u; break; }
      } catch (e) { console.warn('Store: адаптер недоступен', ad.via, e); }
    }
    if (!A) { A = LocalAdapter; user = await LocalAdapter.init(); }
    return user;
  }

  async function loadAll() {
    setStatus('loading');
    const all = await A.loadAll();
    setStatus(idle());
    return JSON.parse(JSON.stringify(all || {})); // приложение всегда получает свою изменяемую копию
  }

  function schedule(ms) {
    clearTimeout(timer);
    timer = setTimeout(flush, ms);
    if (status !== 'readonly') setStatus('saving');
  }
  function save(key, value) { dirty.set(key, value); schedule(700); }
  function remove(key) { dirty.set(key, DEL); schedule(700); }

  async function flush() {
    clearTimeout(timer);
    if (running) { await running; if (dirty.size && !running) return flush(); return; }
    if (!dirty.size || !A) return;
    const batch = [...dirty.entries()];
    dirty.clear();
    running = (async () => {
      let err = null;
      for (const [k, v] of batch) {
        try {
          if (v === DEL) await A.del(k);
          else await A.write(k, JSON.parse(JSON.stringify(v)));
        } catch (e) {
          err = e;
          if (!dirty.has(k)) dirty.set(k, v); // не теряем изменение
        }
      }
      return err;
    })();
    const err = await running;
    running = null;
    if (err) {
      const code = err && err.code;
      if (code === 'invalid_argument' || code === 'not_granted' || code === 'revoked') { setStatus('readonly', err); return; }
      setStatus('error', err);
      clearTimeout(timer);
      timer = setTimeout(flush, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 60000);
      return;
    }
    retryDelay = 2000;
    if (dirty.size) schedule(300); else setStatus(idle());
  }

  return {
    init, loadAll, save, remove, flush,
    onStatus(fn) { subs.add(fn); fn(status); },
    exportFile(name, text) { return A.exportFile(name, text); },
    get user() { return user; },
    get via() { return A ? A.via : null; },
    get pending() { return dirty.size > 0 || !!running; },
  };
})();

/* ======================================================================
   ПОМОЩНИКИ
   ====================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const dateOf = iso => { const [y, m, d] = String(iso).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (iso, n) => { const d = dateOf(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const weekday = iso => { const g = dateOf(iso).getDay(); return g === 0 ? 7 : g; };
const weekStart = iso => addDays(iso, 1 - weekday(iso));
const daysBetween = (a, b) => Math.round((dateOf(b) - dateOf(a)) / DAY);
const ymOf = iso => iso.slice(0, 7).replace('-', '_');
const byD = (a, b) => a.d.localeCompare(b.d);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const WD = ['', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
const WD_FULL = ['', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
const WD_ACC = ['', 'понедельник', 'вторник', 'среду', 'четверг', 'пятницу', 'субботу', 'воскресенье'];
const WD_IN = ['', 'в понедельник', 'во вторник', 'в среду', 'в четверг', 'в пятницу', 'в субботу', 'в воскресенье'];
const MON_G = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MON_S = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const fmtDate = iso => { const d = dateOf(iso); return `${d.getDate()} ${MON_G[d.getMonth()]}`; };
const fmtDateS = iso => { const d = dateOf(iso); return `${d.getDate()} ${MON_S[d.getMonth()]}`; };
const fmtDateLong = iso => `${WD_FULL[weekday(iso)]}, ${fmtDate(iso)}`;

const NF = {};
const fmtNum = (n, d = 1) => {
  if (n == null || !isFinite(n)) return '—';
  NF[d] = NF[d] || new Intl.NumberFormat('ru-RU', { maximumFractionDigits: d });
  return NF[d].format(n);
};
const fmtSigned = (n, d = 1) => (n > 0.0001 ? '+' : n < -0.0001 ? '−' : '±') + fmtNum(Math.abs(n), d);
const fmtIn = v => (v == null ? '' : String(v).replace('.', ','));
const parseNum = v => {
  if (v == null) return null;
  const s = String(v).trim().replace(/\s/g, '').replace(',', '.');
  if (!s) return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
};
const plural = (n, one, few, many) => {
  const a = Math.abs(Math.round(n)) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
};
const fmtDur = ms => {
  if (!isFinite(ms) || ms < 0) return '—';
  const m = Math.max(1, Math.round(ms / 60000));
  if (m < 60) return `${m} мин`;
  return `${Math.floor(m / 60)} ч${m % 60 ? ' ' + (m % 60) + ' мин' : ''}`;
};
const fmtClock = ms => {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h ? `${h}:${pad2(m)}:${pad2(ss)}` : `${m}:${pad2(ss)}`;
};
const fmtPace = minPerUnit => { const t = Math.round(minPerUnit * 60); return `${Math.floor(t / 60)}:${pad2(t % 60)}`; };
const fmtTonnes = kg => (kg >= 1000 ? `${fmtNum(kg / 1000, 1)} т` : `${fmtNum(kg, 0)} кг`);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const haptic = (ms = 12) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* нет вибрации */ } };

/* ======================================================================
   СПРАВОЧНИК УПРАЖНЕНИЙ И СТАНДАРТНЫЕ ПЛАНЫ
   ====================================================================== */

/* ======================================================================
   ИНДЕКС: история по упражнениям, рекорды

let IX = { byEx: {}, workouts: [] };
const isDone = s => s && s.done !== false;
const e1rm = (w, r) => (r <= 1 ? w : w * (1 + r / 30));
const refBW = () => (S.profile && S.profile.startW) || 70;

function setScore(ex, s) {
  if (!s) return 0;
  switch (ex.type) {
    case 'cardio': return (s.km || 0) > 0 ? s.km : (s.min || 0) / 1000;
    case 'time': return s.s || 0;
    case 'bodyweight': return e1rm(refBW() + (s.w || 0), s.r || 0);
    default: return (s.w || 0) > 0 ? e1rm(s.w, s.r || 0) : (s.r || 0) / 1000;
  }
}

function rebuildIndex() {
  const ws = Object.values(S.logs).flat()
    .filter(w => w && w.date && Array.isArray(w.items))
    .sort((a, b) => a.date.localeCompare(b.date) || (a.start || 0) - (b.start || 0));
  const byEx = {};
  for (const w of ws) {
    for (const it of w.items) {
      const done = (it.sets || []).filter(isDone);
      if (!done.length) continue;
      const ex = getEx(it.ex);
      let best = done[0], bv = -1;
      for (const s of done) { const v = setScore(ex, s); if (v > bv) { bv = v; best = s; } }
      const rec = byEx[it.ex] || (byEx[it.ex] = { sessions: [], best: null });
      rec.sessions.push({ date: w.date, wid: w.id, sets: done, value: bv, set: best });
      if (!rec.best || bv > rec.best.value) rec.best = { value: bv, set: best, date: w.date };
    }
  }
  IX = { byEx, workouts: ws };
}

const lastSession = id => { const r = IX.byEx[id]; return r ? r.sessions[r.sessions.length - 1] : null; };

function sessionStats(w) {
  let sets = 0, done = 0, vol = 0, km = 0, cmin = 0, prs = 0;
  for (const it of (w && w.items) || []) {
    const ex = getEx(it.ex);
    for (const s of it.sets || []) {
      sets++;
      if (!isDone(s)) continue;
      done++;
      if (s.pr) prs++;
      if (ex.type === 'weight') vol += (s.w || 0) * (s.r || 0);
      if (ex.type === 'cardio') { km += s.km || 0; cmin += s.min || 0; }
    }
  }
  return { sets, done, vol, km, cmin, prs };
}

const topOfRange = reps => { const nums = String(reps == null ? '' : reps).match(/\d+/g); return nums ? +nums[nums.length - 1] : null; };

function targetText(ex, t) {
  if (!t) return '';
  if (ex.type === 'cardio') return t.min ? `${t.min} мин` : '';
  if (ex.type === 'time') return `${t.sets} × ${t.sec} с`;
  return `${t.sets} × ${t.reps}`;
}
function defaultTarget(ex) {
  if (ex.type === 'cardio') return { min: 15 };
  if (ex.type === 'time') return { sets: 3, sec: 45 };
  return ex.group === 'abs' ? { sets: 3, reps: '12–15' } : { sets: 3, reps: '8–12' };
}
function estMinutes(day) {
  let m = 0;
  for (const it of day.items) {
    const ex = getEx(it.ex), t = it.target || {};
    if (ex.type === 'cardio') m += t.min || 10;
    else if (ex.type === 'time' || ex.group === 'abs') m += (t.sets || 3) * 1.5;
    else m += (t.sets || 3) * 2.5;
  }
  return Math.max(5, Math.round(m / 5) * 5);
}

function setText(ex, s) {
  if (ex.type === 'cardio') return `${s.min || 0} мин${s.km ? ' · ' + fmtNum(s.km, 2) + ' км' : ''}`;
  if (ex.type === 'time') return `${s.s} с`;
  if (ex.type === 'bodyweight') return s.w ? `+${fmtNum(s.w)}×${s.r}` : `${s.r}`;
  return `${fmtNum(s.w)}×${s.r}`;
}
function setsText(ex, sets) {
  const t = sets.map(s => setText(ex, s)).join(' · ');
  return ex.type === 'bodyweight' && sets.every(s => !s.w) ? `${t} повт.` : t;
}
function setTextLong(ex, s) {
  if (!s) return '—';
  if (ex.type === 'cardio') return `${fmtNum(s.km || 0, 2)} км за ${s.min || 0} мин`;
  if (ex.type === 'time') return `${s.s} с`;
  if (ex.type === 'bodyweight') return s.w ? `+${fmtNum(s.w)} кг × ${s.r}` : `${s.r} ${plural(s.r, 'повтор', 'повтора', 'повторов')}`;
  if (!(s.w > 0)) return `${s.r} ${plural(s.r, 'повтор', 'повтора', 'повторов')}`;
  return `${fmtNum(s.w)} кг × ${s.r}`;
}

/* ======================================================================
   ТЕЛО: вес, талия, темп набора
   ====================================================================== */
const weights = () => S.body.filter(e => e.w != null).sort(byD);
function latestWeight() { const ws = weights(); return ws.length ? ws[ws.length - 1].w : (S.profile ? S.profile.startW : null); }

function slopeMonthly(pts) {
  const n = pts.length;
  if (n < 2) return null;
  const mx = pts.reduce((a, p) => a + p.t, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
  let num = 0, den = 0;
  for (const p of pts) { num += (p.t - mx) * (p.y - my); den += (p.t - mx) ** 2; }
  return den ? (num / den) * 30.44 : null;
}

function waistTrend() {
  const es = S.body.filter(e => e.waist != null).sort(byD);
  if (es.length < 2) return null;
  const last = es[es.length - 1];
  let win = es.filter(e => daysBetween(e.d, last.d) <= 42);
  if (win.length < 2) win = es.slice(-2);
  const first = win[0];
  const days = daysBetween(first.d, last.d);
  if (days < 13) return null;
  const wts = weights().filter(e => e.d >= first.d && e.d <= last.d);
  const dWeight = wts.length >= 2 ? wts[wts.length - 1].w - wts[0].w : 0;
  return { dWaist: last.waist - first.waist, dWeight, days };
}

function bulkAnalysis() {
  const p = S.profile, ws = weights();
  const out = { rate: null, cls: 'info', icon: '⚖️', status: '', note: '' };
  if (ws.length >= 2) {
    const lastD = ws[ws.length - 1].d;
    let win = ws.filter(e => daysBetween(e.d, lastD) <= 42);
    if (win.length < 3 || daysBetween(win[0].d, lastD) < 13) win = ws;
    if (daysBetween(win[0].d, lastD) >= 13) out.rate = slopeMonthly(win.map(e => ({ t: daysBetween(win[0].d, e.d), y: e.w })));
  }
  const r = out.rate, tgt = p.rate;
  if (r == null) {
    out.note = 'Взвешивайся 1–2 раза в неделю утром, до еды. Через две недели здесь появится твой темп набора.';
  } else if (r < -0.15) {
    Object.assign(out, { cls: 'bad', icon: '↘️', status: 'вес снижается', note: 'Вес снижается. Для набора мышц нужно есть немного больше, чем тратишь: добавь перекус или порцию побольше.' });
  } else if (r < tgt - 0.3) {
    Object.assign(out, { cls: 'warn', icon: '🐢', status: 'медленнее цели', note: `Набор идёт медленнее цели (+${fmtNum(tgt, 2)} кг в месяц). Добавь немного еды, например лишний перекус с белком.` });
  } else if (r > tgt + 0.45) {
    Object.assign(out, { cls: 'warn', icon: '🚀', status: 'быстрее цели', note: 'Вес растёт быстрее цели. Чтобы прибавка шла в мышцы, а не в жир, немного уменьши калорийность.' });
  } else {
    Object.assign(out, { cls: 'good', icon: '✅', status: 'в коридоре цели', note: 'Темп набора в коридоре цели. Так держать!' });
  }
  const wt = waistTrend();
  if (wt && wt.dWaist >= 1 && wt.dWaist > wt.dWeight) {
    Object.assign(out, { cls: 'warn', icon: '📏', note: `Талия ${fmtSigned(wt.dWaist)} см при весе ${fmtSigned(wt.dWeight)} кг за ${wt.days} ${plural(wt.days, 'день', 'дня', 'дней')}. Похоже, часть набора уходит в жир. Сбавь темп: чуть меньше калорий, цель +0,25–0,5 кг в месяц.` });
  }
  return out;
}
function bandAt(t) {
  const p = S.profile;
  const months = (t - dateOf(p.startDate).getTime()) / DAY / 30.44;
  const target = p.startW + p.rate * months;
  return { x: t, lo: target - 0.75, hi: target + 0.75 };
}
function bmiLabel(b) { return b < 18.5 ? 'ниже нормы' : b < 25 ? 'норма' : b < 30 ? 'выше нормы' : 'сильно выше нормы'; }

/* ======================================================================
   НЕДЕЛИ И СЕРИИ
   ====================================================================== */
function weekCount(today) {
  const ws = weekStart(today), we = addDays(ws, 6);
  return new Set(IX.workouts.filter(w => w.date >= ws && w.date <= we).map(w => w.date)).size;
}
function weekStreak(today, mode) {
  const byWeek = {};
  for (const w of IX.workouts) { const k = weekStart(w.date); (byWeek[k] = byWeek[k] || new Set()).add(w.date); }
  let n = 0, ws = weekStart(today);
  if ((byWeek[ws] ? byWeek[ws].size : 0) >= mode) n++;
  ws = addDays(ws, -7);
  while ((byWeek[ws] ? byWeek[ws].size : 0) >= mode) { n++; ws = addDays(ws, -7); }
  return n;
}
function nextTraining(today, days) {
  for (let k = 1; k <= 7; k++) {
    const iso = addDays(today, k);
    const d = days.find(x => x.wd === weekday(iso));
    if (d) return { date: iso, day: d, inDays: k };
  }
  return null;
}
function dayById(id) {
  for (const m of [3, 4]) { const d = S.plans && S.plans[m] && S.plans[m].days.find(x => x.id === id); if (d) return d; }
  return null;
}

/* ======================================================================
   ТРЕНИРОВКА: логика
   ====================================================================== */
const blankSet = ex => (ex.type === 'cardio' ? { min: null, km: null, done: false }
  : ex.type === 'time' ? { s: null, done: false } : { w: null, r: null, done: false });

function sessionItem(exId, target) {
  const ex = getEx(exId);
  const t = target ? { ...target } : defaultTarget(ex);
  const n = ex.type === 'cardio' ? 1 : clamp(t.sets || 3, 1, 10);
  return { ex: exId, target: t, sets: Array.from({ length: n }, () => blankSet(ex)) };
}

function newSession(day) {
  return {
    id: uid('w'), date: todayISO(), start: Date.now(), mode: S.profile.mode,
    dayId: day ? day.id : null, name: day ? day.name : 'Свободная тренировка', color: day ? day.color : 'mint',
    bw: latestWeight(), items: (day ? day.items : []).map(it => sessionItem(it.ex, it.target)),
  };
}

/* Серые подсказки в полях: значения прошлого раза или цель из плана. */
function phFor(it, j) {
  const ex = getEx(it.ex), last = lastSession(it.ex), t = it.target || {};
  const ls = last ? (last.sets[j] || last.sets[last.sets.length - 1]) : null;
  const pick = (a, b) => (a != null ? a : b != null ? b : null);
  if (ex.type === 'cardio') return { min: pick(ls && ls.min, t.min), km: pick(ls && ls.km, null) };
  if (ex.type === 'time') return { s: pick(ls && ls.s, t.sec) };
  if (ex.type === 'bodyweight') return { w: pick(ls && ls.w, 0), r: pick(ls && ls.r, topOfRange(t.reps)) };
  return { w: pick(ls && ls.w, null), r: pick(ls && ls.r, topOfRange(t.reps)) };
}

function suggestion(it) {
  const ex = getEx(it.ex), last = lastSession(it.ex), t = it.target || {};
  if (!last || !last.sets.length) return '';
  if (ex.type === 'weight') {
    const top = topOfRange(t.reps);
    const maxW = Math.max(...last.sets.map(s => s.w || 0));
    if (top && maxW > 0 && last.sets.length >= (t.sets || 1) && last.sets.every(s => (s.r || 0) >= top)) {
      return `В прошлый раз все подходы на ${top}+ повторов. Попробуй ${fmtNum(maxW + (ex.inc || 2.5))} кг`;
    }
  } else if (ex.type === 'bodyweight') {
    const top = topOfRange(t.reps);
    if (top && last.sets.length >= (t.sets || 1) && last.sets.every(s => (s.r || 0) >= top)) {
      return 'Все подходы на верх диапазона. Добавь пару повторов или 2,5 кг на пояс';
    }
  } else if (ex.type === 'time') {
    if (t.sec && last.sets.every(s => (s.s || 0) >= t.sec)) return `Держишь ${t.sec} с уверенно. Попробуй ${t.sec + 10} с`;
  } else if (ex.type === 'cardio') {
    const km = last.sets.reduce((a, s) => a + (s.km || 0), 0), min = last.sets.reduce((a, s) => a + (s.min || 0), 0);
    if (km > 0 && min > 0) return `В прошлый раз ${fmtNum(km, 2)} км за ${min} мин. Попробуй ${fmtNum(Math.round((km + 0.1) * 100) / 100, 2)} км за то же время`;
  }
  return '';
}

function checkPR(it, j) {
  const rec = IX.byEx[it.ex];
  if (!rec || !rec.best) return false; // первый раз — это точка отсчёта, а не рекорд
  const ex = getEx(it.ex), v = setScore(ex, it.sets[j]);
  if (ex.type === 'cardio' && !((it.sets[j].km || 0) > 0)) return false;
  let sess = 0;
  it.sets.forEach((o, i) => { if (i !== j && o.done) sess = Math.max(sess, setScore(ex, o)); });
  return v > rec.best.value + 1e-9 && v > sess + 1e-9;
}

function needInput(i, j, f, msg) {
  const inp = document.querySelector(`input[data-i="${i}"][data-j="${j}"][data-in="${f}"]`);
  if (inp) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.focus(); }
  toast(msg);
}

function toggleSet(i, j) {
  const it = S.active && S.active.items[i];
  if (!it || !it.sets[j]) return;
  const s = it.sets[j], ex = getEx(it.ex);
  if (s.done) {
    s.done = false; s.pr = false;
  } else {
    const ph = phFor(it, j);
    if (ex.type === 'cardio') {
      if (s.min == null) s.min = ph.min;
      if (s.km == null) s.km = ph.km;
      if (!(s.min > 0)) return needInput(i, j, 'min', 'Сколько минут было?');
    } else if (ex.type === 'time') {
      if (s.s == null) s.s = ph.s;
      if (!(s.s > 0)) return needInput(i, j, 's', 'Сколько секунд держал?');
    } else {
      if (s.w == null) s.w = ph.w;
      if (s.r == null) s.r = ph.r;
      if (ex.type === 'weight' && s.w == null) return needInput(i, j, 'w', 'Введи вес');
      if (!(s.r > 0)) return needInput(i, j, 'r', 'Сколько повторов?');
      if (s.w == null) s.w = 0;
    }
    const wasAll = it.sets.every(x => x.done || x === s);
    s.done = true;
    S.ui.just = `${i}:${j}`;
    if (wasAll && it.sets.length > 1) S.ui.justCard = i;
    haptic();
    if (checkPR(it, j)) { s.pr = true; celebrate(ex, s); }
  }
  persist.active();
  rerenderCard(i);
  updateSessHeader();
}

function celebrate(ex, s) {
  confetti();
  haptic(40);
  toast(`🏆 Новый рекорд! ${ex.name}: ${setTextLong(ex, s)}`);
}

function startWorkout(day) {
  closeSheet(true);
  if (S.active) { toast('Сначала заверши текущую тренировку'); go('today'); return; }
  S.active = newSession(day);
  persist.active();
  runVT('workout', () => { S.tab = 'today'; render('vt'); window.scrollTo(0, 0); });
  startClock();
}

function cleanSet(s) {
  const o = {};
  for (const k of ['w', 'r', 's', 'min', 'km']) if (s[k] != null) o[k] = s[k];
  if (s.pr) o.pr = true;
  return o;
}

function finishWorkout() {
  const a = S.active;
  if (!a) return;
  const items = a.items
    .map(it => ({ ex: it.ex, target: it.target, sets: it.sets.filter(s => s.done).map(cleanSet) }))
    .filter(it => it.sets.length);
  const w = { id: a.id, date: a.date, start: a.start, end: Date.now(), mode: a.mode, dayId: a.dayId, name: a.name, color: a.color, bw: a.bw, items };
  const ym = ymOf(w.date);
  (S.logs[ym] = S.logs[ym] || []).push(w);
  S.logs[ym].sort((x, y) => x.date.localeCompare(y.date) || x.start - y.start);
  persist.log(ym);
  S.active = null;
  persist.active();
  rebuildIndex();
  closeSheet(true);
  stopSessionExtras();
  runVT('workout', () => { S.tab = 'today'; render('vt'); window.scrollTo(0, 0); });
  const prs = items.reduce((n, it) => n + it.sets.filter(s => s.pr).length, 0);
  if (prs) confetti();
  toast(prs ? `Тренировка сохранена. Рекордов: ${prs} 🏆` : 'Тренировка сохранена 💪');
}

function discardWorkout() {
  S.active = null;
  persist.active();
  closeSheet(true);
  stopSessionExtras();
  runVT('workout', () => { render('vt'); window.scrollTo(0, 0); });
  toast('Тренировка удалена');
}

/* Часы тренировки и экран без затемнения */
let clockTimer = 0;
function startClock() {
  clearInterval(clockTimer);
  clockTimer = setInterval(() => {
    if (!S.active) { clearInterval(clockTimer); return; }
    const el = $('#sessClock');
    if (el) el.textContent = fmtClock(Date.now() - S.active.start);
  }, 1000);
}
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on) {
      if (wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (wakeLock) {
      const l = wakeLock; wakeLock = null; await l.release();
    }
  } catch (e) { wakeLock = null; }
}
function stopSessionExtras() { clearInterval(clockTimer); keepAwake(false); }

function updateSessHeader() {
  if (!S.active) return;
  const st = sessionStats(S.active);
  const c = $('#sessCount');
  if (c) c.textContent = `${st.done} из ${st.sets} ${plural(st.sets, 'подхода', 'подходов', 'подходов')}`;
  const bar = $('.prog i');
  if (bar) bar.style.width = (st.sets ? Math.round((st.done / st.sets) * 100) : 0) + '%';
}
function rerenderCard(i) {
  const el = document.querySelector(`.ex[data-i="${i}"]`);
  if (!el || !S.active || !S.active.items[i]) { rerender(); return; }
  el.outerHTML = exCard(S.active.items[i], i);
  S.ui.just = null; S.ui.justCard = null;
}
function moveSessItem(i, d) {
  const arr = S.active.items, k = i + d;
  if (k < 0 || k >= arr.length) return;
  [arr[i], arr[k]] = [arr[k], arr[i]];
  persist.active();

  rerender();
}

/* Предмет на подиуме: подиум стоит, предмет слегка парит. */
const OBJ = { kb: 'sKb', db: 'sDb', cup: 'sCup', scale: 'sScale', watch: 'sWatch', plate: 'sPlate', shaker: 'sShaker' };
function obj(kind, morph) {

  return `<span class="obj"${morph ? ` data-morph="${morph}"` : ''} aria-hidden="true"><svg class="obj-ped" viewBox="0 0 120 120"><use href="#sPed"/></svg><svg class="obj-item" viewBox="0 0 120 120"><use href="#${OBJ[kind] || 'sDb'}"/></svg></span>`;

function uiGet(k) { try { return localStorage.getItem('podkhod-ui:' + k); } catch (e) { return null; } }
function uiSet(k, v) { try { localStorage.setItem('podkhod-ui:' + k, v); } catch (e) { /* не страшно */ } }

function viewToday() {
  if (S.active) return viewSession();
  const today = todayISO(), mode = S.profile.mode, days = S.plans[mode].days;
  const pday = days.find(d => d.wd === weekday(today));
  const doneToday = IX.workouts.filter(w => w.date === today);
  const first = ((S.user && S.user.name) || '').trim().split(/\s+/)[0];
  return topBar(`${greet()}${first ? ', ' + first : ''}!`, fmtDateLong(today))
    + tipBanner(today)
    + modeSwitch(mode)
    + weekStrip(today, days)
    + heroCard(today, pday, days, doneToday)
    + (pday && !doneToday.length ? dayCarousel(pday) : '')
    + objectCards()
    + foodToday()
    + todayTiles(today, mode);
}

function tipBanner(today) {
  if (S.ui.tipHidden === today || uiGet('tip') === today) return '';
  const [title, text, kind] = TIPS[Math.floor(dateOf(today).getTime() / DAY) % TIPS.length];
  return `<section class="banner"><b>${esc(title)}</b><p>${esc(text)}</p>${obj(kind)}<button class="banner-x" data-act="tip-hide" aria-label="Скрыть совет">✕</button></section>`;
}

function weekStrip(today, days) {
  const ws = weekStart(today);
  let cells = '';
  for (let k = 0; k < 7; k++) {
    const iso = addDays(ws, k), wd = k + 1;
    const pd = days.find(d => d.wd === wd);
    const done = IX.workouts.some(w => w.date === iso);
    const cls = ['wday', pd ? 'planned' : '', done ? 'done' : '', iso === today ? 'today' : '', iso < today && pd && !done ? 'missed' : ''].join(' ');
    const label = `${WD_FULL[wd]}, ${fmtDate(iso)}${pd ? ', ' + pd.name : ', отдых'}${done ? ', сделано' : ''}`;
    cells += `<div class="${cls}" style="--k:${k}" role="listitem" aria-label="${esc(label)}"><span>${WD[wd]}</span><span class="dn">${dateOf(iso).getDate()}</span><i class="dot">${done ? '✓' : ''}</i></div>`;
  }
  return `<div class="week" role="list" aria-label="Эта неделя">${cells}</div>`;
}

function heroCard(today, pday, days, doneToday) {
  const eyebrow = `<div class="eyebrow">Сегодня · ${WD_FULL[weekday(today)].toLowerCase()}</div>`;
  const chipsOf = arr => `<div class="chips">${arr.filter(Boolean).map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>`;
  if (doneToday.length) {
    const w = doneToday[doneToday.length - 1], st = sessionStats(w);
    return `<section class="hero">${eyebrow}
      <h2>Тренировка сделана</h2>
      <p class="hero-s">${esc(w.name)}: отличная работа 🎉</p>
      ${chipsOf([fmtDur(w.end - w.start), `${st.done} ${plural(st.done, 'подход', 'подхода', 'подходов')}`, st.vol ? fmtTonnes(st.vol) : '', st.km ? `${fmtNum(st.km, 2)} км` : '', st.prs ? `🏆 ${st.prs}` : ''])}
      <div class="hero-a"><button class="btn outline block" data-act="open-workout" data-a="${esc(w.id)}">Посмотреть итоги</button><button class="btn ghost block" data-act="pick-day">Ещё одна тренировка</button></div>
    </section>`;
  }
  if (pday) {
    const cardio = pday.items.find(it => getEx(it.ex).type === 'cardio');
    const absN = pday.items.filter(it => getEx(it.ex).group === 'abs').length;
    return `<section class="hero">${eyebrow}
      <h2>${esc(pday.name)}</h2>
      <p class="hero-s">Около ${estMinutes(pday)} минут</p>
      ${chipsOf([`${pday.items.length} ${plural(pday.items.length, 'упражнение', 'упражнения', 'упражнений')}`, absN ? 'пресс' : '', cardio ? `кардио ${(cardio.target && cardio.target.min) || 15} мин` : ''])}
      <div class="hero-a"><button class="btn primary block big" data-act="start-day" data-a="${esc(pday.id)}">${ICON.play}Начать тренировку</button><button class="btn outline block" data-act="pick-day">${ICON.swap}Выбрать другую</button></div>
    </section>`;
  }

  return `<section class="hero">${eyebrow}
    <h2>День отдыха</h2>

function dayCarousel(d) {

function objectCards() {

    <button class="ocard" data-act="records"><div><div class="ocard-t">Рекорды</div><div class="ocard-s">${recN ? `${recN} ${plural(recN, 'упражнение', 'упражнения', 'упражнений')}` : 'пока пусто'}</div></div><span class="arrow-pill">${ICON.arrow}</span>${obj('cup', 'cup')}</button>

/* Кольцо прогресса недели. */
function ring(n, total) {
  const r = 21, C = 2 * Math.PI * r, frac = total ? Math.min(1, n / total) : 0;
  const fg = frac > 0 ? `<circle class="ring-fg" cx="26" cy="26" r="${r}" style="--c:${C.toFixed(1)};--off:${(C * (1 - frac)).toFixed(1)}"/>` : '';
  return `<svg class="ring" viewBox="0 0 52 52" aria-hidden="true"><circle class="ring-bg" cx="26" cy="26" r="${r}"/>${fg}</svg>`;
}
const countSpan = (n, dec = 0) => `<span data-count="${n}" data-dec="${dec}">${fmtNum(n, dec)}</span>`;

function todayTiles(today, mode) {
  const wk = weekCount(today), streak = weekStreak(today, mode);
  return `<div class="tiles">
    <div class="tile ring-tile"><div><span class="lbl">Эта неделя</span><span class="val">${countSpan(wk)}<small>из ${mode}</small></span><span class="tile-s">${wk >= mode ? 'план выполнен 🎉' : `осталось ${mode - wk}`}</span></div>${ring(wk, mode)}</div>
    <div class="tile"><span class="lbl">Серия</span><span class="val">${streak ? '<span class="flame">🔥</span> ' : ''}${countSpan(streak)}<small>${plural(streak, 'неделя', 'недели', 'недель')}</small></span><span class="tile-s">${streak ? 'без пропусков по плану' : `сделай ${mode} за неделю`}</span></div>
  </div>`;
}
