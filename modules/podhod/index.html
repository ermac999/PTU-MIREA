function numInput(i, j, f, v, ph, mode, label) {
  return `<input class="num" id="in-${i}-${j}-${f}" type="text" inputmode="${mode}" autocomplete="off" enterkeyhint="next" data-in="${f}" data-i="${i}" data-j="${j}" value="${esc(fmtIn(v))}" placeholder="${ph == null ? '—' : esc(fmtIn(ph))}" aria-label="${esc(label)}">`;
}
function okBtn(i, j, done) {
  return `<button class="ok" data-act="set-done" data-a="${i}" data-b="${j}" aria-pressed="${done}" aria-label="${done ? 'Снять отметку с подхода' : 'Подход выполнен'}">✓</button>`;
}
function paceText(ex, min, km) {
  if (!(min > 0) || !(km > 0)) return 'Темп посчитается, когда будут минуты и километры';
  if (ex.metric === 'pace') return `Темп ${fmtPace(min / km)} мин/км · ${fmtNum(km / (min / 60))} км/ч`;
  if (ex.metric === 'pace500') return `Темп ${fmtPace(min / (km * 2))} мин/500 м`;
  return `Скорость ${fmtNum(km / (min / 60))} км/ч`;
}

function exCard(it, i) {
  const ex = getEx(it.ex), g = grp(ex.group), last = lastSession(it.ex);
  const allDone = it.sets.length > 0 && it.sets.every(s => s.done);
  const sug = suggestion(it);
  const rowCls = (s, j) => `set ${s.done ? 'done' : ''} ${s.pr ? 'pr' : ''}${S.ui.just === `${i}:${j}` ? ' just' : ''}`;
  const nCell = (s, j) => `<span class="n">${s.pr ? '🏆' : j + 1}</span>`;
  let rows;
  if (ex.type === 'cardio') {
    const s = it.sets[0], ph = phFor(it, 0);
    rows = `<div class="set-head c3"><span>Минуты</span><span>Км</span><span></span></div>
      <div class="${rowCls(s, 0)} c3">${numInput(i, 0, 'min', s.min, ph.min, 'numeric', 'Минуты')}${numInput(i, 0, 'km', s.km, ph.km, 'decimal', 'Километры')}${okBtn(i, 0, s.done)}</div>
      <div class="pace" id="pace-${i}">${esc(paceText(ex, s.min != null ? s.min : ph.min, s.km != null ? s.km : ph.km))}</div>`;
  } else if (ex.type === 'time') {
    rows = '<div class="set-head c2"><span>#</span><span>Секунды</span><span></span></div>' + it.sets.map((s, j) => {
      const ph = phFor(it, j);
      return `<div class="${rowCls(s, j)} c2">${nCell(s, j)}${numInput(i, j, 's', s.s, ph.s, 'numeric', `Секунды, подход ${j + 1}`)}${okBtn(i, j, s.done)}</div>`;
    }).join('');
  } else {
    rows = `<div class="set-head"><span>#</span><span>${ex.type === 'bodyweight' ? '+ кг' : 'кг'}</span><span>Повт.</span><span></span></div>` + it.sets.map((s, j) => {
      const ph = phFor(it, j);
      return `<div class="${rowCls(s, j)}">${nCell(s, j)}${numInput(i, j, 'w', s.w, ph.w, 'decimal', `Вес, подход ${j + 1}`)}${numInput(i, j, 'r', s.r, ph.r, 'numeric', `Повторы, подход ${j + 1}`)}${okBtn(i, j, s.done)}</div>`;
    }).join('');
  }
  return `<article class="ex ${allDone ? 'complete' : ''}${S.ui.justCard === i ? ' just-complete' : ''}" data-i="${i}" style="--k:${Math.min(i, 8)}">
    <header class="ex-head">
      <button class="ex-open" data-act="ex-info" data-a="${i}" aria-label="Техника: ${esc(ex.name)}"><span class="badge" style="--g:${gvar(ex.group)}" data-morph="ex" aria-hidden="true">${g.emoji}</span>
      <span class="ex-t"><span class="nm">${esc(ex.name)} <i class="info-dot" aria-hidden="true">i</i></span><span class="tg">${esc(targetText(ex, it.target))}${allDone ? ' · готово ✓' : ''}</span></span></button>
      <button class="icon-btn" data-act="ex-menu" data-a="${i}" aria-label="Действия: ${esc(ex.name)}">⋯</button>
    </header>
    ${last ? `<div class="last"><b>В прошлый раз</b> · ${fmtDateS(last.date)}: ${esc(setsText(ex, last.sets))}</div>` : '<div class="last">Первый раз: запиши стартовые цифры. Серые значения подставятся, если нажать ✓ с пустыми полями.</div>'}
    ${sug ? `<div class="sug">💡 ${esc(sug)}</div>` : ''}
    <div class="sets">${rows}</div>
    ${ex.type !== 'cardio' ? `<div class="set-ctl"><button class="btn sm ghost" data-act="set-add" data-a="${i}">+ подход</button>${it.sets.length > 1 ? `<button class="btn sm ghost" data-act="set-del" data-a="${i}">− подход</button>` : ''}</div>` : ''}
  </article>`;
}

    h += `<div class="pday-b${S.ui.justOpen === d.id ? ' just' : ''}">
      <div class="field"><label for="dn-${esc(d.id)}">Название</label><input id="dn-${esc(d.id)}" class="inp" data-dayname="${esc(d.id)}" value="${esc(d.name)}" maxlength="40" autocomplete="off"></div>
      <div class="field"><span class="flabel">День недели (если занят, дни поменяются местами)</span><div class="wdpick">${picks}</div></div>
      <div class="plist">${d.items.map((it, k) => planItem(d, it, k)).join('') || '<p class="empty">Пока пусто. Добавь упражнения.</p>'}</div>
      <button class="btn block dashed" data-act="plan-add" data-a="${esc(d.id)}">+ Добавить упражнение</button>
      ${S.active ? '' : `<button class="btn primary block" data-act="start-day" data-a="${esc(d.id)}">Начать эту тренировку</button>`}
    </div>`;
  }
  return h + '</article>';
}

function planItem(d, it, k) {
  const ex = getEx(it.ex), id = esc(d.id);
  return `<div class="pitem">
    <button class="main" data-act="plan-ex-info" data-a="${id}" data-b="${k}"><span class="badge sm" style="--g:${gvar(ex.group)}" data-morph="ex" aria-hidden="true">${grp(ex.group).emoji}</span><span class="txt"><span class="t">${esc(ex.name)}</span><span class="s">${esc(targetText(ex, it.target))} · техника</span></span></button>
    <div class="ord">
      <button class="icon-btn" data-act="plan-item-up" data-a="${id}" data-b="${k}" aria-label="Поднять выше" ${k === 0 ? 'disabled' : ''}>↑</button>
      <button class="icon-btn" data-act="plan-item-down" data-a="${id}" data-b="${k}" aria-label="Опустить ниже" ${k === d.items.length - 1 ? 'disabled' : ''}>↓</button>
      <button class="icon-btn" data-act="plan-item-del" data-a="${id}" data-b="${k}" aria-label="Убрать из плана">✕</button>
    </div>
  </div>`;
}

/* ======================================================================
   ЭКРАН «ПРОГРЕСС»
   ====================================================================== */
function viewProgress() {
  return topBar('Прогресс') + progressTiles() + weightCard() + waistCard() + cardioCard() + recordsCard() + historyCard();
}

function progressTiles() {
  const today = todayISO(), wsd = weekStart(today);
  const total = IX.workouts.length;
  const d30 = IX.workouts.filter(w => daysBetween(w.date, today) < 30).length;
  const streak = weekStreak(today, S.profile.mode);
  const vol = IX.workouts.filter(w => w.date >= wsd).reduce((a, w) => a + sessionStats(w).vol, 0);
  return `<div class="tiles">
    <div class="tile"><span class="lbl">Тренировок</span><span class="val">${countSpan(total)}</span><span class="tile-s">всего</span></div>
    <div class="tile"><span class="lbl">За 30 дней</span><span class="val">${countSpan(d30)}</span><span class="tile-s">${plural(d30, 'тренировка', 'тренировки', 'тренировок')}</span></div>
    <div class="tile"><span class="lbl">Серия</span><span class="val">${streak ? '<span class="flame">🔥</span> ' : ''}${countSpan(streak)}</span><span class="tile-s">${plural(streak, 'неделя', 'недели', 'недель')} по плану</span></div>
    <div class="tile"><span class="lbl">Объём</span><span class="val">${fmtTonnes(vol)}</span><span class="tile-s">на этой неделе</span></div>
  </div>`;
}

function noteBox(cls, icon, text) { return `<div class="note ${cls}"><i aria-hidden="true">${icon}</i><span>${esc(text)}</span></div>`; }

function weightCard() {
  const p = S.profile, ws = weights();
  let h = `<section class="card"><div class="card-h"><div><h3>Вес тела</h3><p class="sub">Цель: чистый набор, +${fmtNum(p.rate, 2)} кг в месяц</p></div><button class="btn sm" data-act="body-add">+ Замер</button></div>`;
  if (!ws.length) return h + '<p class="empty">Добавь первый замер, и здесь появится график с коридором цели.</p></section>';
  const an = bulkAnalysis(), last = ws[ws.length - 1];
  h += `<div class="kpi"><span class="kpi-v">${countSpan(last.w, 1)} <small>кг</small></span>${an.rate != null ? `<span class="pill ${an.cls}">${fmtSigned(an.rate, 2)} кг/мес · ${esc(an.status)}</span>` : `<span class="delta">${ws.length > 1 ? fmtSigned(last.w - ws[0].w) + ' кг с ' + fmtDateS(ws[0].d) : 'первый замер'}</span>`}</div>`;
  const startT = dateOf(p.startDate).getTime();
  const endT = Math.max(dateOf(todayISO()).getTime() + 21 * DAY, dateOf(last.d).getTime());
  const band = [];
  for (let t = Math.min(startT, dateOf(ws[0].d).getTime()); t < endT; t += 7 * DAY) band.push(bandAt(t));
  band.push(bandAt(endT));
  h += chartSlot({ kind: 'line', points: ws.map(e => ({ x: dateOf(e.d).getTime(), y: e.w, label: fmtDateS(e.d) })), band, fmt: v => `${fmtNum(v)} кг`, h: 180, minSpan: 2, aria: `График веса тела, последний замер ${fmtNum(last.w)} кг` });
  h += '<div class="legend"><span><i class="lk-line"></i>Вес</span><span><i class="lk-band"></i>Коридор цели</span></div>';
  h += noteBox(an.cls, an.icon, an.note);
  return h + '</section>';
}

function bodyText(e) {
  const p = [];
  if (e.w != null) p.push(`${fmtNum(e.w)} кг`);
  if (e.waist != null) p.push(`талия ${fmtNum(e.waist)}`);
  if (e.chest != null) p.push(`грудь ${fmtNum(e.chest)}`);
  if (e.arm != null) p.push(`бицепс ${fmtNum(e.arm)}`);
  if (e.thigh != null) p.push(`бедро ${fmtNum(e.thigh)}`);
  return p.join(' · ');
}

function waistCard() {
  const es = S.body.filter(e => e.waist != null).sort(byD);
  let h = '<section class="card"><div class="card-h"><div><h3>Талия и замеры</h3><p class="sub">Талия показывает, куда идёт набор: в мышцы или в живот</p></div></div>';
  if (es.length) {
    const l = es[es.length - 1], f = es[0];
    h += `<div class="kpi"><span class="kpi-v">${fmtNum(l.waist)} <small>см</small></span>${es.length > 1 ? `<span class="delta">${fmtSigned(l.waist - f.waist)} см с ${fmtDateS(f.d)}</span>` : '<span class="delta">первый замер талии</span>'}</div>`;
    if (es.length > 1) h += chartSlot({ kind: 'line', points: es.map(e => ({ x: dateOf(e.d).getTime(), y: e.waist, label: fmtDateS(e.d) })), fmt: v => `${fmtNum(v)} см`, h: 150, minSpan: 2, aria: `График обхвата талии, сейчас ${fmtNum(l.waist)} см` });
  } else {
    h += '<p class="empty">Добавь обхват талии в замере. Так будет видно, что набор идёт в мышцы, а не в живот.</p>';
  }
  const rows = [['chest', 'Грудь'], ['arm', 'Бицепс'], ['thigh', 'Бедро']].map(([k, n]) => {
    const xs = S.body.filter(e => e[k] != null).sort(byD);
    if (!xs.length) return '';
    const l = xs[xs.length - 1], f = xs[0];
    return `<div class="kv"><span>${n}</span><b>${fmtNum(l[k])} см${xs.length > 1 ? `<em>${fmtSigned(l[k] - f[k])}</em>` : ''}</b></div>`;
  }).join('');
  if (rows) h += `<div class="kvs">${rows}</div>`;
  const all = S.body.slice().sort(byD).reverse();
  if (all.length) {
    const shown = S.ui.showAllBody ? all : all.slice(0, 4);
    h += `<div><div class="chart-t">История замеров</div><div class="list">${shown.map(e => `<button class="li" data-act="body-edit" data-a="${e.d}"><span class="main"><span class="t">${fmtDate(e.d)}</span><span class="s">${esc(bodyText(e))}</span></span><span class="chev" aria-hidden="true">›</span></button>`).join('')}</div></div>`;
    if (all.length > 4) h += `<button class="link" data-act="toggle-body">${S.ui.showAllBody ? 'Свернуть' : `Вся история (${all.length})`}</button>`;
  }
  return h + '</section>';
}

const metricVal = (ex, s) => (ex.metric === 'pace' ? s.min / s.km : ex.metric === 'pace500' ? s.min / (s.km * 2) : s.km / (s.min / 60));
const metricTitle = ex => (ex.metric === 'pace' ? 'Темп, мин/км (выше на графике — быстрее)'
  : ex.metric === 'pace500' ? 'Темп, мин/500 м (выше на графике — быстрее)' : 'Средняя скорость, км/ч');
const metricFmt = (ex, v) => (ex.metric === 'pace' ? `${fmtPace(v)} /км` : ex.metric === 'pace500' ? `${fmtPace(v)} /500 м` : `${fmtNum(v)} км/ч`);
const metricTick = (ex, v) => (ex.metric === 'speed' || !ex.metric ? fmtNum(v) : fmtPace(v));

function cardioCard() {
  const machines = allExercises().filter(e => e.type === 'cardio' && IX.byEx[e.id]);
  let h = '<section class="card"><div class="card-h"><div><h3>Кардио и выносливость</h3><p class="sub">Дистанция и темп по каждому тренажёру</p></div></div>';
  if (!machines.length) return h + '<p class="empty">Кардио есть в конце каждой тренировки. После первой здесь появятся дистанция и темп.</p></section>';
  const sel = S.ui.cardioEx && machines.some(m => m.id === S.ui.cardioEx) ? S.ui.cardioEx
    : machines.slice().sort((a, b) => IX.byEx[b.id].sessions.length - IX.byEx[a.id].sessions.length)[0].id;
  const ex = getEx(sel);
  if (machines.length > 1) h += `<div class="chips scroll" role="group" aria-label="Тренажёр">${machines.map(m => `<button class="fchip" data-act="cardio-ex" data-a="${esc(m.id)}" aria-pressed="${m.id === sel}">${esc(m.name)}</button>`).join('')}</div>`;
  const ss = IX.byEx[sel].sessions.map(s => ({ date: s.date, min: s.sets.reduce((a, x) => a + (x.min || 0), 0), km: s.sets.reduce((a, x) => a + (x.km || 0), 0) }));
  const today = todayISO();
  const l28 = ss.filter(s => daysBetween(s.date, today) < 28);
  const km28 = l28.reduce((a, s) => a + s.km, 0), min28 = l28.reduce((a, s) => a + s.min, 0);
  const bestKm = Math.max(0, ...ss.map(s => s.km));
  h += `<div class="kvs"><div class="kv"><span>За 4 недели</span><b>${fmtNum(km28, 1)} км · ${min28 ? fmtDur(min28 * 60000) : '0 мин'}</b></div>${bestKm ? `<div class="kv"><span>Самая длинная дистанция</span><b>${fmtNum(bestKm, 2)} км</b></div>` : ''}</div>`;
  const recent = ss.slice(-12), withKm = recent.filter(s => s.km > 0 && s.min > 0);
  if (withKm.length) {
    h += `<div class="chart-t">Дистанция за тренировку, км</div>` + chartSlot({ kind: 'bar', items: withKm.map(s => ({ v: s.km, label: fmtDateS(s.date), tip: `${fmtDateS(s.date)} · ${s.min} мин` })), fmt: v => `${fmtNum(v, 2)} км`, h: 150, aria: 'Дистанция по тренировкам' });
    if (withKm.length > 1) {
      h += `<div class="chart-t">${metricTitle(ex)}</div>` + chartSlot({ kind: 'line', points: withKm.map(s => ({ x: dateOf(s.date).getTime(), y: metricVal(ex, s), label: fmtDateS(s.date) })), invert: ex.metric === 'pace' || ex.metric === 'pace500', fmt: v => metricFmt(ex, v), yTick: v => metricTick(ex, v), h: 150, minSpan: ex.metric === 'speed' ? 2 : 0.5, aria: metricTitle(ex) });
    }
  } else {
    h += '<p class="empty">Записывай не только минуты, но и километры, и появятся графики дистанции и темпа.</p>';
  }
  h += `<div class="list">${recent.slice().reverse().slice(0, 5).map(s => `<div class="li"><span class="main"><span class="t">${fmtDate(s.date)}</span><span class="s">${s.min} мин${s.km ? ' · ' + fmtNum(s.km, 2) + ' км' : ''}</span></span><span class="r">${s.km > 0 && s.min > 0 ? esc(metricFmt(ex, metricVal(ex, s))) : ''}</span></div>`).join('')}</div>`;
  return h + '</section>';
}

function recordsListHTML(limit) {
  const ids = Object.keys(IX.byEx).filter(id => getEx(id).type !== 'cardio');
  if (!ids.length) return '<p class="empty">Сделай первую тренировку, и здесь появятся лучшие подходы.</p>';
  const lastDate = id => IX.byEx[id].sessions[IX.byEx[id].sessions.length - 1].date;
  ids.sort((a, b) => lastDate(b).localeCompare(lastDate(a)));
  const shown = limit ? ids.slice(0, limit) : ids;
  let h = `<div class="list">${shown.map(id => {
    const ex = getEx(id), b = IX.byEx[id].best;
    const extra = ex.type === 'weight' && b.set.w > 0 && b.set.r > 1 ? ` · ≈${fmtNum(b.value, 0)} кг 1ПМ` : '';
    return `<button class="li" data-act="open-ex" data-a="${esc(id)}"><span class="badge sm" style="--g:${gvar(ex.group)}" data-morph="ex" aria-hidden="true">${grp(ex.group).emoji}</span><span class="main"><span class="t">${esc(ex.name)}</span><span class="s">${esc(setTextLong(ex, b.set))}${extra} · ${fmtDateS(b.date)}</span></span><span class="chev" aria-hidden="true">›</span></button>`;
  }).join('')}</div>`;
  if (limit && ids.length > limit) h += `<button class="link" data-act="toggle-rec">Все упражнения (${ids.length})</button>`;
  return h;
}

function recordsCard() {
  return `<section class="card"><div class="card-h"><div><h3>Рекорды</h3><p class="sub">Лучший подход по каждому упражнению</p></div></div>${recordsListHTML(S.ui.showAllRec ? 0 : 8)}</section>`;
}

function historyCard() {
  const ws = IX.workouts.slice().reverse();
  if (!ws.length) return '';
  const shown = S.ui.showAllHist ? ws : ws.slice(0, 6);
  let h = `<section class="card"><div class="card-h"><div><h3>История тренировок</h3></div></div><div class="list">${shown.map(w => {
    const st = sessionStats(w);
    const right = st.vol ? fmtTonnes(st.vol) : st.km ? `${fmtNum(st.km, 1)} км` : '';
    return `<button class="li" data-act="open-workout" data-a="${esc(w.id)}"><span class="dot-day" style="--day:var(--c-${w.color || 'mint'})" aria-hidden="true"></span><span class="main"><span class="t">${esc(w.name)}</span><span class="s">${fmtDate(w.date)} · ${fmtDur(w.end - w.start)}${st.prs ? ' · 🏆 ' + st.prs : ''}</span></span><span class="r">${right}</span></button>`;
  }).join('')}</div>`;
  if (ws.length > 6) h += `<button class="link" data-act="toggle-hist">${S.ui.showAllHist ? 'Свернуть' : `Все тренировки (${ws.length})`}</button>`;
  return h + '</section>';
}

const VIA = {
  device: ['Этот телефон', 'Данные хранятся в памяти этого устройства и работают без интернета. Раз в неделю делай резервную копию: Экспорт.'],
  memory: ['Без сохранения', 'Этот браузер не даёт сохранять данные: после закрытия они пропадут. Сделай резервную копию.'],

function rateChips(cur, act) {
  return `<div class="chips rate" role="group" aria-label="Темп набора">${[0.25, 0.5, 0.75, 1].map(v => `<button class="fchip" data-act="${act}" data-a="${v}" aria-pressed="${cur === v}">+${fmtNum(v, 2)} кг</button>`).join('')}</div>
    <p class="sub">Советуем +0,25–0,5 кг: так мышцы растут, а пресс остаётся заметным.</p>`;
}

  const via = VIA[u.via] || VIA.device;

  <section class="card acct"><span class="ava" aria-hidden="true">${name ? esc(name[0].toUpperCase()) : '💪'}</span><div class="main"><div class="t">${esc(name || 'Спортсмен')}</div><div class="s">Хранится: ${via[0]}</div></div></section>
  <div class="grp"><h2 class="sec-title">Параметры</h2><section class="card">

      <div class="field"><label for="pfW">Стартовый вес, кг</label><input id="pfW" class="inp" inputmode="decimal" autocomplete="off" data-pf="startW" value="${esc(fmtIn(p.startW))}"></div>
    </div>
    <div class="field"><label for="pfD">Дата старта</label><input id="pfD" class="inp" type="date" data-pf="startDate" value="${esc(p.startDate)}" max="${todayISO()}"></div>
    <div class="kvs"><div class="kv"><span>Текущий вес</span><b>${fmtNum(lw)} кг</b></div><div class="kv"><span>Индекс массы тела</span><b>${fmtNum(bmi)} · ${bmiLabel(bmi)}</b></div></div>
  </section></div>
  <div class="grp"><h2 class="sec-title">Цель: чистый набор</h2><section class="card"><p class="sub">Темп прибавки веса в месяц. По нему строится коридор на графике веса.</p>${rateChips(p.rate, 'rate')}</section></div>
  <div class="grp"><h2 class="sec-title">Режим тренировок</h2>${modeSwitch(p.mode)}</div>
  <div class="grp"><h2 class="sec-title">Данные</h2><section class="card">
    <div class="kvs"><div class="kv"><span>Где хранятся</span><b>${via[0]}</b></div><div class="kv"><span>Статус</span>${syncChip()}</div></div>

  <button class="btn ghost block danger" data-act="reset-all">Сбросить все данные</button>
  <p class="foot">${LOGO}<span>Подход · версия 1.0</span></p>`;

function finishOnboarding() {
  const o = S.ui.onb;
  const h = parseNum($('#onbH') && $('#onbH').value), w = parseNum($('#onbW') && $('#onbW').value);
  if (!(h >= 120 && h <= 230)) { toast('Рост должен быть от 120 до 230 см'); return; }
  if (!(w >= 30 && w <= 250)) { toast('Вес должен быть от 30 до 250 кг'); return; }
  if (!o.mode) { toast('Выбери 3 или 4 дня'); return; }
  const today = todayISO();
  S.profile = { v: 1, height: h, startW: w, startDate: today, rate: o.rate, mode: o.mode };
  S.plans = sanitizePlans(S.plans);
  const e = S.body.find(x => x.d === today);
  if (e) e.w = w; else S.body.push({ d: today, w });
  S.body.sort(byD);
  persist.profile(); persist.plans(); persist.body();
  rebuildIndex();
  S.tab = 'today';
  render();
  window.scrollTo(0, 0);
  toast('Готово! План на неделю уже ждёт 💪');
}

function refreshSheet(html) {

/* Цель упражнения в плане */
const REP_CHOICES = ['5', '5–8', '6–8', '6–10', '8–10', '8–12', '10–12', '10–15', '12–15', '15–20', '20'];
function openTarget(dayId, k) {
  const d = dayById(dayId);
  if (!d || !d.items[k]) return;
  const ex = getEx(d.items[k].ex);
  S.ui.tgt = { dayId, k, t: { ...(d.items[k].target || defaultTarget(ex)) } };
  openSheet(tgtHTML());
}
function stepper(label, v, key, step) {
  return `<div class="stepper"><span class="flabel">${label}</span><div class="st">
    <button class="st-b" data-act="tgt-step" data-a="${key}" data-b="${-step}" aria-label="${label}: меньше">−</button>
    <output aria-live="polite">${v}</output>
    <button class="st-b" data-act="tgt-step" data-a="${key}" data-b="${step}" aria-label="${label}: больше">+</button></div></div>`;
}
function tgtHTML() {
  const { dayId, k, t } = S.ui.tgt, d = dayById(dayId), ex = getEx(d.items[k].ex);
  let body;
  if (ex.type === 'cardio') body = stepper('Минуты', t.min || 15, 'min', 5);
  else {
    body = stepper('Подходы', t.sets || 3, 'sets', 1);
    if (ex.type === 'time') body += stepper('Секунды', t.sec || 45, 'sec', 5);
    else body += `<div class="field"><span class="flabel">Повторы</span><div class="chips">${REP_CHOICES.map(r => `<button class="fchip" data-act="tgt-reps" data-a="${r}" aria-pressed="${t.reps === r}">${r}</button>`).join('')}</div>
      <input id="tgtReps" class="inp" value="${esc(t.reps || '')}" placeholder="Свой вариант, например 6–10" maxlength="12" autocomplete="off" aria-label="Свой диапазон повторов"></div>`;
  }
  return sheetHead(ex.name, `Цель в плане «${d.name}»`) + body + '<button class="btn primary block" data-act="tgt-save">Сохранить</button>';
}
function tgtStep(key, delta) {
  const t = S.ui.tgt.t;
  const lim = { sets: [1, 10, 3], sec: [10, 300, 45], min: [5, 120, 15] }[key];
  t[key] = clamp((t[key] || lim[2]) + Number(delta), lim[0], lim[1]);
  refreshSheet(tgtHTML());
}
function saveTarget() {
  const { dayId, k, t } = S.ui.tgt, d = dayById(dayId);
  if (!d || !d.items[k]) { closeSheet(); return; }
  const ex = getEx(d.items[k].ex);
  if (ex.type !== 'cardio' && ex.type !== 'time') {
    t.reps = String(t.reps || '').trim().replace(/-/g, '–');
    if (!/\d/.test(t.reps)) t.reps = defaultTarget(ex).reps;
  }
  d.items[k].target = t;
  persist.plans();

  toast('Цель сохранена');

/* Замеры тела */
const BODY_FIELDS = [['bmW', 'w', 'Вес, кг', [25, 250]], ['bmWaist', 'waist', 'Талия, см', [40, 200]], ['bmChest', 'chest', 'Грудь, см', [50, 200]], ['bmArm', 'arm', 'Бицепс, см', [15, 70]], ['bmThigh', 'thigh', 'Бедро, см', [30, 110]]];
function openBody(d) {
  const e = S.body.find(x => x.d === d) || { d };
  const exists = S.body.some(x => x.d === d);
  const lastOf = k => { const xs = S.body.filter(x => x[k] != null).sort(byD); return xs.length ? xs[xs.length - 1][k] : null; };
  const f = ([id, k, label]) => `<div class="field"><label for="${id}">${label}</label><input id="${id}" class="inp" inputmode="decimal" autocomplete="off" value="${esc(fmtIn(e[k]))}" placeholder="${esc(fmtIn(lastOf(k)))}"></div>`;
  openSheet(sheetHero(exists ? `Замер ${fmtDate(d)}` : 'Новый замер', 'Вес, талия и обхваты', `<div class="icon-tile obj-tile" data-mt="scale">${obj('scale')}</div>`)
    + `<div class="field"><label for="bmD">Дата</label><input id="bmD" class="inp" type="date" value="${d}" max="${todayISO()}"></div>`
    + f(BODY_FIELDS[0])
    + `<div class="grid2">${BODY_FIELDS.slice(1).map(f).join('')}</div>`
    + '<p class="sheet-p small">Взвешивайся утром до еды. Талию меряй на уровне пупка, на спокойном выдохе. Можно заполнить только часть полей.</p>'
    + `<div class="sheet-a"><button class="btn primary block" data-act="body-save" data-a="${d}">Сохранить</button>${exists ? `<button class="btn ghost block danger" data-act="body-del" data-a="${d}">Удалить замер</button>` : ''}</div>`);
}
function saveBody(orig) {
  const d = ($('#bmD') && $('#bmD').value) || todayISO();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d > todayISO()) { toast('Проверь дату'); return; }
  const vals = {};
  for (const [id, k, label, [lo, hi]] of BODY_FIELDS) {
    const v = parseNum($('#' + id) && $('#' + id).value);
    if (v != null && (v < lo || v > hi)) { toast(`Проверь поле «${label}»`); $('#' + id).focus(); return; }
    vals[k] = v;
  }
  if (Object.values(vals).every(v => v == null)) { toast('Заполни хотя бы одно поле'); return; }
  if (orig && orig !== d) S.body = S.body.filter(x => x.d !== orig);
  let e = S.body.find(x => x.d === d);
  if (!e) { e = { d }; S.body.push(e); }
  for (const k of Object.keys(vals)) { if (vals[k] != null) e[k] = vals[k]; else delete e[k]; }
  S.body.sort(byD);
  persist.body();
  closeSheet();
  rerender();
  toast('Замер сохранён');
}
function deleteBody(d) {
  S.body = S.body.filter(x => x.d !== d);
  persist.body();
  closeSheet();
  rerender();
  toast('Замер удалён');
}

/* Завершение тренировки */
function openFinish() {
  const a = S.active, st = sessionStats(a);
  if (!st.done) {
    openConfirm({ title: 'Нет выполненных подходов', text: 'Отметь галочкой хотя бы один подход или удали эту тренировку.', ok: 'Удалить тренировку', act: 'discard-confirm', danger: true });
    return;
  }
  const left = st.sets - st.done;
  const tiles = [sumTile('Время', fmtDur(Date.now() - a.start)), sumTile('Подходы', left ? `${st.done} из ${st.sets}` : String(st.done))];
  if (st.vol) tiles.push(sumTile('Объём', fmtTonnes(st.vol)));
  if (st.km) tiles.push(sumTile('Кардио', `${fmtNum(st.km, 2)} км`)); else if (st.cmin) tiles.push(sumTile('Кардио', `${st.cmin} мин`));
  if (st.prs) tiles.push(sumTile('Рекорды', `🏆 ${st.prs}`));
  openSheet(sheetHead('Завершить тренировку?') + `<div class="sum-grid">${tiles.join('')}</div>`
    + (left ? `<p class="sheet-p">Неотмеченные подходы (${left}) не сохранятся.</p>` : '')
    + '<div class="sheet-a"><button class="btn primary block big" data-act="finish-confirm">Сохранить тренировку</button><button class="btn ghost block" data-act="close-sheet">Продолжить</button></div>');
}

/* История и рекорд упражнения */
function exMetric(ex, rec) {
  const repsOnly = ex.type === 'weight' && rec.sessions.every(s => s.sets.every(x => !(x.w > 0)));
  if (ex.type === 'cardio') return { title: 'Дистанция, км', val: s => s.sets.reduce((a, x) => a + (x.km || 0), 0), fmt: v => `${fmtNum(v, 2)} км` };
  if (ex.type === 'time') return { title: 'Лучшее время, с', val: s => s.value, fmt: v => `${fmtNum(v, 0)} с` };
  if (repsOnly) return { title: 'Повторы в лучшем подходе', val: s => Math.max(...s.sets.map(x => x.r || 0)), fmt: v => `${fmtNum(v, 0)} повт.` };
  if (ex.type === 'bodyweight') return { title: `Оценка силы: 1ПМ с весом тела ${fmtNum(refBW())} кг`, val: s => s.value, fmt: v => `${fmtNum(v, 0)} кг` };
  return { title: 'Оценка 1ПМ, кг', val: s => s.value, fmt: v => `${fmtNum(v, 1)} кг` };
}
/* Экспорт, импорт, сброс */
function exportPayload() {

  for (const ym of Object.keys(S.food)) data['food_' + ym] = S.food[ym];

}
async function doExport() {

function doImport() {
  let obj;
  try { obj = JSON.parse(($('#impText') && $('#impText').value) || ''); }
  catch (e) { toast('Текст не читается. Нужна копия из «Подхода» целиком'); return; }
  if (!obj || obj.app !== 'podkhod' || !obj.data || typeof obj.data !== 'object') { toast('Это не резервная копия «Подхода»'); return; }
  const d = obj.data;
  const okKey = k => k === 'profile' || k === 'plans' || k === 'custom' || k === 'body' || k === 'nutri' || /^(log|food)_\d{4}_\d{2}$/.test(k);
  const current = ['profile', 'plans', 'custom', 'body', 'nutri', ...Object.keys(S.logs).map(ym => 'log_' + ym), ...Object.keys(S.food).map(ym => 'food_' + ym)];
  for (const k of current) if (!(k in d)) Store.remove(k);
  const all = {};
  for (const k of Object.keys(d)) if (okKey(k) && d[k] != null) { all[k] = d[k]; Store.save(k, d[k]); }
  if (S.active) all.active = S.active;
  applyData(all);
  closeSheet();
  go('today');
  toast('Данные загружены из копии');
}
function openReset() {
  openSheet(sheetHead('Сбросить все данные?') + '<p class="sheet-p">Удалятся профиль, план, тренировки, замеры и питание. Это нельзя отменить. Чтобы подтвердить, напиши слово «удалить».</p>'
    + '<input id="rstText" class="inp" autocomplete="off" placeholder="удалить" aria-label="Подтверждение">'
    + '<button class="btn danger-fill block" id="rstBtn" data-act="reset-confirm" disabled>Удалить всё</button>');
}
function doResetAll() {
  for (const k of ['profile', 'plans', 'custom', 'body', 'active', 'nutri', ...Object.keys(S.logs).map(ym => 'log_' + ym), ...Object.keys(S.food).map(ym => 'food_' + ym)]) Store.remove(k);
  Object.assign(S, { profile: null, plans: sanitizePlans(null), custom: [], body: [], active: null, logs: {}, nutri: null, food: {}, tab: 'today' });
  S.ui.onb = { mode: 0, rate: 0.5, height: 169, weight: 68 };
  stopSessionExtras();
  rebuildIndex();
  closeSheet();
  render();
  window.scrollTo(0, 0);
  toast('Все данные удалены');
}

function buildPict(svg, id) {

    const el = document.createElementNS(SVGNS, tag);

    svg.appendChild(el);

    else if (g.t === 'rect') mk('rect', 'pg-solid', { x: g.x, y: g.y, width: g.w, height: g.h, rx: 2 });
    else if (g.t === 'circle') mk('circle', 'pg-gear', { cx: g.cx, cy: g.cy, r: g.r });

  if (P.A.e2) { seg('n', 'e2', 'pg-limb back'); seg('e2', 'w2', 'pg-limb back'); }
  seg('n', 'p', 'pg-torso'); seg('p', 'k', 'pg-limb'); seg('k', 'f', 'pg-limb');
  if (P.A.t) seg('f', 't', 'pg-limb');
  seg('n', 'e', 'pg-limb'); seg('e', 'w', 'pg-limb');
  const head = mk('circle', 'pg-head', { r: 7 });
  for (const g of P.gear) {
    if (g.t === 'pad' || g.t === 'wheel' || g.t === 'plate') dyn.push({ g, el: mk('circle', g.t === 'pad' ? 'pg-solid' : 'pg-imp', { r: g.r }) });
    else if (g.t === 'sled') dyn.push({ g, el: mk('rect', 'pg-solid', { width: g.w, height: g.h, rx: 2 }) });
    else if (g.t === 'handle') dyn.push({ g, el: mk('line', 'pg-gear', { 'stroke-width': 3 }) });

    imps.push({ at: 'w', el: mk('rect', 'pg-imp', { width: 14, height: 6, rx: 2 }), db: true });
    if (P.A.w2) imps.push({ at: 'w2', el: mk('rect', 'pg-imp', { width: 14, height: 6, rx: 2 }), db: true });

function setPose(m, pose) {
  const r = v => Math.round(v * 10) / 10;
  for (const s of m.segs) {
    const a = pose[s.a], b = pose[s.b];
    s.el.setAttribute('x1', r(a[0])); s.el.setAttribute('y1', r(a[1])); s.el.setAttribute('x2', r(b[0])); s.el.setAttribute('y2', r(b[1]));
  }
  m.head.setAttribute('cx', r(pose.h[0])); m.head.setAttribute('cy', r(pose.h[1]));
  for (const { g, el } of m.dyn) {
    if (g.t === 'cable') { const w = pose[g.to]; el.setAttribute('x1', g.x); el.setAttribute('y1', g.y); el.setAttribute('x2', r(w[0])); el.setAttribute('y2', r(w[1])); }
    else if (g.t === 'sled') { const j = pose[g.at]; el.setAttribute('x', r(j[0] - g.w / 2)); el.setAttribute('y', r(j[1] - g.h / 2 + (g.dy || 0))); }
    else if (g.t === 'handle') { const j = pose[g.at]; el.setAttribute('x1', r(j[0] - g.len / 2)); el.setAttribute('y1', r(j[1])); el.setAttribute('x2', r(j[0] + g.len / 2)); el.setAttribute('y2', r(j[1])); }
    else { const j = pose[g.at]; el.setAttribute('cx', r(j[0])); el.setAttribute('cy', r(j[1])); }
  }
  for (const im of m.imps) {
    const j = pose[im.at];
    if (im.db) { im.el.setAttribute('x', r(j[0] - 7)); im.el.setAttribute('y', r(j[1] - 3)); }
    else { im.el.setAttribute('cx', r(j[0])); im.el.setAttribute('cy', r(j[1])); }
  }
}
function lerpPose(A, B, k) {
  const o = {};
  for (const key of Object.keys(A)) o[key] = [A[key][0] + (B[key][0] - A[key][0]) * k, A[key][1] + (B[key][1] - A[key][1]) * k];

}
let pictRAF = 0;
function startPicts(root) {
  const models = [...root.querySelectorAll('svg.pict[data-pict]')].filter(s => PICT_OF[s.dataset.pict]).map(svg => ({ svg, m: buildPict(svg, svg.dataset.pict) }));
  cancelAnimationFrame(pictRAF);
  if (!models.length) return;
  models.forEach(({ m }) => setPose(m, m.P.A));
  if (reduceMotion()) return;
  const t0 = performance.now();
  const tick = t => {
    if (!models.some(x => x.svg.isConnected)) return;
    const ph = ((t - t0) / 2600) % 1;
    const k = 0.5 - 0.5 * Math.cos(ph * 2 * Math.PI);
    models.forEach(({ m }) => setPose(m, lerpPose(m.P.A, m.P.B, k)));
    pictRAF = requestAnimationFrame(tick);
  };
  pictRAF = requestAnimationFrame(tick);
}

function swapExercise(newId) {
  const c = S.ui.exCtx || {};

    const keep = nx.type === old.type ? it.target : null;
    if (it.sets.some(s => s.done)) {

  rerender();
}

const FOOD_BY = Object.fromEntries(FOODS.map(f => [f.id, f]));

const SURPLUS = { 0.25: 0.05, 0.5: 0.1, 0.75: 0.125, 1: 0.15 };

const allFoods = () => FOODS.concat(myFoods().map(f => Object.assign({ cat: 'mine', emo: '⭐' }, f)));

function getDay(d, create) {
  const ym = ymOf(d);
  if (!S.food[ym]) { if (!create) return { items: [], water: 0 }; S.food[ym] = {}; }
  if (!S.food[ym][d]) { if (!create) return { items: [], water: 0 }; S.food[ym][d] = { items: [], water: 0 }; }
  return S.food[ym][d];
}
function dayTotals(day) {
  const t = { k: 0, p: 0, fa: 0, c: 0 };
  for (const it of day.items || []) { t.k += it.k || 0; t.p += it.p || 0; t.fa += it.fa || 0; t.c += it.c || 0; }
  return t;
}
function isTrainingDay(d) {
  if (IX.workouts.some(w => w.date === d)) return true;
  return !!(S.plans && S.profile && S.plans[S.profile.mode].days.some(x => x.wd === weekday(d)));
}
function nutriTargets(d) {
  const p = S.profile, n = S.nutri || {};
  const w = latestWeight() || p.startW, age = n.age || 25;
  const bmr = 10 * w + 6.25 * p.height - 5 * age + (n.sex === 'f' ? -161 : 5);
  const act = (LIFE[n.life] || LIFE.mid)[1] + (p.mode === 4 ? 0.2 : 0.15);
  const tdee = bmr * act;
  const sp = SURPLUS[p.rate] != null ? SURPLUS[p.rate] : 0.1;
  const o = n.over || {};
  const kcal = o.kcal || Math.round((tdee * (1 + sp)) / 10) * 10;
  const prot = o.p || Math.round(w * 2);
  const fat = Math.round(w * 1);
  const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
  const train = isTrainingDay(d);
  const water = o.water || Math.round((w * 33) / 50) * 50 + (train ? 500 : 0);
  return { kcal, p: prot, fa: fat, c: carb, water, train, bmr: Math.round(bmr), tdee: Math.round(tdee), act, sp, w };
}
const fmtL = ml => `${fmtNum(ml / 1000, 2)} л`;
const amountText = (f, mult) => `${fmtNum(f.por * mult, f.unit === 'г' || f.unit === 'мл' ? 0 : 1)} ${f.unit}`;

/* Как добрать норму: 3 варианта на ближайший приём пищи */
function fillIdeas(day, tg) {
  const tot = dayTotals(day);
  const remP = tg.p - tot.p, remK = tg.kcal - tot.k;
  if (remK <= 60 && remP <= 6) return { done: true, remP, remK };
  const byProtein = remP > 8;
  // Порция на один приём пищи: не больше 50 г белка или 750 ккал
  const goalP = Math.min(remP, 50), goalK = Math.min(Math.max(remK, 150), 750);
  const pool = allFoods().filter(f => f.k > 0 && (byProtein ? f.p >= 12 : f.k >= 90));
  const ideas = pool.map(f => {
    let mult = byProtein ? goalP / f.p : goalK / f.k;
    mult = clamp(Math.round(mult * 2) / 2, 0.5, 3);
    if (byProtein) while (mult > 0.5 && f.k * mult > Math.max(remK, 0) + 150) mult -= 0.5;
    const k = f.k * mult, p = f.p * mult;
    const carbShare = (f.c * 4) / f.k, protShare = (f.p * 4) / f.k;
    const score = byProtein
      ? 1 - Math.abs(goalP - p) / goalP + protShare * 1.5 - Math.max(0, k - remK) / 500
      : 1 - Math.abs(goalK - k) / goalK + carbShare * 0.8 - protShare * 0.6;
    return { f, mult, k, p, score };
  }).sort((a, b) => b.score - a.score);
  const out = [], cats = new Set();
  for (const it of ideas) { if (out.length >= 3) break; if (cats.has(it.f.cat)) continue; cats.add(it.f.cat); out.push(it); }
  for (const it of ideas) { if (out.length >= 3) break; if (!out.includes(it)) out.push(it); }
  return { done: false, remP, remK, byProtein, ideas: out };
}

function addFood(d, f, mult, quiet) {
  const day = getDay(d, true), tg = nutriTargets(d);
  const before = dayTotals(day);
  const now = new Date();
  day.items.push({ id: uid('i'), src: f.id, n: f.name, e: f.emo || '🍽️', a: amountText(f, mult), k: Math.round(f.k * mult), p: r1n(f.p * mult), fa: r1n(f.fa * mult), c: r1n(f.c * mult), t: `${pad2(now.getHours())}:${pad2(now.getMinutes())}` });
  const after = dayTotals(day);
  let party = '';
  if (!day.pDone && before.p < tg.p && after.p >= tg.p) { day.pDone = true; party = 'Белок на сегодня закрыт! 💪'; }
  persist.food(ymOf(d));
  if (party) { confetti(); toast(party); } else if (!quiet) toast(`+ ${f.name}, ${Math.round(f.k * mult)} ккал`);
}
function addWater(d, ml) {
  const day = getDay(d, true), tg = nutriTargets(d);
  const before = day.water || 0;
  day.water = Math.max(0, before + ml);
  if (!day.wDone && before < tg.water && day.water >= tg.water) { day.wDone = true; confetti(); toast('Норма воды выполнена 💧'); }
  else if (ml > 0) haptic();
  persist.food(ymOf(d));
}

/* Кольцо калорий, полоски БЖУ и бутылка: плавно растут от прошлого значения */
const FOOD_PREV = {};
function growStyle(key, offNow, extra = '') {
  const prev = FOOD_PREV[key];
  FOOD_PREV[key] = offNow;
  return prev != null && Math.abs(prev - offNow) > 0.01 ? { cls: ' grow', from: prev } : { cls: '', from: offNow, extra };
}
function kcalRing(tot, tg, size = 'big') {
  const r = size === 'big' ? 80 : 21, C = 2 * Math.PI * r, frac = tg.kcal ? Math.min(1, tot.k / tg.kcal) : 0, off = C * (1 - frac);
  const g = growStyle('ring-' + size, off);
  const vb = size === 'big' ? 200 : 52, c = vb / 2;
  return `<svg class="kring-svg ${size}" viewBox="0 0 ${vb} ${vb}" aria-hidden="true"><circle class="ring-bg" cx="${c}" cy="${c}" r="${r}"/>${frac > 0 ? `<circle class="ring-fg${g.cls}" cx="${c}" cy="${c}" r="${r}" style="--c:${C.toFixed(1)};--off:${off.toFixed(1)};--from:${(+g.from).toFixed(1)}"/>` : ''}</svg>`;
}
function macroBar(label, val, target, cls) {
  const pct = target ? Math.min(100, (val / target) * 100) : 0;
  const g = growStyle('bar-' + cls, pct);
  return `<div class="mbar ${cls}"><div class="mbar-h"><span>${label}</span><b>${fmtNum(val, 0)}<small> / ${fmtNum(target, 0)} г</small></b></div><div class="track"><i class="${g.cls.trim()}" style="--w:${pct.toFixed(1)}%;--w0:${(+g.from).toFixed(1)}%"></i></div></div>`;
}
let bottleSeq = 0;
function bottle(ml, target) {
  const frac = target ? Math.min(1, ml / target) : 0, top = 126 - frac * 100;
  const g = growStyle('bottle', top);
  const id = 'bclip' + (++bottleSeq);
  const shape = 'M31 4h18v12c0 4 15 9 15 24v74c0 7-6 13-13 13H29c-7 0-13-6-13-13V40c0-15 15-20 15-24z';
  return `<svg class="bottle" viewBox="0 0 80 130" aria-hidden="true"><defs><clipPath id="${id}"><path d="${shape}"/></clipPath></defs>
    <g clip-path="url(#${id})"><rect class="b-bg" x="0" y="0" width="80" height="130"/>
    <g class="b-water${g.cls}" style="--y:${top.toFixed(1)}px;--y0:${(+g.from).toFixed(1)}px"><path class="b-wave" d="M0 6Q10 0 20 6T40 6T60 6T80 6T100 6T120 6T140 6T160 6V140H0Z"/></g></g>
    <path class="b-glass" d="${shape}"/><rect class="b-cap" x="29" y="0" width="22" height="7" rx="3"/></svg>`;
}

function recentFoods() {
  const seen = new Set(), out = [];
  const days = Object.values(S.food).flatMap(m => Object.entries(m)).sort((a, b) => b[0].localeCompare(a[0]));
  for (const [, day] of days) for (const it of (day.items || []).slice().reverse()) {
    if (it.src && getFood(it.src) && !seen.has(it.src)) { seen.add(it.src); out.push(getFood(it.src)); }
    if (out.length >= 8) return out;
  }
  return out;
}

const NB = '\u00a0';
function bju(p, fa, c) { return `Б${NB}${fmtNum(p, 0)} · Ж${NB}${fmtNum(fa, 0)} · У${NB}${fmtNum(c, 0)}`; }

function weekFoodCard(d) {
  const days = Array.from({ length: 7 }, (_, i) => addDays(d, i - 6));
  const vals = days.map(x => ({ d: x, t: dayTotals(getDay(x)), tg: nutriTargets(x) }));
  if (!vals.some(v => v.t.k > 0)) return '';
  const logged = vals.filter(v => v.t.k > 0);

/* ======================================================================
   ГРАФИКИ (SVG, без библиотек)
   ====================================================================== */
const CHARTS = new Map();
let chartSeq = 0;
function chartSlot(cfg) {
  const id = 'ch' + (++chartSeq);
  CHARTS.set(id, cfg);
  return `<div class="chart" data-chart="${id}" tabindex="0" role="img" aria-label="${esc(cfg.aria || 'График')}"></div>`;
}
function mountCharts(root, animate) {
  (root || document).querySelectorAll('[data-chart]').forEach(el => {
    const c = CHARTS.get(el.dataset.chart);
    if (!c) return;
    try { (c.kind === 'bar' ? drawBars : drawLine)(el, c, !!animate); } catch (e) { console.error('chart', e); }
  });
}
function niceTicks(min, max, n = 4) {
  if (!isFinite(min) || !isFinite(max)) { min = 0; max = 1; }
  if (max - min < 1e-9) { min -= 1; max += 1; }
  const raw = (max - min) / Math.max(1, n - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step + 1e-9) * step;
  let hi = Math.ceil(max / step - 1e-9) * step;
  if (hi <= lo) hi = lo + step;
  const ticks = [];
  for (let k = 0; lo + k * step <= hi + step * 1e-6; k++) ticks.push(+(lo + k * step).toFixed(6));
  return { lo, hi, ticks };
}
const r1 = v => Math.round(v * 10) / 10;

function wireTooltip(host, W, marks, cross) {
  const svg = host.querySelector('svg'), tt = host.querySelector('.tt');
  const xh = svg.querySelector('.xh'), fd = svg.querySelector('.dot-focus'), bars = svg.querySelectorAll('.bar');
  let cur = -1;
  const show = i => {
    if (i < 0 || i >= marks.length) return;
    cur = i;
    const m = marks[i];
    if (cross && xh) {
      xh.setAttribute('x1', m.x); xh.setAttribute('x2', m.x); xh.setAttribute('visibility', 'visible');
      fd.setAttribute('cx', m.x); fd.setAttribute('cy', m.y); fd.setAttribute('visibility', 'visible');
    }
    bars.forEach((b, k) => b.classList.toggle('on', k === i));
    tt.textContent = '';
    const b = document.createElement('b'); b.textContent = m.main;
    const sp = document.createElement('span'); sp.textContent = ' · ' + m.sub;
    tt.append(b, sp);
    tt.classList.add('on');
    const k = svg.getBoundingClientRect().width / W;
    const tw = tt.offsetWidth, hw = host.clientWidth;
    tt.style.left = clamp(m.x * k, tw / 2, Math.max(tw / 2, hw - tw / 2)) + 'px';
    tt.style.top = m.y * k + 'px';
    tt.classList.toggle('below', m.y * k < 44);
  };
  const hide = () => {
    cur = -1;
    if (xh) { xh.setAttribute('visibility', 'hidden'); fd.setAttribute('visibility', 'hidden'); }
    bars.forEach(b => b.classList.remove('on'));
    tt.classList.remove('on');
  };
  const nearest = cx => {
    const r = svg.getBoundingClientRect(), x = ((cx - r.left) / r.width) * W;
    let bi = 0, bd = Infinity;
    marks.forEach((m, i) => { const d = Math.abs(m.x - x); if (d < bd) { bd = d; bi = i; } });
    return bi;
  };
  svg.onpointermove = e => show(nearest(e.clientX));
  svg.onpointerdown = e => show(nearest(e.clientX));
  svg.onpointerleave = e => { if (e.pointerType === 'mouse') hide(); };
  host.onkeydown = e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    show(cur < 0 ? marks.length - 1 : clamp(cur + (e.key === 'ArrowRight' ? 1 : -1), 0, marks.length - 1));
  };
  host.onfocus = () => { if (cur < 0) show(marks.length - 1); };
  host.onblur = hide;
}

function drawLine(host, c, animate) {
  const pts = c.points.filter(p => isFinite(p.y)).sort((a, b) => a.x - b.x);
  if (!pts.length) { host.innerHTML = ''; return; }
  const W = Math.max(240, Math.round(host.getBoundingClientRect().width || 320));
  const H = c.h || 170, L = 40, R = 14, T = 16, B = 24, iw = W - L - R, ih = H - T - B;
  const band = c.band || [];
  const xs = pts.map(p => p.x).concat(band.map(b => b.x));
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (x1 - x0 < 2 * DAY) { x0 -= 3 * DAY; x1 += 3 * DAY; }
  let ymin = Math.min(...pts.map(p => p.y), ...band.map(b => b.lo));
  let ymax = Math.max(...pts.map(p => p.y), ...band.map(b => b.hi));
  const minSpan = c.minSpan || 1;
  if (ymax - ymin < minSpan) { const mid = (ymax + ymin) / 2; ymin = mid - minSpan / 2; ymax = mid + minSpan / 2; }
  const pad = (ymax - ymin) * 0.08;
  const nt = niceTicks(ymin - pad, ymax + pad, 4);
  const X = x => L + ((x - x0) / (x1 - x0)) * iw;
  const Y = y => { const k = (y - nt.lo) / (nt.hi - nt.lo); return c.invert ? T + k * ih : T + ih - k * ih; };
  const tick = c.yTick || (v => fmtNum(v, 1));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true" class="${animate ? 'anim' : ''}">`;
  for (const v of nt.ticks) {
    const y = r1(Y(v));
    s += `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="axis-text" x="${L - 6}" y="${r1(y + 4)}" text-anchor="end">${esc(tick(v))}</text>`;
  }
  const nx = clamp(Math.floor(iw / 78), 2, 4);
  for (let k = 0; k < nx; k++) {
    const xv = x0 + ((x1 - x0) * k) / (nx - 1);
    const anc = k === 0 ? 'start' : k === nx - 1 ? 'end' : 'middle';
    s += `<text class="axis-text" x="${r1(X(xv))}" y="${H - 6}" text-anchor="${anc}">${esc(fmtDateS(isoOf(new Date(xv))))}</text>`;
  }
  if (band.length > 1) {
    const bs = band.slice().sort((a, b) => a.x - b.x);
    const top = bs.map(b => `${r1(X(b.x))},${r1(Y(b.hi))}`), bot = bs.slice().reverse().map(b => `${r1(X(b.x))},${r1(Y(b.lo))}`);
    s += `<polygon class="band" points="${top.concat(bot).join(' ')}"/>`;
  }
  const path = pts.map(p => `${r1(X(p.x))},${r1(Y(p.y))}`);
  if (c.area && pts.length > 1) {
    const base = c.invert ? T : T + ih;
    s += `<polygon class="area" points="${r1(X(pts[0].x))},${base} ${path.join(' ')} ${r1(X(pts[pts.length - 1].x))},${base}"/>`;
  }
  if (pts.length > 1) s += `<polyline class="ln" pathLength="1" points="${path.join(' ')}"/>`;
  if (pts.length <= 16) pts.slice(0, -1).forEach((p, k) => { s += `<circle class="pt" style="--k:${k}" cx="${r1(X(p.x))}" cy="${r1(Y(p.y))}" r="4"/>`; });
  const lp = pts[pts.length - 1], lx = X(lp.x), ly = Y(lp.y);
  s += `<circle class="dot-end" style="--k:${Math.min(pts.length, 16)}" cx="${r1(lx)}" cy="${r1(ly)}" r="5"/>`;
  // Подпись последнего значения: с той стороны от точки, откуда не приходит линия.
  const prevY = pts.length > 1 ? Y(pts[pts.length - 2].y) : ly;
  let above = prevY >= ly - 2;
  if (above && ly - 14 < T) above = false;
  if (!above && ly + 22 > T + ih) above = true;
  s += `<text class="end-label" x="${r1(Math.min(lx + 4, W - 2))}" y="${r1(above ? ly - 11 : ly + 21)}" text-anchor="end">${esc(c.fmt(lp.y))}</text>`;
  s += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ih}" visibility="hidden"/><circle class="dot-focus" cx="0" cy="0" r="5" visibility="hidden"/>`;
  s += `<rect x="${L - 8}" y="0" width="${iw + 16}" height="${H}" fill="transparent"/></svg><div class="tt"></div>`;
  host.innerHTML = s;
  wireTooltip(host, W, pts.map(p => ({ x: r1(X(p.x)), y: r1(Y(p.y)), main: c.fmt(p.y), sub: p.label || fmtDateS(isoOf(new Date(p.x))) })), true);
}

function drawBars(host, c, animate) {
  const items = c.items;
  if (!items.length) { host.innerHTML = ''; return; }
  const W = Math.max(240, Math.round(host.getBoundingClientRect().width || 320));
  const H = c.h || 150, L = 36, R = 8, T = 20, B = 24, iw = W - L - R, ih = H - T - B;
  const nt = niceTicks(0, Math.max(...items.map(d => d.v), c.target || 0, 0.1) * (c.target ? 1.08 : 1), 4);
  const Y = v => T + ih - ((v - nt.lo) / (nt.hi - nt.lo)) * ih;
  const band = iw / items.length, bw = Math.min(24, band * 0.62);
  const tick = c.yTick || (v => fmtNum(v, 1));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true" class="${animate ? 'anim' : ''}">`;
  for (const v of nt.ticks) {
    const y = r1(Y(v));
    s += `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="axis-text" x="${L - 6}" y="${r1(y + 4)}" text-anchor="end">${esc(tick(v))}</text>`;
  }
  if (c.target) { const ty = r1(Y(c.target)); s += `<line class="target-line" x1="${L}" x2="${W - R}" y1="${ty}" y2="${ty}"/><text class="axis-text" x="${W - R}" y="${r1(ty - 5)}" text-anchor="end">норма</text>`; }
  const step = Math.max(1, Math.ceil(items.length / Math.max(1, Math.floor(iw / 48))));
  const marks = [];
  const y0 = T + ih;
  items.forEach((d, i) => {
    const cx = L + band * i + band / 2, x = r1(cx - bw / 2), y = r1(Y(d.v)), h = y0 - y, rr = Math.min(4, h, bw / 2), w = r1(bw);
    s += h > 0.5
      ? `<path class="bar" style="--k:${i}" d="M${x},${y0}L${x},${r1(y + rr)}Q${x},${y} ${r1(x + rr)},${y}L${r1(x + w - rr)},${y}Q${r1(x + w)},${y} ${r1(x + w)},${r1(y + rr)}L${r1(x + w)},${y0}Z"/>`
      : `<path class="bar" d="M${x},${y0}h${w}v-1h-${w}Z"/>`;
    if ((items.length - 1 - i) % step === 0) s += `<text class="axis-text" x="${r1(cx)}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>`;
    marks.push({ x: r1(cx), y, main: c.fmt(d.v), sub: d.tip || d.label });
  });
  const lm = marks[marks.length - 1];
  s += `<text class="end-label" x="${lm.x}" y="${r1(Math.max(12, lm.y - 6))}" text-anchor="middle">${esc(fmtNum(items[items.length - 1].v, 2))}</text>`;
  s += `<rect x="${L}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg><div class="tt"></div>`;
  host.innerHTML = s;
  wireTooltip(host, W, marks, false);
}

/* ======================================================================
   КОНФЕТТИ И УВЕДОМЛЕНИЯ
   ====================================================================== */
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--accent', '--accent-strong', '--gold', '--chart-2', '--c-coral'].map(n => cs.getPropertyValue(n).trim() || '#8FBBDD').concat(['#FFFFFF']);
  const cv = document.createElement('canvas');
  cv.className = 'confetti';
  document.body.appendChild(cv);
  const W = innerWidth, H = innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const P = [];
  for (let i = 0; i < 130; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.7, sp = 7 + Math.random() * 8;
    P.push({ x: W / 2, y: H * 0.42, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, w: 6 + Math.random() * 6, h: 9 + Math.random() * 7, c: cols[i % cols.length] });
  }
  const t0 = performance.now();
  let prev = t0;
  const frame = t => {
    const dt = Math.min(2.2, (t - prev) / 16.67);
    prev = t;
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.vy += 0.32 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (t - t0 < 2200) requestAnimationFrame(frame); else cv.remove();
  };
  requestAnimationFrame(frame);
}
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function renderTabbar() {
  const tb = $('#tabbar');
  tb.hidden = !S.ready || !!S.loadError || !S.profile;
  const order = TAB_ORDER;
  tb.querySelector('.in').style.setProperty('--ti', Math.max(0, order.indexOf(S.tab)));
  tb.querySelectorAll('.tab').forEach(b => { if (b.dataset.a === S.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const dot = tb.querySelector('.live-dot');
  if (dot) dot.hidden = !S.active;
}
const reduceMotion = () => document.documentElement.dataset.motion === 'none' || !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* Числа «набегают» от нуля при входе на экран */
function countUps(root) {
  if (reduceMotion()) return;
  root.querySelectorAll('[data-count]').forEach(el => {
    const to = Number(el.dataset.count), dec = Number(el.dataset.dec) || 0;
    if (!(to > 0)) return;
    const t0 = performance.now(), dur = 900;
    const step = t => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmtNum(dec ? Math.round(to * e * 10) / 10 : Math.round(to * e), dec);
      if (k < 1) requestAnimationFrame(step);
    };
    el.textContent = fmtNum(0, dec);
    requestAnimationFrame(step);
  });
}

/* mode: 'none' — тихо обновить; 'enter' — элементы выезжают по очереди; 'vt' — внутри плавного перехода */
let enterTimer = 0;
function render(mode = 'none') {
  CHARTS.clear();
  const app = $('#app');
  const fig = $('#bgfig');
  app.classList.toggle('in-session', !!(S.ready && !S.loadError && S.profile && S.active && S.tab === 'today'));

  if (!S.ready) app.innerHTML = viewSplash();
  else if (S.loadError) app.innerHTML = viewLoadError();
  else if (!S.profile) app.innerHTML = viewOnboarding();
  else {
    const views = { today: viewToday, plan: viewPlan, food: viewFood, progress: viewProgress, profile: viewProfile };
    app.innerHTML = (views[S.tab] || viewToday)();

  }

  mountCharts(app, anim);
  if (anim) countUps(app);
  if (mode === 'enter' && !reduceMotion()) {

function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }

/* Плавный переход между состояниями экрана (View Transitions). Без поддержки просто обновляет. */
function runVT(type, update) {
  if (!document.startViewTransition || reduceMotion() || document.hidden) { update(); return false; }
  const root = document.documentElement;
  let done = false;
  const once = () => { if (done) return; done = true; try { update(); } catch (e) { console.error(e); } };
  let t;
  root.dataset.vt = type;
  try { t = document.startViewTransition(once); }
  catch (e) { delete root.dataset.vt; once(); return false; }
  // Страховка: если браузер не дал кадр для перехода, обновляем экран без анимации.
  setTimeout(() => { if (!done) { try { t.skipTransition(); } catch (e) { /* уже завершён */ } once(); } }, 900);
  t.finished.catch(() => {}).finally(() => { if (root.dataset.vt === type) delete root.dataset.vt; });
  return true;
}
/* Предмет перелетает из нажатой карточки в новое окно: источник [data-morph], цель [data-mt]. */
function morphRun(src, update) {
  const name = src.dataset.morph;
  if (!document.startViewTransition || reduceMotion() || document.hidden) { update(); return; }
  const root = document.documentElement;
  let done = false;
  const once = () => {
    if (done) return;
    done = true;
    src.style.viewTransitionName = '';
    VT_SHEET = true;
    try { update(); } catch (e) { console.error(e); }
    VT_SHEET = false;
    const tgt = document.querySelector(`[data-mt="${name}"]`);
    if (tgt) tgt.style.viewTransitionName = 'morph';
  };
  src.style.viewTransitionName = 'morph';
  root.dataset.vt = 'morph';
  let t;
  try { t = document.startViewTransition(once); }
  catch (e) { src.style.viewTransitionName = ''; delete root.dataset.vt; once(); return; }
  setTimeout(() => { if (!done) { try { t.skipTransition(); } catch (e) { /* уже завершён */ } once(); } }, 900);
  t.finished.catch(() => {}).finally(() => {
    document.querySelectorAll('[data-mt]').forEach(el => { el.style.viewTransitionName = ''; });
    if (root.dataset.vt === 'morph') delete root.dataset.vt;
  });
}
const TAB_ORDER = ['today', 'plan', 'food', 'progress', 'profile'];
function go(tab) {
  closeSheet(true);
  if (tab === S.tab) { render(); window.scrollTo(0, 0); return; }
  const dir = TAB_ORDER.indexOf(tab) > TAB_ORDER.indexOf(S.tab) ? 'fwd' : 'back';
  const swap = mode => { S.tab = tab; render(mode); window.scrollTo(0, 0); };
  if (document.startViewTransition && !reduceMotion()) runVT(dir, () => swap('vt'));

}

  if (S.active) keepAwake(true);
  if (!S.ready || S.loadError || S.sheetOpen || Store.pending || Date.now() - hiddenAt < 60000) return;
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (typing) return;
  try {
    const all = await Store.loadAll();
    if (Store.pending) return;
    applyData(all);
    rerender();
    if (S.active) startClock(); else stopSessionExtras();
  } catch (err) { /* останемся на текущих данных */ }
});
window.addEventListener('pagehide', () => { Store.flush(); });

/* ======================================================================
   ЗАПУСК
   ====================================================================== */
Store.onStatus(s => { SYNC = s; paintSync(); });

async function boot() {
  S.ready = false;
  render();
  try {
    S.user = await Store.init();
    applyData(await Store.loadAll());
    S.loadError = null;
  } catch (err) {
    console.error('Не удалось загрузить данные', err);
    S.loadError = err;
  }
  S.ready = true;
  render('enter');
  if (S.active) startClock();
}
boot();
</script>
